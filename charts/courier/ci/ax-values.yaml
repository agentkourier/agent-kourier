# Courier in the AX kind tier (hack/kind/up-ax.sh): the fast tier's courier (fast-values.yaml: the testhooks image on the fake
# Slack, the tier's own ConfigMap), with the config of hack/kind/ax/courier/config, installed as release "courier" in namespace
# "courier".
image:
  repository: courier-e2e/courier-testhooks
  tag: dev
  pullPolicy: Never

extraEnv:
  - {name: COURIER_SLACK_API_URL, value: "http://fakeslack.e2e.svc.cluster.local:8080/"}

config:
  existingConfigMap: courier-config
rbac:
  secretNamespaces: [courier]

persistence:
  # A database file of its own, so that a development cluster's older fixture database, whose experimental migration 12
  # predates main's trace migration, is left intact in the volume.
  dbFile: courier-ax.db
  storageClassName: standard
  retainOnUninstall: false

service:
  enabled: true
