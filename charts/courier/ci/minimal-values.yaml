# The least a working install needs: an image, one connection, one backend and one Binding. Everything else is the default.
image:
  repository: registry.example.test/courier
  tag: v0.1.0

config:
  chatConnections:
    slack-main:
      spec:
        platform: slack
        mode: socket
        credentialsSecretRef: {name: slack-main}
  agentBackends:
    agents:
      spec:
        dialect: kagent-v1
        url: http://kagent-frontdoor.kagent.svc.cluster.local:4180
  bindings:
    sre:
      spec:
        agent:
          backendRef: {name: agents}
          namespace: kagent
          name: k8s-agent
        identity:
          userId: courier-sre
          tokenSecretRef: {name: courier-agent-token}
        chat:
          connectionRef: {name: slack-main}
          channel: C0123456789
          output: live
