# The sandbox tier's courier (hack/kind/sandbox): the production image against a real Slack, answered by an agent behind the
# full tier's verifying front door with a Dex ID token that an hourly CronJob keeps fresh. Placeholders stand in for the
# channel and for anything that is the operator's.
image:
  repository: courier
  tag: dev
  pullPolicy: Never

config:
  chatConnections:
    sandbox-slack:
      spec:
        platform: slack
        mode: socket
        credentialsSecretRef: {name: sandbox-slack} # botToken and appToken
  agentBackends:
    agents:
      spec:
        dialect: kagent-v1
        url: http://kagent-frontdoor.kagent.svc.cluster.local:4180
  bindings:
    sandbox:
      spec:
        agent:
          backendRef: {name: agents}
          namespace: kagent
          name: sandbox-sre
        identity:
          userId: courier-sandbox
          tokenSecretRef: {name: courier-agent-token}
        chat:
          connectionRef: {name: sandbox-slack}
          channel: C0SANDBOX01
          output: live
        interactions: {askUser: true}

tokenRefresh:
  enabled: true
  targetSecret: courier-agent-token
  dex:
    tokenURL: http://dex.dex.svc.cluster.local:5556/dex/token
    clientId: courier-binding
    credentialsSecret: courier-dex-client # clientSecret, username, password
