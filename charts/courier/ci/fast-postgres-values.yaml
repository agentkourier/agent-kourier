# Courier in the fast kind tier on Postgres (E2E_STORE=postgres make e2e-fast-up): fast-values.yaml with the state in the tier's
# Postgres instead of a volume. hack/kind/lib.sh's install_courier installs it as release "courier" in namespace courier; the DSN
# Secret courier-pg (key dsn) is made there, by the script, with a password generated for the cluster and never on an argument list.
image:
  repository: courier-e2e/courier-testhooks # the test image: it has COURIER_SLACK_API_URL, the production one does not
  tag: dev
  pullPolicy: Never # kind loads it; nothing pulls it

extraEnv:
  - {name: COURIER_SLACK_API_URL, value: "http://fakeslack.e2e.svc.cluster.local:8080/"}

config:
  existingConfigMap: courier-config
rbac:
  secretNamespaces: [courier]

store:
  type: postgres
  postgres:
    dsnSecret: {name: courier-pg, key: dsn}

service:
  enabled: true
