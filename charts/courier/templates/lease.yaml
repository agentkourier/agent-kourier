{{- if not (include "courier.sqlite" .) }}
{{- /* The leader election's Lease, made here so that courier's ServiceAccount needs no right to create one (a create cannot be
       limited by name, so it would be the right to create any Lease in the namespace). Empty: the first replica to win it
       writes the holder. Kept on uninstall, as it is courier's record of who led; a reinstall under the same release adopts it. Deleting it while
       courier runs stops leadership until helm upgrade recreates it: courier may not create a Lease. */}}
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: {{ include "courier.leaseName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "courier.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec: {}
{{- end }}
