{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "courier.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "courier.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Courier reads Secrets through the Kubernetes API, so the token is mounted.
automountServiceAccountToken: true
{{- end }}
