apiVersion: v2
name: agent-kourier
description: A Kubernetes-native broker between team chat and streaming A2A agents. Slack messages, and the alerts posted to Slack, become agent sessions in their threads (SQLite on a PVC, or Postgres, which can also run an active/passive pair)
type: application
# A release (hack/release/package-chart.sh) stamps version, appVersion, image.repository and image.digest and pushes the
# chart to oci://ghcr.io/agentkourier/charts. In the source tree they are unstamped, so image.repository has no default.
version: 0.1.2
appVersion: dev
home: https://agentkourier.dev
icon: https://agentkourier.dev/assets/brand/agent-kourier-mark.svg
sources:
  - https://github.com/agentkourier/agent-kourier
maintainers:
  - name: Agent Kourier maintainers
    url: https://github.com/agentkourier
keywords:
  - a2a
  - agent2agent
  - ai-agents
  - slack
  - chatops
  - alertmanager
  - kagent
  - sre
  - incident-response
annotations:
  artifacthub.io/category: ai-machine-learning
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Documentation
      url: https://agentkourier.dev
    - name: Security policy
      url: https://github.com/agentkourier/agent-kourier/blob/main/SECURITY.md
