# The sandbox tier's Agent Kourier (hack/kind/sandbox): the production image against a real Slack, answered by an agent behind the
# full tier's verifying front door with a Dex ID token that an hourly CronJob keeps fresh. Installed as release
# "agent-kourier-sandbox" in namespace "agent-kourier", on the full tier's cluster, beside (never with) the full tier's own Agent Kourier.
# The config is the sandbox's own ConfigMap, which up.sh makes from the files of hack/kind/sandbox/agent-kourier with the operator's
# channel IDs filled in, so none is in this file; its Secrets (the Slack tokens, the Dex client) are in namespace agent-kourier too.
image:
  repository: agent-kourier # what `make image` builds: the production image, which up.sh loads into the cluster
  tag: dev
  pullPolicy: Never

config:
  existingConfigMap: agent-kourier-sandbox-config
rbac:
  secretNamespaces: [agent-kourier]

persistence:
  storageClassName: standard
  retainOnUninstall: false # the sandbox's sessions and outbox go with it (down.sh)

tokenRefresh:
  enabled: true
  targetSecret: agent-kourier-agent-token # the Binding's identity.tokenSecretRef, made by the full tier; the namespace is the release's
  dex:
    tokenURL: http://dex.dex.svc.cluster.local:5556/dex/token
    clientId: agent-kourier-binding
    credentialsSecret: agent-kourier-dex-client # clientSecret, username, password: made by up.sh (the full tier's fake Dex client)
