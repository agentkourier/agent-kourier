# The least a working install needs: an image, one connection, one backend and one Binding. Everything else is the default.
image:
  repository: registry.example.test/agent-kourier
  tag: v0.1.0

# The ConfigMap route, named: config.source defaults to crds, and crds.install to true, which this file's golden output must not pick up.
crds:
  install: false

config:
  source: files
  chatConnections:
    slack-main:
      spec:
        platform: slack
        credentialsSecretRef: {name: slack-main}
  agentBackends:
    agents:
      spec:
        dialect: kagent-v1
        url: http://kagent-frontdoor.kagent.svc.cluster.local:4180
  bindings:
    sre:
      spec:
        agent:
          backendRef: {name: agents}
          namespace: kagent
          name: k8s-agent
        identity:
          userId: agent-kourier-sre
          tokenSecretRef: {name: agent-kourier-agent-token}
        chat:
          connectionRef: {name: slack-main}
          channel: C0123456789
          output: live
