# The AX add-on (addons.ax) on the Anthropic API beside the minimal install, on SQLite at one replica: the model by its Anthropic ID, the
# API key from a Secret (ANTHROPIC_API_KEY), no region and no AWS identity. Also an AgentBackend that names the add-on's Service, a Binding
# whose identity token the add-on accepts (Authorization: Bearer), and the NetworkPolicies of both, whose rule for the model's provider is
# the Anthropic API's.
image:
  repository: registry.example.test/agent-kourier
  tag: v0.1.0

config:
  # The ConfigMap route, named: config.source defaults to crds. crds.install is left unset, which is false with files: no CRD.
  source: files
  chatConnections:
    slack-main:
      spec:
        platform: slack
        credentialsSecretRef: {name: slack-main}
  agentBackends:
    ax:
      spec:
        dialect: a2a
        url: http://agent-kourier-ax.agent-kourier.svc:8090/a2a
  bindings:
    ax-chat:
      spec:
        agent:
          backendRef: {name: ax}
          namespace: ax
          name: assistant
        identity:
          userId: agent-kourier-ax
          tokenSecretRef: {name: ax-token}
        chat:
          connectionRef: {name: slack-main}
          channel: C0123456789
          output: live
          triggers:
            - type: mention

networkPolicy:
  enabled: true
  kubeApiServer:
    cidrs: ["10.0.0.1/32"]

addons:
  ax:
    enabled: true
    image:
      tag: v0.1.0
    model:
      provider: anthropic
      name: claude-haiku-4-5
    anthropicApiKeySecret: {name: anthropic, key: apiKey}
    auth:
      tokenSecret: {name: ax-token}
