# Local AX Task launcher tier. The bring-up applies its Task template, Gateway,
# TLS fixture, Secrets and custom resources.
image:
  repository: agent-kourier-e2e/agent-kourier-testhooks
  tag: dev
  pullPolicy: Never
extraEnv:
  - {name: AGENTKOURIER_SLACK_API_URL, value: "http://fakeslack.e2e.svc.cluster.local:8080/"}
  - {name: AGENTKOURIER_TEST_AGENT_STREAM_TIMEOUT, value: "5s"}
config:
  source: crds
  chatConnection: agent-kourier/slack-main
rbac:
  secretNames:
    agent-kourier: [slack-main, ax-a2a-auth]
persistence:
  dbFile: agent-kourier-ax-launcher.db
  storageClassName: standard
  retainOnUninstall: false
service:
  enabled: true
addons:
  ax:
    enabled: true
    image: {repository: agent-kourier-e2e/ax-launcher, tag: local, pullPolicy: Never}
    server: {address: ax-server.ax-system.svc:8080}
    taskTemplate: {configMap: {name: ax-echo-template}}
    auth: {tokenSecret: {name: ax-a2a-auth}}
    resultCallback:
      url: https://ax-results.agent-kourier.svc.cluster.local/ax/results/v1
      tokenSecret: {name: ax-result-auth}
    replicaCount: 2
    store:
      type: postgres
      postgres: {dsnSecret: {name: ax-kourier-pg, key: dsn}}
    pollInterval: 200ms
    maxRunning: 1
    turnTimeout: 30s
    keepFailed: 5s
