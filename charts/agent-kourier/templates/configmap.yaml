{{- if not .Values.config.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentkourier.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentkourier.labels" . | nindent 4 }}
# One file per resource, named for its kind and name; Agent Kourier reads every *.yaml in the directory.
data:
  {{- range $name, $entry := .Values.config.agentBackends }}
  {{ printf "agentbackend-%s.yaml" $name | quote }}: |
    {{- include "agentkourier.resource" (dict "kind" "AgentBackend" "name" $name "entry" $entry "root" $) | nindent 4 }}
  {{- end }}
  {{- range $name, $entry := .Values.config.chatConnections }}
  {{ printf "chatconnection-%s.yaml" $name | quote }}: |
    {{- include "agentkourier.resource" (dict "kind" "ChatConnection" "name" $name "entry" $entry "root" $) | nindent 4 }}
  {{- end }}
  {{- range $name, $entry := .Values.config.bindings }}
  {{ printf "binding-%s.yaml" $name | quote }}: |
    {{- include "agentkourier.resource" (dict "kind" "Binding" "name" $name "entry" $entry "root" $) | nindent 4 }}
  {{- end }}
{{- end }}
