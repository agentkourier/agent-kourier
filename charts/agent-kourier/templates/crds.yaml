{{- /* The CustomResourceDefinitions that `make crds` generates from api/v1alpha1 into files/crds, as they are, with three additions: the chart's
       labels, helm.sh/resource-policy keep (an uninstall leaves them, and with them every resource of the cluster), and the SHA-256 of the
       generated file as the schema-sha256 annotation, so the schema a cluster serves can be told from the chart's. They are in templates/ and not
       crds/ so that an upgrade of the release applies a changed schema. The file is not parsed and written again, which could change a
       number's form; the three lines go in after the line that opens the metadata. */ -}}
{{- if .Values.crds.install }}
{{- range $path, $_ := .Files.Glob "files/crds/*.yaml" }}
{{- $text := $.Files.Get $path }}
{{- $opening := "(?m)^metadata:\n  annotations:\n" }}
{{- if not (regexMatch $opening $text) }}
{{- fail (printf "%s does not open its metadata with annotations, as controller-gen writes it, so the chart cannot add its own" $path) }}
{{- end }}
{{- $added := printf "metadata:\n  labels:\n%s\n  annotations:\n    helm.sh/resource-policy: keep\n    agentkourier.dev/schema-sha256: %s\n" (include "agentkourier.labels" $ | indent 4) ($text | sha256sum) }}
{{ regexReplaceAllLiteral $opening $text $added | trim }}
{{ end }}
{{- end }}
