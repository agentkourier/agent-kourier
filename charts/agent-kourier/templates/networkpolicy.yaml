{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentkourier.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentkourier.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentkourier.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  {{- if or .Values.networkPolicy.metricsFrom .Values.chatListener.enabled }}
  ingress:
    {{- with .Values.networkPolicy.metricsFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - {port: {{ int $.Values.listen.port }}, protocol: TCP}
    {{- end }}
    {{- if .Values.chatListener.enabled }}
    # The chat port, from chatFrom (which the render requires here): the ingress controller, or the load balancer, that Slack's requests come through.
    - from:
        {{- toYaml .Values.networkPolicy.chatFrom | nindent 8 }}
      ports:
        - {port: {{ int .Values.chatListener.port }}, protocol: TCP}
    {{- end }}
  {{- end }}
  egress:
    # DNS.
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.dns.podSelector | nindent 12 }}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    # The Kubernetes API server: Agent Kourier reads its Secrets there.
    - to:
        {{- range .Values.networkPolicy.kubeApiServer.cidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.kubeApiServer.ports }}
        - {port: {{ int . }}, protocol: TCP}
        {{- end }}
    {{- if .Values.networkPolicy.slack.cidrs }}
    # Slack, over TLS.
    - to:
        {{- range .Values.networkPolicy.slack.cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
            {{- with $.Values.networkPolicy.slack.except }}
            except:
              {{- range . }}
              - {{ . | quote }}
              {{- end }}
            {{- end }}
        {{- end }}
      ports:
        - {port: 443, protocol: TCP}
    {{- end }}
    {{- if eq .Values.store.type "postgres" }}
    # The Postgres database, on its own rule.
    - to:
        {{- toYaml .Values.networkPolicy.postgres.to | nindent 8 }}
      ports:
        - {port: {{ int .Values.networkPolicy.postgres.port }}, protocol: TCP}
    {{- end }}
    {{- if include "agentkourier.cma.enabled" . }}
    # The CMA add-on's pods (addons.cma), which Agent Kourier reaches through the add-on's Service.
    - to:
        - podSelector:
            matchLabels:
              {{- include "agentkourier.cma.selectorLabels" . | nindent 14 }}
      ports:
        - {port: {{ include "agentkourier.cma.port" . | int }}, protocol: TCP}
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
