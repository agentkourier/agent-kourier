{{- if .Values.rbac.create }}
{{- /* The resolver follows each Secret its config refers to with an informer of its own: list and watch on that one Secret, by a
       metadata.name field selector, never get. Kubernetes authorizes such a request by resourceName, so a Role can name single
       Secrets. With config.source files these Roles are namespace-wide, which grants every Secret in the namespace, although Agent
       Kourier keeps in memory only the Opaque ones its config refers to (internal/config/k8ssecrets). Keep those namespaces to ones
       that hold Agent Kourier's. With crds each Role names the Secrets that the chart can see (agentkourier.secretNames: config.*, the served
       ChatConnection's Secret, the DSN's and rbac.secretNames), except in a namespace of rbac.secretNamespaces, which stays namespace-wide. */ -}}
{{- $named := dict }}
{{- $namespaces := include "agentkourier.secretNamespaces" . | fromJsonArray }}
{{- if include "agentkourier.crMode" . }}
{{- $named = include "agentkourier.secretNames" . | fromJson }}
{{- $namespaces = concat (keys $named) .Values.rbac.secretNamespaces | uniq | sortAlpha }}
{{- end }}
{{- $ax := include "agentkourier.addon.enabled" (dict "ctx" . "name" "ax") }}
{{- if and $ax (not (include "agentkourier.crMode" .)) }}
{{- $explicit := include "agentkourier.secretNames" . | fromJson }}
{{- $local := default (list) (get $explicit .Release.Namespace) }}
{{- $namespaces = without $namespaces .Release.Namespace }}
{{- if $local }}
{{- $_ := set $named .Release.Namespace $local }}
{{- $namespaces = append $namespaces .Release.Namespace | sortAlpha }}
{{- end }}
{{- end }}
{{- range $ns := $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agentkourier.fullname" $ }}-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "agentkourier.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    {{- if and (hasKey $named $ns) (not (has $ns $.Values.rbac.secretNamespaces)) }}
    resourceNames: {{ get $named $ns | toJson }}
    {{- end }}
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentkourier.fullname" $ }}-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "agentkourier.labels" $ | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "agentkourier.fullname" $ }}-secrets}
subjects:
  - {kind: ServiceAccount, name: {{ include "agentkourier.serviceAccountName" $ }}, namespace: {{ $.Release.Namespace }}}
{{- end }}
{{- end }}
{{- /* The leader election's Lease is made by the chart (lease.yaml), so Agent Kourier only reads and renews it: get and update on the
       one Lease. No create, which cannot be limited by name. */}}
{{- if and .Values.rbac.create (not (include "agentkourier.sqlite" .)) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agentkourier.fullname" . }}-leader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentkourier.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [{{ include "agentkourier.leaseName" . }}]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentkourier.fullname" . }}-leader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentkourier.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "agentkourier.fullname" . }}-leader}
subjects:
  - {kind: ServiceAccount, name: {{ include "agentkourier.serviceAccountName" . }}, namespace: {{ .Release.Namespace }}}
{{- end }}
{{- /* With the chat listener, the leader labels its own pod (agentkourier.dev/role=leader) for the chat Service, and every replica takes the
       label off its own: a merge patch of the pod's labels, which needs patch and nothing else (no get). The pods of a Deployment are named
       by its ReplicaSet, so the chart cannot know the name for resourceNames, and the Role covers every pod of the release namespace. */}}
{{- if and .Values.rbac.create .Values.chatListener.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agentkourier.fullname" . }}-leader-label
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentkourier.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentkourier.fullname" . }}-leader-label
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentkourier.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "agentkourier.fullname" . }}-leader-label}
subjects:
  - {kind: ServiceAccount, name: {{ include "agentkourier.serviceAccountName" . }}, namespace: {{ .Release.Namespace }}}
{{- /* What the Role cannot say, the API server checks: the broker's ServiceAccount may change the label agentkourier.dev/role, to leader or
       away, on its own pod and on nothing else. The pod is the one its token is bound to: the kubelet's projected token carries the pod's
       name in the user's extra authentication.kubernetes.io/pod-name. Without this, patch on pods would let the broker change any pod of
       the namespace, its image say, the token-refresh CronJob's included, whose ServiceAccount may patch a Binding's token Secret. */}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "agentkourier.leaderLabelPolicyName" . }}
  labels:
    {{- include "agentkourier.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [pods]
  matchConditions:
    - name: the-brokers-service-account
      expression: request.userInfo.username == {{ printf "system:serviceaccount:%s:%s" .Release.Namespace (include "agentkourier.serviceAccountName" .) | squote }}
  variables:
    - name: role
      expression: "'agentkourier.dev/role'"
    - name: oldLabels
      expression: "has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}"
    - name: newLabels
      expression: "has(object.metadata.labels) ? object.metadata.labels : {}"
  validations:
    - expression: >-
        'authentication.kubernetes.io/pod-name' in request.userInfo.extra &&
        request.userInfo.extra['authentication.kubernetes.io/pod-name'] == [object.metadata.name]
      message: the broker may change only its own pod, the one its token is bound to
      reason: Forbidden
    - expression: >-
        variables.newLabels.all(k, k == variables.role || (k in variables.oldLabels && variables.oldLabels[k] == variables.newLabels[k])) &&
        variables.oldLabels.all(k, k == variables.role || k in variables.newLabels)
      message: the broker may change only the label agentkourier.dev/role of its pod
      reason: Forbidden
    - expression: "!(variables.role in variables.newLabels) || variables.newLabels[variables.role] == 'leader'"
      message: the label agentkourier.dev/role may only be leader
      reason: Forbidden
    - expression: >-
        object.spec == oldObject.spec &&
        (has(object.metadata.annotations) ? object.metadata.annotations : {}) == (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}) &&
        (has(object.metadata.finalizers) ? object.metadata.finalizers : []) == (has(oldObject.metadata.finalizers) ? oldObject.metadata.finalizers : []) &&
        (has(object.metadata.ownerReferences) ? object.metadata.ownerReferences : []) == (has(oldObject.metadata.ownerReferences) ? oldObject.metadata.ownerReferences : [])
      message: the broker may change only the labels of its pod, not its spec, annotations, finalizers or owners
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "agentkourier.leaderLabelPolicyName" . }}
  labels:
    {{- include "agentkourier.labels" . | nindent 4 }}
spec:
  policyName: {{ include "agentkourier.leaderLabelPolicyName" . }}
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
{{- end }}
{{- /* With config.source crds, what the broker does to the custom resources, and no more. Every replica reads the three kinds with informers
       (list and watch, never get: internal/config/crsource), in every namespace, which is why this is a ClusterRole; the leader writes
       Binding.status with a server-side apply, a patch on the status subresource of bindings (no create, update or get). The CRDs may be
       got by name, and only those three, so the broker can compare the schema-sha256 annotation of each with the hash it was built with (crdschema.go).
       With config.connectionNamespaceSelector set to select by label, the broker also follows namespaces' labels with an informer (list and watch,
       never get) to know which namespaces it admits; {} selects every namespace without reading one, and no selector reads none, so neither gets the rule. */}}
{{- if and .Values.rbac.create (include "agentkourier.crMode" .) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "agentkourier.clusterRoleName" . }}
  labels:
    {{- include "agentkourier.labels" . | nindent 4 }}
rules:
  - apiGroups: [agentkourier.dev]
    resources: [agentbackends, bindings, chatconnections]
    verbs: [list, watch]
  - apiGroups: [agentkourier.dev]
    resources: [bindings/status]
    verbs: [patch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames: [agentbackends.agentkourier.dev, bindings.agentkourier.dev, chatconnections.agentkourier.dev]
    verbs: [get]
  {{- $selector := include "agentkourier.connectionNamespaceSelector" . }}
  {{- if and $selector (ne $selector "{}") }}
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list, watch]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "agentkourier.clusterRoleName" . }}
  labels:
    {{- include "agentkourier.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "agentkourier.clusterRoleName" . }}}
subjects:
  - {kind: ServiceAccount, name: {{ include "agentkourier.serviceAccountName" . }}, namespace: {{ .Release.Namespace }}}
{{- end }}
