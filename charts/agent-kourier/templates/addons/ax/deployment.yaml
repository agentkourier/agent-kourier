{{- if include "agentkourier.ax.enabled" . }}
{{- include "agentkourier.ax.validate" . }}
{{- $ax := .Values.addons.ax }}
{{- $port := include "agentkourier.ax.port" . | int }}
# The AX add-on: an ADK agent on Amazon Bedrock or the Anthropic API that serves A2A, which Agent Kourier reaches through the Service of the
# same name. It runs standalone (RUNNER_URL unset): the AX route's runner is not in this pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentkourier.ax.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentkourier.ax.labels" . | nindent 4 }}
spec:
  replicas: {{ $ax.replicaCount }}
  {{- if include "agentkourier.ax.sqlite" . }}
  # The SQLite volume is never mounted by two pods: the old one is gone before the new one starts.
  strategy: {type: Recreate}
  {{- else }}
  # With Postgres the new pod starts beside the old one, and the replicas' election says which serves: one pod is never taken away before
  # its replacement is Ready.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agentkourier.ax.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentkourier.ax.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ax-addon
        {{- with omit $ax.podLabels "app.kubernetes.io/name" "app.kubernetes.io/instance" "app.kubernetes.io/component" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $ax.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "agentkourier.ax.fullname" . }}
      # The add-on never calls the Kubernetes API.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $ax.podSecurityContext | nindent 8 }}
      containers:
        - name: ax
          image: {{ include "agentkourier.ax.image" . | quote }}
          imagePullPolicy: {{ $ax.image.pullPolicy }}
          # The add-on takes no arguments: it is configured by this environment.
          env:
            - {name: MODEL_PROVIDER, value: {{ $ax.model.provider | quote }}}
            {{- $anthropic := eq $ax.model.provider "anthropic" }}
            {{- if not $anthropic }}
            - {name: MODEL_REGION, value: {{ $ax.model.region | quote }}}
            {{- end }}
            - {name: MODEL_NAME, value: {{ $ax.model.name | quote }}}
            {{- if $anthropic }}
            {{- /* The Anthropic SDK reads the key from this variable. */}}
            - name: ANTHROPIC_API_KEY
              valueFrom: {secretKeyRef: {name: {{ $ax.anthropicApiKeySecret.name | quote }}, key: {{ $ax.anthropicApiKeySecret.key | quote }}}}
            {{- else }}
            {{- /* Without a Bedrock API key the AWS SDK's default chain finds the credentials: IRSA or EKS Pod Identity, through the
                   ServiceAccount. */}}
            {{- with $ax.bedrock.apiKeySecret }}
            {{- if .name }}
            - name: AWS_BEARER_TOKEN_BEDROCK
              valueFrom: {secretKeyRef: {name: {{ .name | quote }}, key: {{ .key | quote }}}}
            {{- end }}
            {{- end }}
            {{- end }}
            - {name: LISTEN_ADDR, value: {{ printf ":%d" $port | quote }}}
            - {name: PUBLIC_URL, value: {{ include "agentkourier.ax.publicURL" . | quote }}}
            {{- /* A file, not a variable: the kubelet updates a mounted Secret in place, and the add-on re-reads the file when it changes. */}}
            - {name: AUTH_TOKEN_FILE, value: /etc/agent-kourier-ax/auth/tokens}
            {{- with $ax.auth.header }}
            - {name: AUTH_HEADER, value: {{ . | quote }}}
            {{- end }}
            - {name: STORE, value: {{ $ax.store.type | quote }}}
            {{- if include "agentkourier.ax.sqlite" . }}
            - {name: SQLITE_PATH, value: /data/ax.db}
            {{- else }}
            - name: POSTGRES_DSN
              valueFrom: {secretKeyRef: {name: {{ $ax.store.postgres.dsnSecret.name | quote }}, key: {{ $ax.store.postgres.dsnSecret.key | quote }}}}
            {{- /* The election: the pod's name holds the lease, and its address is where the standbys forward to. POD_IP comes before
                   ADVERTISE_URL, which refers to it. */}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - {name: ADVERTISE_URL, value: {{ printf "http://$(POD_IP):%d" $port | quote }}}
            {{- with $ax.leaderElection.leaseDuration }}
            - {name: LEASE_DURATION, value: {{ . | quote }}}
            {{- end }}
            {{- with $ax.leaderElection.renewDeadline }}
            - {name: LEASE_RENEW_DEADLINE, value: {{ . | quote }}}
            {{- end }}
            {{- with $ax.leaderElection.retryPeriod }}
            - {name: LEASE_RETRY_PERIOD, value: {{ . | quote }}}
            {{- end }}
            {{- end }}
            {{- with $ax.sessionIdleTTL }}
            - {name: SESSION_IDLE_TTL, value: {{ . | quote }}}
            {{- end }}
            {{- with $ax.taskRetention }}
            - {name: TASK_RETENTION, value: {{ . | quote }}}
            {{- end }}
            - {name: LOG_LEVEL, value: {{ $ax.logLevel | quote }}}
            {{- /* Before extraEnv, which may set GOMEMLIMIT itself: the helper renders nothing then. It reads .Values.resources and
                   .Values.extraEnv, so it is handed the add-on's. */}}
            {{- with include "agentkourier.goMemLimit" (dict "Values" $ax) }}
            - {name: GOMEMLIMIT, value: {{ . | quote }}}
            {{- end }}
            {{- with $ax.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - {name: http, containerPort: {{ $port }}}
          # /healthz says the process is alive: 200 once it listens. /readyz says it can serve: on a standby at once (it forwards to the
          # leader), so every replica is in the Service, and on a leader once its start-up work (opening its store, failing the turns a
          # restart cut off) is done. The startup probe asks /readyz, so it bounds that work, and the liveness and readiness probes begin
          # only once it has passed.
          startupProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 2, failureThreshold: 30}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10, failureThreshold: 3}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          resources:
            {{- toYaml $ax.resources | nindent 12 }}
          securityContext:
            {{- toYaml $ax.securityContext | nindent 12 }}
          volumeMounts:
            - {name: auth, mountPath: /etc/agent-kourier-ax/auth, readOnly: true}
            {{- if include "agentkourier.ax.sqlite" . }}
            - {name: data, mountPath: /data}
            {{- end }}
            - {name: tmp, mountPath: /tmp}
      {{- with $ax.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $ax.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $ax.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        # The accepted tokens, the Secret's one key as the file AUTH_TOKEN_FILE names. Mounted without subPath, so the kubelet's updates
        # reach the pod. Readable by the pod's group (fsGroup), not by others.
        - name: auth
          secret:
            secretName: {{ $ax.auth.tokenSecret.name | quote }}
            items: [{key: {{ $ax.auth.tokenSecret.key | quote }}, path: tokens}]
            defaultMode: 0440
        {{- if include "agentkourier.ax.sqlite" . }}
        - name: data
          persistentVolumeClaim: {claimName: {{ include "agentkourier.ax.pvcName" . }}}
        {{- end }}
        - name: tmp
          emptyDir: {}
{{- end }}
