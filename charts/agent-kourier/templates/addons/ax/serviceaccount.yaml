{{- if include "agentkourier.ax.enabled" . }}
# The add-on's own ServiceAccount, with no API token mounted: the add-on never calls the Kubernetes API, and the chart grants it nothing.
# Its annotations (addons.ax.serviceAccount.annotations) are where IRSA's role goes, for the AWS SDK's default chain.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentkourier.ax.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentkourier.ax.labels" . | nindent 4 }}
  {{- with .Values.addons.ax.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
