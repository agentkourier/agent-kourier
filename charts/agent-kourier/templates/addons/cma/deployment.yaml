{{- /* The add-on's startup probe, which the add-ons' Deployment template (templates/addons/_addon.tpl) includes. It is in this file
       because the add-on's limits test reads it here and holds it to docs/reference/limits.md. */}}
{{- define "agentkourier.addon.cma.startupProbe" -}}
# Its start-up work: reconciling its sessions with CMA, and failing the turns a restart cut off.
startupProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 2, failureThreshold: 30}
{{- end -}}
{{- include "agentkourier.addon.deployment" (dict "ctx" . "name" "cma") }}
