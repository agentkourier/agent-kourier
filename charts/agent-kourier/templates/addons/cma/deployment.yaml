{{- if include "agentkourier.cma.enabled" . }}
{{- include "agentkourier.cma.validate" . }}
{{- $cma := .Values.addons.cma }}
{{- $port := include "agentkourier.cma.port" . | int }}
# The Claude Managed Agents add-on: an A2A server in front of one CMA agent, which Agent Kourier reaches through the Service of the same name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentkourier.cma.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentkourier.cma.labels" . | nindent 4 }}
spec:
  replicas: {{ $cma.replicaCount }}
  {{- if include "agentkourier.cma.sqlite" . }}
  # The SQLite volume is never mounted by two pods: the old one is gone before the new one starts.
  strategy: {type: Recreate}
  {{- else }}
  # With Postgres the new pod starts beside the old one, and the replicas' election says which serves: one pod is never taken away before
  # its replacement is Ready.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agentkourier.cma.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentkourier.cma.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cma-addon
        {{- with omit $cma.podLabels "app.kubernetes.io/name" "app.kubernetes.io/instance" "app.kubernetes.io/component" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $cma.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "agentkourier.cma.fullname" . }}
      # The add-on never calls the Kubernetes API.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $cma.podSecurityContext | nindent 8 }}
      containers:
        - name: cma
          image: {{ include "agentkourier.cma.image" . | quote }}
          imagePullPolicy: {{ $cma.image.pullPolicy }}
          # The add-on takes no arguments: it is configured by this environment.
          env:
            - {name: CMA_AGENT_ID, value: {{ $cma.agentId | quote }}}
            - {name: CMA_ENVIRONMENT_ID, value: {{ $cma.environmentId | quote }}}
            - name: ANTHROPIC_API_KEY
              valueFrom: {secretKeyRef: {name: {{ $cma.anthropicApiKeySecret.name | quote }}, key: {{ $cma.anthropicApiKeySecret.key | quote }}}}
            - {name: LISTEN_ADDR, value: {{ printf ":%d" $port | quote }}}
            - {name: PUBLIC_URL, value: {{ include "agentkourier.cma.publicURL" . | quote }}}
            {{- /* A file, not a variable: the kubelet updates a mounted Secret in place, and the add-on re-reads the file when it changes. */}}
            - {name: AUTH_TOKEN_FILE, value: /etc/agent-kourier-cma/auth/tokens}
            {{- with $cma.auth.header }}
            - {name: AUTH_HEADER, value: {{ . | quote }}}
            {{- end }}
            - {name: STORE, value: {{ $cma.store.type | quote }}}
            {{- if include "agentkourier.cma.sqlite" . }}
            - {name: SQLITE_PATH, value: /data/cma.db}
            {{- else }}
            - name: POSTGRES_DSN
              valueFrom: {secretKeyRef: {name: {{ $cma.store.postgres.dsnSecret.name | quote }}, key: {{ $cma.store.postgres.dsnSecret.key | quote }}}}
            {{- /* The election: the pod's name holds the lease, and its address is where the standbys forward to. POD_IP comes before
                   ADVERTISE_URL, which refers to it. */}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - {name: ADVERTISE_URL, value: {{ printf "http://$(POD_IP):%d" $port | quote }}}
            {{- with $cma.leaderElection.leaseDuration }}
            - {name: LEASE_DURATION, value: {{ . | quote }}}
            {{- end }}
            {{- with $cma.leaderElection.renewDeadline }}
            - {name: LEASE_RENEW_DEADLINE, value: {{ . | quote }}}
            {{- end }}
            {{- with $cma.leaderElection.retryPeriod }}
            - {name: LEASE_RETRY_PERIOD, value: {{ . | quote }}}
            {{- end }}
            {{- end }}
            {{- with $cma.sessionIdleTTL }}
            - {name: SESSION_IDLE_TTL, value: {{ . | quote }}}
            {{- end }}
            {{- with $cma.toolResultTimeout }}
            - {name: TOOL_RESULT_TIMEOUT, value: {{ . | quote }}}
            {{- end }}
            {{- with $cma.taskRetention }}
            - {name: TASK_RETENTION, value: {{ . | quote }}}
            {{- end }}
            - {name: LOG_LEVEL, value: {{ $cma.logLevel | quote }}}
            {{- /* Before extraEnv, which may set GOMEMLIMIT itself: the helper renders nothing then. It reads .Values.resources and
                   .Values.extraEnv, so it is handed the add-on's. */}}
            {{- with include "agentkourier.goMemLimit" (dict "Values" $cma) }}
            - {name: GOMEMLIMIT, value: {{ . | quote }}}
            {{- end }}
            {{- with $cma.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - {name: http, containerPort: {{ $port }}}
          # /healthz says the process is alive; /readyz says it can serve, a standby included (it forwards to the leader), so every
          # replica is in the Service. The startup probe gives the add-on time to reconcile its sessions with CMA before the others begin.
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 2, failureThreshold: 30}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10, failureThreshold: 3}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          resources:
            {{- toYaml $cma.resources | nindent 12 }}
          securityContext:
            {{- toYaml $cma.securityContext | nindent 12 }}
          volumeMounts:
            - {name: auth, mountPath: /etc/agent-kourier-cma/auth, readOnly: true}
            {{- if include "agentkourier.cma.sqlite" . }}
            - {name: data, mountPath: /data}
            {{- end }}
            - {name: tmp, mountPath: /tmp}
      {{- with $cma.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $cma.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $cma.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        # The accepted tokens, the Secret's one key as the file AUTH_TOKEN_FILE names. Mounted without subPath, so the kubelet's updates
        # reach the pod. Readable by the pod's group (fsGroup), not by others.
        - name: auth
          secret:
            secretName: {{ $cma.auth.tokenSecret.name | quote }}
            items: [{key: {{ $cma.auth.tokenSecret.key | quote }}, path: tokens}]
            defaultMode: 0440
        {{- if include "agentkourier.cma.sqlite" . }}
        - name: data
          persistentVolumeClaim: {claimName: {{ include "agentkourier.cma.pvcName" . }}}
        {{- end }}
        - name: tmp
          emptyDir: {}
{{- end }}
