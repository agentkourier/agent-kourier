{{- if include "agentkourier.cma.enabled" . }}
# The add-on's own ServiceAccount, with no API token mounted: the add-on never calls the Kubernetes API, and the chart grants it nothing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentkourier.cma.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentkourier.cma.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
