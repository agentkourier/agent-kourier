---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: agentbackends.agentkourier.dev
spec:
  group: agentkourier.dev
  names:
    categories:
    - agentkourier
    kind: AgentBackend
    listKind: AgentBackendList
    plural: agentbackends
    shortNames:
    - akbackend
    singular: agentbackend
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AgentBackend describes an A2A server that hosts agents. Owned
          by the platform team.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentBackendSpec is the desired state of an AgentBackend.
            properties:
              allowedNamespaces:
                description: |-
                  AllowedNamespaces lists the other namespaces whose Bindings may reference this backend. Each is a DNS-1123 label.
                  An empty list permits references only from the backend's own namespace.
                items:
                  maxLength: 63
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                  type: string
                type: array
              dialect:
                description: Dialect selects how Agent Kourier speaks to an agent
                  backend.
                enum:
                - a2a
                - kagent-v1
                type: string
              headers:
                description: Headers are sent on every request. Omitted headers add
                  no static headers. At most 32.
                items:
                  description: |-
                    Header is a static HTTP header. Set exactly one of value and valueSecretRef; valueSecretRef's key
                    defaults to "token", as for the other single-value Secret references. A header that carries or selects
                    identity is refused, because the Binding identity owns it: Authorization, Proxy-Authorization, Cookie,
                    X-User-Id, X-Agent-Name, X-Share-Token and X-Kagent-Insecure-Runtime-Identity.
                  properties:
                    name:
                      description: Name is at most 256 bytes.
                      maxLength: 256
                      minLength: 1
                      type: string
                      x-kubernetes-validations:
                      - message: is longer than the 256 byte limit
                        rule: size(bytes(self)) <= 256
                      - message: header is reserved for the Binding identity
                        rule: '!(self.lowerAscii() in [''authorization'', ''proxy-authorization'',
                          ''cookie'', ''x-user-id'', ''x-agent-name'', ''x-share-token'',
                          ''x-kagent-insecure-runtime-identity''])'
                    value:
                      type: string
                    valueSecretRef:
                      description: SecretKeyRef names one value in a Secret in the
                        referring object's namespace.
                      properties:
                        key:
                          default: token
                          description: |-
                            Key selects the entry of the Secret. It defaults to "token". It consists of at most 253 alphanumeric characters,
                            '-', '_' or '.', and is neither "." nor "..", nor does it start with "..".
                          maxLength: 253
                          pattern: ^(\.?[-_a-zA-Z0-9][-._a-zA-Z0-9]*)?$
                          type: string
                        name:
                          description: |-
                            Name is a DNS-1123 subdomain: at most 253 lowercase letters, digits, '-' or '.', starting and ending with a
                            letter or digit.
                          maxLength: 253
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          type: string
                      required:
                      - name
                      type: object
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: set exactly one of value and valueSecretRef
                    rule: (has(self.value) && self.value != "") != has(self.valueSecretRef)
                maxItems: 32
                type: array
              url:
                description: |-
                  URL is the http or https base URL for kagent-v1, or the exact JSON-RPC endpoint for a2a.
                  The a2a card must be served at URL + "/.well-known/agent-card.json", as AX does.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: must be an http or https URL with a host
                  rule: self.matches('(?i)^https?://[^/?#]')
                - message: must not contain credentials; identity comes from the Binding
                  rule: '!self.matches(''(?i)^https?://[^/?#]*@'')'
                - message: 'invalid URL: must not contain control characters'
                  rule: '!self.matches(r''[\x00-\x1f\x7f]'')'
                - message: 'invalid URL: the host must not contain a space, backslash,
                    caret, backtick, brace or bar'
                  rule: '!self.matches(r''(?i)^https?://[^/?#]*[ \\^\x60{|}]'')'
            required:
            - dialect
            - url
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
