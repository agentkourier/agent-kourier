---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    agentkourier.dev/schema-sha256: 6ed5a52c43b4f8001c9c3e488d7125ed376e5f846bd8348bd1ff2011c67439e2
    controller-gen.kubebuilder.io/version: v0.23.0
  name: chatconnections.agentkourier.dev
spec:
  group: agentkourier.dev
  names:
    categories:
    - agentkourier
    kind: ChatConnection
    listKind: ChatConnectionList
    plural: chatconnections
    shortNames:
    - akconnection
    singular: chatconnection
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ChatConnection is a workspace connection. The platform team owns
          the broker's own; a team may own one in a namespace the platform admits.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ChatConnectionSpec is the desired state of a ChatConnection.
            properties:
              allowedNamespaces:
                description: |-
                  AllowedNamespaces lists the other namespaces whose Bindings may reference this connection. Each is a DNS-1123 label.
                  An empty list permits references only from the connection's own namespace. At most 256.
                items:
                  maxLength: 63
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                  type: string
                maxItems: 256
                type: array
              credentialsSecretRef:
                description: |-
                  CredentialsSecretRef names one Secret whose keys are fixed by the platform and its mode. A Slack connection in Socket Mode needs
                  botToken and appToken; one in HTTP mode needs botToken and signingSecret.
                properties:
                  name:
                    description: |-
                      Name is a DNS-1123 subdomain: at most 253 lowercase letters, digits, '-' or '.', starting and ending with a
                      letter or digit.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              platform:
                enum:
                - slack
                type: string
              slack:
                description: |-
                  Slack holds the settings of a Slack connection. Only a connection whose platform is slack may set it. Omitted, the connection
                  uses Socket Mode.
                properties:
                  mode:
                    description: |-
                      Mode selects how Slack delivers the app's events and button presses: socket, over a Socket Mode WebSocket that Agent Kourier
                      opens, or http, as Events API and interactivity requests that Slack sends to Agent Kourier, signed with the app's signing
                      secret. The mode sets the keys of the credentials Secret (credentialsSecretRef). This version does not serve http: the broker
                      refuses to start for its own connection in HTTP mode, and does not start a team connection in HTTP mode.
                    enum:
                    - socket
                    - http
                    - ""
                    type: string
                type: object
            required:
            - credentialsSecretRef
            - platform
            type: object
            x-kubernetes-validations:
            - fieldPath: .slack
              message: is set, but only a slack connection has one
              rule: '!has(self.slack) || self.platform == ''slack'''
        required:
        - spec
        type: object
    served: true
    storage: true
