          spec:
            description: ChatConnectionSpec is the desired state of a ChatConnection.
            properties:
              allowedNamespaces:
                description: |-
                  AllowedNamespaces lists the other namespaces whose Bindings may reference this connection. Each is a DNS-1123 label.
