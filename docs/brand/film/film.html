<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Kourier film v2</title>
<!--
  Motion graphics and footage frames for the v2 film. Everything is a pure function of time.
    ?ar=16x9|9x16|1x1
    &seg=p1|p2|p3|reveal|promise|yaml|close|t-problem|t-reveal|t-end   renderAt(t) draws the segment at local time t
    &overlay=1&card=x,y,w,h&cap=...&sub=...&speed=...&cmd=...           a transparent-holed frame that sits over real footage
  build.mjs drives both. Preview a still with &t=<seconds>.
-->
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  svg { display: block; }
  text { font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .mono { font-family: "SF Mono", Menlo, Monaco, monospace; }
</style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
'use strict';

// Palette: Kubernetes blue, white, navy. The brand's dark-background variant for the mark.
const C = {
  navy: '#0A1530', night: '#060D20', panel: '#122650', deep: '#1D3F91', k8s: '#326CE5',
  feather: '#5B8DEF', eye: '#1E3A8A', white: '#FFFFFF', alert: '#E5484D', lattice: '#16306E',
};

const Q = new URLSearchParams(location.search);
const AR = Q.get('ar') || '16x9';

// On-screen copy. Narration lives in narration.json; these are the captions cut from it.
const COPY = {
  p1: { wide: [['You’ve put AI agents', 'on Kubernetes.'], ['They can read logs, check rollouts', 'and find the cause.']],
        tall: [['You’ve put AI agents', 'on Kubernetes.'], ['They can read logs, check', 'rollouts and find the cause.']] },
  p2: { wide: [['But they only work when', 'someone opens a prompt and asks.'], []],
        tall: [['But they only work', 'when someone opens', 'a prompt and asks.'], []] },
  p3: { wide: [['Alerts fire in your monitoring.', 'Questions come up in chat.'], ['Your agents hear neither.']],
        tall: [['Alerts fire in', 'your monitoring.', 'Questions come up', 'in chat.'], ['Your agents hear neither.']] },
  reveal: { wide: [['Introducing Agent Kourier'], ['A Kubernetes-native broker between team chat', 'and streaming A2A agents.']],
            tall: [['Introducing', 'Agent Kourier'], ['A Kubernetes-native broker', 'between team chat and', 'streaming A2A agents.']] },
  promise: { wide: [['An alert or a question', 'becomes an agent session.'], ['In the thread. Slack today.']],
             tall: [['An alert or', 'a question', 'becomes an', 'agent session.'], ['In the thread. Slack today.']] },
  tproblem: { wide: [['Your agent is ready.'], ['The chat integration is another project.']],
              tall: [['Your agent', 'is ready.'], ['The chat integration', 'is another project.']] },
  yaml: { '16x9': [['One Binding', 'per channel.'], ['Declared in YAML,', 'next to your agent.']],
          '1x1': [['One Binding per channel.'], ['Declared in YAML, next to your agent.']],
          '9x16': [['One Binding', 'per channel.'], ['Declared in YAML,', 'next to your agent.']] },
  pills: ['kagent, or any A2A agent that streams', 'It answers, asks back, and keeps the context', 'Slack today, more chat platforms planned'],
  pillAt: [0.2, 4.0, 10.6],
  can: ['logs', 'rollouts', 'events'],
  hook: 'Write the agent, not the chat integration.',
  category: 'A Kubernetes-native broker between team chat and streaming A2A agents',
};

// The Binding the demo ran with: hack/kind/sandbox/agent-kourier/config/binding.yaml, comments removed and the
// channel ID replaced by a placeholder (the real one names a channel in the owner's workspace).
const YAML = [
  'apiVersion: agentkourier.dev/v1alpha1',
  'kind: Binding',
  'metadata: {name: sandbox, namespace: agent-kourier}',
  'spec:',
  '  agent:',
  '    backendRef: {namespace: agent-kourier, name: agents}',
  '    namespace: kagent',
  '    name: sandbox-sre',
  '  identity:',
  '    userId: agent-kourier-sandbox',
  '    tokenSecretRef: {name: agent-kourier-agent-token}',
  '  chat:',
  '    connectionRef: {namespace: agent-kourier, name: sandbox-slack}',
  '    channel: C0123456789',
  '    output: live',
  '  interactions: {askUser: true}',
];

const LAYOUTS = {
  '16x9': {
    W: 1920, H: 1080, s: 1, copy: 'wide',
    head: { x: 120, y: 170, size: 68, sub: 42, gap: 1.2, center: true },
    am: [420, 560], slack: [420, 830], k: [960, 695], agents: [[1540, 525], [1540, 695], [1540, 865]],
    r: 64, kSize: 250, tile: 128, firing: [480, 462],
    prompt: { cx: 760, cy: 695, w: 560, h: 92 },
    thread: { x: 110, y: 742, w: 220 }, bubble: [555, 698],
    yaml: { x: 860, y: 214, w: 980, size: 22.5, headX: 120, headY: 470, side: true },
    pills: { cx: 960, y: 368, size: 40, w: 1080, h: 96, gap: 28 },
    end: { mode: 'row', cx: 960, cy: 470, mark: 300, word: 118, hook: 46, cat: 27 },
    cap: { size: 50, sub: 30, mark: 64 },
  },
  '1x1': {
    W: 1080, H: 1080, s: 0.82, copy: 'wide',
    head: { x: 70, y: 130, size: 52, sub: 34, gap: 1.22, center: true },
    am: [170, 520], slack: [170, 760], k: [540, 640], agents: [[910, 500], [910, 640], [910, 780]],
    r: 54, kSize: 200, tile: 104, firing: [215, 438],
    prompt: { cx: 480, cy: 640, w: 400, h: 76 },
    thread: { x: 260, y: 790, w: 210 }, bubble: [280, 628],
    yaml: { x: 40, y: 290, w: 1000, size: 22, headX: 70, headY: 130 },
    pills: { cx: 540, y: 379, size: 34, w: 880, h: 90, gap: 26 },
    end: { mode: 'stack', cx: 540, cy: 410, mark: 300, word: 96, hook: 40, cat: 24 },
    cap: { size: 46, sub: 28, mark: 40 },
  },
  '9x16': {
    W: 1080, H: 1920, s: 1.15, copy: 'tall',
    head: { x: 90, y: 280, size: 80, sub: 50, gap: 1.2, center: true },
    am: [320, 960], slack: [760, 960], k: [540, 1210], agents: [[280, 1520], [540, 1520], [800, 1520]],
    r: 80, kSize: 280, tile: 150, firing: [418, 960], sourceLabel: 'above', kLabel: 'below',
    prompt: { cx: 540, cy: 1210, w: 660, h: 104 },
    thread: { x: 760, y: 1090, w: 250 }, bubble: [845, 900],
    yaml: { x: 40, y: 880, w: 1000, size: 22, headX: 90, headY: 440 },
    pills: { cx: 540, y: 750, size: 42, w: 940, h: 116, gap: 36 },
    end: { mode: 'stack', cx: 540, cy: 820, mark: 360, word: 116, hook: 46, cat: 27 },
    cap: { size: 66, sub: 40, mark: 46 },
  },
};
const L = LAYOUTS[AR];

// ---------- helpers ----------
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v);
  if (parent) parent.appendChild(n);
  return n;
}
function set(n, attrs) { for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); }
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const outCubic = p => 1 - Math.pow(1 - p, 3);
const inOutCubic = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const outBack = p => { const c = 1.6; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const win = (t, a, b, c, d) => Math.min(outCubic(ramp(t, a, b)), 1 - ramp(t, c, d));
function mix(a, b, p) {
  const pa = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16));
  const pb = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
  return '#' + pa.map((v, i) => Math.round(lerp(v, pb[i], clamp(p))).toString(16).padStart(2, '0')).join('');
}
function hexPoints(cx, cy, r) {
  const p = [];
  for (let i = 0; i < 6; i++) { const a = Math.PI / 180 * (60 * i - 90); p.push(`${(cx + r * Math.cos(a)).toFixed(2)},${(cy + r * Math.sin(a)).toFixed(2)}`); }
  return p.join(' ');
}
function fit(t, maxW) {
  const w = t.getComputedTextLength();
  if (w > maxW) t.setAttribute('font-size', (parseFloat(t.getAttribute('font-size')) * maxW / w).toFixed(1));
}
// Greedy word wrap, measured with the real font.
function wrap(text, attrs, maxW, parent) {
  const probe = el('text', attrs, parent);
  const lines = [];
  let cur = '';
  for (const word of text.split(' ')) {
    const next = cur ? cur + ' ' + word : word;
    probe.textContent = next;
    if (cur && probe.getComputedTextLength() > maxW) { lines.push(cur); cur = word; } else cur = next;
  }
  if (cur) lines.push(cur);
  probe.remove();
  return lines;
}

// ---------- stage ----------
const svg = document.getElementById('stage');
set(svg, { width: L.W, height: L.H, viewBox: `0 0 ${L.W} ${L.H}` });
const defs = el('defs', {}, svg);
const vg = el('radialGradient', { id: 'vignette', cx: '50%', cy: '45%', r: '75%' }, defs);
el('stop', { offset: '0%', 'stop-color': '#0F2150' }, vg);
el('stop', { offset: '60%', 'stop-color': C.navy }, vg);
el('stop', { offset: '100%', 'stop-color': C.night }, vg);
const glow = el('filter', { id: 'glow', x: '-100%', y: '-100%', width: '300%', height: '300%' }, defs);
el('feGaussianBlur', { in: 'SourceGraphic', stdDeviation: 6 * L.s, result: 'b' }, glow);
const gm = el('feMerge', {}, glow);
el('feMergeNode', { in: 'b' }, gm);
el('feMergeNode', { in: 'SourceGraphic' }, gm);
const shadow = el('filter', { id: 'shadow', x: '-20%', y: '-20%', width: '140%', height: '140%' }, defs);
el('feDropShadow', { dx: 0, dy: 10, stdDeviation: 18, 'flood-color': '#020617', 'flood-opacity': 0.7 }, shadow);

const HR = 46 * L.s, hexW = Math.sqrt(3) * HR, hexH = 3 * HR;
const pat = el('pattern', { id: 'lattice', width: hexW, height: hexH, patternUnits: 'userSpaceOnUse' }, defs);
for (const [x, y] of [[hexW / 2, HR], [0, HR * 2.5], [hexW, HR * 2.5]])
  el('polygon', { points: hexPoints(x, y, HR * 0.92), fill: 'none', stroke: C.lattice, 'stroke-width': 1.5 }, pat);

// The mark: docs/brand/assets/svg/agent-kourier-mark-dark.svg, drawn so the feathers can unfold.
function mark(parent, size) {
  const g = el('g', {}, parent);
  const m = el('g', { transform: `scale(${size / 120}) translate(-60 -60)` }, g);
  const feathers = [[10, 44, 26], [14, 53, 22], [18, 62, 18]].flatMap(([x, y, w], i) => [
    { n: el('rect', { x, y, width: w, height: 6, rx: 3, fill: C.feather }, m), x, w, side: -1, i },
    { n: el('rect', { x: 84, y, width: w, height: 6, rx: 3, fill: C.feather }, m), x: 84, w, side: 1, i },
  ]);
  el('rect', { x: 38, y: 34, width: 44, height: 52, rx: 12, fill: C.k8s }, m);
  el('rect', { x: 44, y: 48, width: 32, height: 16, rx: 8, fill: C.white }, m);
  const eyes = [53, 67].map(cx => el('ellipse', { cx, cy: 56, rx: 4, ry: 4, fill: C.eye }, m));
  // unfold 0..1 slides the feathers out from the head; blink 0..1 closes the eyes.
  function pose(unfold, blink) {
    for (const f of feathers) {
      const p = outCubic(clamp(unfold * 1.5 - f.i * 0.25));
      const w = f.w * p;
      set(f.n, { width: Math.max(w, 0.01), x: f.side < 0 ? 36 - w : 84, opacity: p > 0 ? 1 : 0 });
    }
    for (const e of eyes) e.setAttribute('ry', lerp(4, 0.6, blink));
  }
  pose(1, 0);
  return { g, pose };
}

// Background, optionally with a rounded hole for footage to show through.
function background(hole) {
  const full = `M0 0H${L.W}V${L.H}H0Z`;
  let d = full;
  if (hole) {
    const [x, y, w, h] = hole, r = 18;
    d += ` M${x + r} ${y}H${x + w - r}A${r} ${r} 0 0 1 ${x + w} ${y + r}V${y + h - r}A${r} ${r} 0 0 1 ${x + w - r} ${y + h}H${x + r}A${r} ${r} 0 0 1 ${x} ${y + h - r}V${y + r}A${r} ${r} 0 0 1 ${x + r} ${y}Z`;
  }
  el('path', { d, fill: C.navy, 'fill-rule': 'evenodd' }, svg);
  const lat = el('path', { d, fill: 'url(#lattice)', 'fill-rule': 'evenodd' }, svg);
  el('path', { d, fill: 'url(#vignette)', 'fill-rule': 'evenodd', opacity: 0.85 }, svg);
  return lat;
}

// A headline block: bold lines then regular lines. Returns the lines for timing.
function headline(pair, H, parent) {
  const [bold, reg] = pair, g = el('g', {}, parent), lines = [];
  // Centred on the frame unless the layout pairs the headline with something beside it.
  const x = H.center ? L.W / 2 : H.x, anchor = H.center ? 'middle' : 'start', maxW = H.center ? L.W - 160 : L.W - H.x * 2;
  let y = H.y;
  for (const s of bold) {
    const t = el('text', { x, y, 'text-anchor': anchor, 'font-size': H.size, 'font-weight': 700, fill: C.white, 'letter-spacing': -0.02 * H.size }, g);
    t.textContent = s; fit(t, maxW); lines.push({ n: t, sub: false }); y += H.size * H.gap;
  }
  y += H.sub * 0.2;
  for (const s of reg) {
    const t = el('text', { x, y, 'text-anchor': anchor, 'font-size': H.sub, 'font-weight': 400, fill: C.white }, g);
    t.textContent = s; fit(t, maxW); lines.push({ n: t, sub: true }); y += H.sub * H.gap;
  }
  return { g, lines, bottom: y };
}
// a: bold in, b: regular in, c..d: out. Pass Infinity for c to keep it.
function showHeadline(h, t, a, b, c, d) {
  for (const { n, sub } of h.lines) {
    const start = sub ? b : a, p = outCubic(ramp(t, start, start + 0.45)), out = ramp(t, c, d);
    set(n, { opacity: Math.min(p, 1 - out) * (sub ? 0.8 : 1), transform: `translate(0 ${(1 - p) * 22 * L.s - out * 14 * L.s})` });
  }
}

// The lockup: mark plus "Agent Kourier", one weight, as the brand assets set it.
function lockup(parent, markSize, wordSize, mode) {
  const g = el('g', {}, parent);
  const mk = mark(g, markSize);
  const word = el('text', { 'font-size': wordSize, 'font-weight': 600, fill: C.white, 'letter-spacing': -0.02 * wordSize }, g);
  word.textContent = 'Agent Kourier';
  const ww = word.getComputedTextLength();
  let w, h;
  if (mode === 'row') {
    // The mark's ink spans about 83% of its box; overlap the box a little so the gap reads as one head-width.
    const gap = markSize * 0.02;
    w = markSize + gap + ww; h = markSize;
    set(mk.g, { transform: `translate(${markSize / 2} 0)` });
    set(word, { x: markSize + gap, y: wordSize * 0.35 });
    set(g, { 'data-w': w });
  } else {
    w = Math.max(markSize, ww); h = markSize * 0.62 + wordSize * 1.1;
    set(word, { x: -ww / 2, y: markSize * 0.36 + wordSize });
  }
  return { g, mk, word, w, h, ww };
}

const SEG = Q.get('seg');
const OVERLAY = Q.get('overlay');
let renderAt = () => {};

// =====================================================================================
// Footage frame: background with a hole, caption, labels. Static.
// =====================================================================================
if (OVERLAY) {
  const card = Q.get('card').split(',').map(Number), P = L.cap;
  background(card);
  const [cx, cy, cw, ch] = card;
  el('rect', { x: cx - 2, y: cy - 2, width: cw + 4, height: ch + 4, rx: 20, fill: 'none', stroke: C.deep, 'stroke-width': 4 }, svg);
  // Caption: build.mjs says where (capx, capy), how wide, how aligned, and whether capy is the block's centre.
  const cap = Q.get('cap') || '', sub = Q.get('sub') || '';
  const capX = Number(Q.get('capx')), capY = Number(Q.get('capy')), capW = Number(Q.get('capw')), anchor = Q.get('capalign') || 'start';
  const capAttrs = { 'font-size': P.size, 'font-weight': 700, 'letter-spacing': -0.02 * P.size };
  const subAttrs = { 'font-size': P.sub, 'font-weight': 400 };
  const capLines = wrap(cap, capAttrs, capW, svg), subLines = sub ? wrap(sub, subAttrs, capW, svg) : [];
  const blockH = capLines.length * P.size * 1.16 + (subLines.length ? P.sub * 0.25 + subLines.length * P.sub * 1.3 : 0);
  let y = Q.get('capvc') ? capY - blockH / 2 + P.size * 0.8 : capY;
  for (const line of capLines) {
    const t = el('text', { ...capAttrs, x: capX, y, 'text-anchor': anchor, fill: C.white }, svg); t.textContent = line; y += P.size * 1.16;
  }
  y += P.sub * 0.25;
  const ran = Q.get('cmd');
  if (ran) {
    // What was run off screen during this shot, in place of the sub-caption and never over the footage.
    const fs = { '16x9': 21, '9x16': 30, '1x1': 22 }[AR], cmdAttrs = { 'font-size': fs, 'font-weight': 600, class: 'mono' }, pad = fs * 0.8;
    // A command may also break after a slash, so a long resource name never runs past the caption column.
    const lines = [], probe0 = el('text', cmdAttrs, svg);
    let cur = '';
    for (const tok of ran.match(/[^ \/]+\/?| /g)) {
      probe0.textContent = (cur + tok).trim();
      if (cur.trim() && probe0.getComputedTextLength() > capW - pad * 2) { lines.push(cur.trim()); cur = tok.trimStart(); } else cur += tok;
    }
    if (cur.trim()) lines.push(cur.trim());
    probe0.remove();
    const lh = fs * 1.45, bh = lines.length * lh + pad * 1.3;
    const probe = el('text', cmdAttrs, svg); let bw = 0;
    for (const l of lines) { probe.textContent = l; bw = Math.max(bw, probe.getComputedTextLength()); }
    probe.remove(); bw += pad * 2;
    const bxx = anchor === 'middle' ? capX - bw / 2 : capX, byy = y - P.sub * 0.7;
    el('rect', { x: bxx, y: byy, width: bw, height: bh, rx: 10, fill: C.night, stroke: C.alert, 'stroke-width': 2.5 }, svg);
    lines.forEach((l, i) => { const t = el('text', { ...cmdAttrs, x: bxx + pad, y: byy + pad * 0.65 + lh * (i + 0.72), fill: C.white }, svg); t.textContent = l; });
  } else for (const line of subLines) {
    const t = el('text', { ...subAttrs, x: capX, y, 'text-anchor': anchor, fill: C.white, opacity: 0.8 }, svg); t.textContent = line; y += P.sub * 1.3;
  }
  // Small lockup and the honesty note.
  const lock = Q.get('lock').split(',').map(Number), noteAt = Q.get('note').split(',');
  const lk = lockup(svg, P.mark, P.mark * 0.42, 'row');
  set(lk.g, { transform: `translate(${lock[0]} ${lock[1]})`, opacity: 0.95 });
  const note = el('text', { x: noteAt[0], y: noteAt[1], 'font-size': AR === '16x9' ? 17 : 16, fill: C.white, opacity: 0.6, class: 'mono', 'text-anchor': noteAt[2] }, svg);
  note.textContent = 'Demo environment · seeded faults · real agent output · sped up in places';
  // Speed chip, just above the card's top right corner.
  const speed = Q.get('speed');
  if (speed) {
    const fs = 20 * Math.max(L.s, 0.95), t = el('text', { 'font-size': fs, 'font-weight': 600, fill: C.white, class: 'mono' }, svg);
    t.textContent = speed;
    const w = t.getComputedTextLength() + fs * 1.4, h = fs * 1.9, x = cx + cw - w, yy = cy - h - 12;
    const r = el('rect', { x, y: yy, width: w, height: h, rx: h / 2, fill: C.navy, stroke: C.k8s, 'stroke-width': 2, opacity: 0.94 }, svg);
    svg.insertBefore(r, t);
    set(t, { x: x + fs * 0.7, y: yy + h / 2 + fs * 0.35 });
  }
}

// =====================================================================================
// The story: p1, p2, p3, reveal, promise (and the teaser's t-problem, t-reveal).
// Each beat owns a ten-second slot of story time G; a segment ends before its slot does.
// =====================================================================================
const SLOT = { p1: 0, p2: 10, p3: 20, reveal: 30, promise: 40 };
const STORY = ['p1', 'p2', 'p3', 'reveal', 'promise', 't-problem', 't-reveal'];
if (!OVERLAY && STORY.includes(SEG)) {
  const lat = background();
  const D = el('g', {}, svg);
  const sw = 5 * L.s, kR = L.kSize * 0.30;
  const A = L.agents, mid = A[1];

  function edge(a, b, ra, rb, dash) {
    const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
    const p1 = [a[0] + ux * ra, a[1] + uy * ra], p2 = [b[0] - ux * rb, b[1] - uy * rb], L2 = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
    const n = el('line', { x1: p1[0], y1: p1[1], stroke: C.deep, 'stroke-width': sw, 'stroke-linecap': 'round' }, D);
    if (dash) n.setAttribute('stroke-dasharray', `${2 * L.s} ${16 * L.s}`);
    return { draw(p, color, op = 1) {
      set(n, { x2: lerp(p1[0], p2[0], p), y2: lerp(p1[1], p2[1], p), stroke: color, opacity: p > 0 ? op : 0 });
    } };
  }
  const tileR = L.tile * 0.62;
  const reachAm = edge(L.am, mid, L.r + 14 * L.s, 0, true), reachSlack = edge(L.slack, mid, L.r + 14 * L.s, 0, true);
  const promptLine = edge([L.prompt.cx + L.prompt.w / 2, L.prompt.cy], mid, 12 * L.s, tileR, true);
  const eAm = edge(L.am, L.k, L.r + 14 * L.s, kR + 30 * L.s), eSlack = edge(L.slack, L.k, L.r + 14 * L.s, kR + 30 * L.s);
  const eAgent = edge(L.k, mid, L.kLabel === 'below' ? L.kSize * 0.33 + 62 * L.s : kR + 34 * L.s, tileR + 6 * L.s);

  const rings = [0, 1, 2, 3, 4].map(() => el('circle', { cx: L.am[0], cy: L.am[1], r: L.r, fill: 'none', stroke: C.alert, 'stroke-width': 3 * L.s, opacity: 0 }, D));

  function source(pos, label, first, draw) {
    const g = el('g', {}, D), inner = el('g', {}, g);

    return { pos, g, box, ripple, open, shut, zs, S, i };
  });

  const tall = AR === '9x16';
  const chips = COPY.can.map((word, i) => {
    const [ax, ay] = A[i], w = 190 * L.s, h = 58 * L.s;

    const g = el('g', {}, D);

    el('rect', { x: cx - w / 2, y: cy - h / 2, width: w, height: h, rx: h / 2, fill: C.panel, stroke: C.deep, 'stroke-width': 3 * L.s }, g);

  aSub.textContent = 'kagent or your own';

  // Agent Kourier.
  const kg = el('g', {}, D);

  // Headlines, one per beat.

    rings.forEach((c, i) => {
      const t0 = 20.6 + i * 0.9, p = ramp(G, t0, t0 + 1.2), on = G >= t0 && G <= t0 + 1.2 && G < 30;

    });
    const fp = win(G, 20.6, 20.9, 41.0, 41.4);
    set(firing, { opacity: fp, transform: `translate(${L.firing[0]} ${L.firing[1] + (1 - fp) * 8})` });
    const bp = G < 30 ? outBack(ramp(G, 22.2, 22.6)) : 1, bo = win(G, 22.2, 22.4, 40.7, 41.1);
    set(bubble, { opacity: bo, transform: `translate(${L.bubble[0]} ${L.bubble[1]}) scale(${lerp(0.5, 1, bp)})` });
    reachAm.draw(0.42 * outCubic(ramp(G, 21.0, 22.0)), C.alert, (1 - ramp(G, 22.4, 23.0)) * 0.9);

    drive(pkBack, [mid, L.k, L.slack], G, 42.6, 43.6, C.k8s);

  pillTexts.forEach(t => t.setAttribute('font-size', pillSize));
  const end = el('g', {}, svg);
  const lk = lockup(end, E.mark, E.word, E.mode);
  const hook = el('text', { 'font-size': E.hook, 'font-weight': 600, fill: C.white, 'text-anchor': 'middle' }, end);
  hook.textContent = COPY.hook; fit(hook, L.W - 120);
  const cat = el('text', { 'font-size': E.cat, fill: C.white, 'text-anchor': 'middle', class: 'mono' }, end);
  cat.textContent = COPY.category; fit(cat, L.W - 120);
  let lkT, hookY;
  if (E.mode === 'row') { lkT = [E.cx - lk.w / 2, E.cy]; hookY = E.cy + E.mark * 0.42 + E.hook * 1.5; }
  else { lkT = [E.cx, E.cy]; hookY = E.cy + E.mark * 0.36 + E.word * 1.2 + E.hook * 2.0; }
  set(hook, { x: E.cx, y: hookY }); set(cat, { x: E.cx, y: hookY + E.cat * 2.5 });
  const T0 = SEG === 'close' ? Number(Q.get('endAt') || 5.7) : 0.1;
  renderAt = function (t) {
    set(lat, { transform: `translate(${(t * 6) % hexW} ${(t * 10) % hexH})` });
    const out = SEG === 'close' ? ramp(t, T0 - 0.5, T0 - 0.1) : 1;
    rows.forEach((r, i) => { const a = COPY.pillAt[i], p = outCubic(ramp(t, a, a + 0.4)); set(r, { opacity: p * (1 - out), transform: `translate(0 ${(1 - p) * 24 * L.s - out * 14 * L.s})` }); });
    const u = t - T0, ep = ramp(u, 0, 0.6);
    set(lk.g, { opacity: outCubic(ramp(u, 0, 0.3)), transform: `translate(${lkT[0]} ${lkT[1] + (1 - outCubic(ep)) * 24})` });
    lk.mk.pose(ramp(u, 0.15, 1.0), win(u, 2.4, 2.5, 2.54, 2.66));
    const hp = outCubic(ramp(u, 1.0, 1.5));
    set(hook, { opacity: hp, transform: `translate(0 ${(1 - hp) * 16})` });
    set(cat, { opacity: outCubic(ramp(u, 1.5, 2.0)) * 0.6 });
  };
}

window.renderAt = renderAt;
renderAt(parseFloat(Q.get('t') || '3'));
window.READY = true;
</script>
