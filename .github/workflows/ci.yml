# Pull requests and pushes to main: the checks `make` runs locally, nothing else. `make test` is
# test-race, test-testhooks and test-scripts in turn; here they run side by side, because the two race passes alone
# outlast one job's budget on a runner of this size: each pass is split over the legs of a matrix job (test-shard,
# test-testhooks-shard), each leg running its part of the pass's packages, and test-scripts is a job of its own. The
# jobs test and test-testhooks, the required checks, run nothing but a check that every job they need passed. make
# test-postgres, which make test does not run, is a job of its own too. Nothing is retried. The testhooks pass runs only
# the packages the testhooks tag changes, as its comment explains; nothing else is skipped but on a docs-only pull
# request, below. The kind tiers (make e2e-fast and the others) are not here; RELEASING.md says what they would need.
# The one job that uses kind is crd-corpus, whose cluster has only the CRDs.
#
# A docs-only pull request is one whose changed paths are all on the list in hack/ci/docs-only.sh, each as a regular
# file or deleted: maintainer prose such as spec.md and AGENTS.md, docs/brand, docs/spikes, and the site's media under
# docs/assets, whose content no Go test, script test, image build, scanner or CodeQL reads but for two tests that repeat
# make docs-check, which lint runs (the script says which). A symlink or submodule anywhere on the list runs everything:
# the docs agent's tests walk the real docs/ and refuse any symlink in it. README.md and the pages under docs/ are not
# on it: tests read them. On one, the legs of test-shard and test-testhooks-shard, test-scripts, test-postgres,
# crd-corpus, docs-agent and echo-agent still start, check out and run the docs-only step, then skip every other step,
# and each reports success under its own name, as do govulncheck and trivy in security.yml and analyze in codeql.yml;
# test and test-testhooks then pass, as their legs did. They skip steps, not the job: a job-level if is
# evaluated before the matrix expands (it cannot read matrix), so a crd-corpus skipped there reports no check named
# crd-corpus (1.37) or crd-corpus (1.33), and those required checks would wait forever. lint runs in full: it takes
# about a minute and a half, and its make docs-check reads the text files under docs/assets (SVG, captions), as
# docs.yml's build does on a pull request that touches docs/. zizmor runs in full, and gitleaks in security.yml.
# hack/ci/docsonly's test holds every copy of the docs-only step to one text and the checkouts before it alike, and
# every later step to the gate unless its if holds only on a push; it reads each if as terms joined by && and refuses
# one with ||, a negated event or a bracket (status calls such as always() aside).
#
# The docs-only step fails open. It runs only on a pull_request event and lists the paths with git, the merge commit
# against its first parent (the checkout fetches both parents on a pull request), so there is no cap on how many paths
# it lists. Only its exact answer skip=true skips anything: a path off the list or not a regular file, a listing that
# fails or is empty, a commit that is not a merge whose second parent is the pull request's head
# (github.event.pull_request.head.sha, through env), or the step failing (continue-on-error keeps the job going) runs
# every step. A push to main never runs the step and so runs everything, as before: main's push runs, which the release
# gate (hack/release/check-ci.sh) reads and which save the caches, are unchanged.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Observed on a cold cache: setup, fmt and lint took about 7 minutes. 15 leaves room for twice that, and for build.
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Go version is go.mod's. The Go jobs here, in security.yml, in codeql.yml and in docs.yml keep the module
      # cache and the build cache (and golangci-lint's cache where they lint) in an Actions cache of their own, unless
      # their comment names the job whose cache they restore. (setup-go's own cache gives every job one key: the first
      # job to finish saves it and the others' saves are refused.) A key is go-<cache>-<runner OS>-go<Go version>-<hash
      # of the go.sum files it builds from>-<commit>, and every run restores the most recently created entry whose key
      # starts with go-<cache>-<runner OS>-: on a pull request, the newest a push to main saved, so the caches follow
      # main. Go's build cache holds test results as well as compiled packages: where go test may reuse a result (not
      # with -count=1, as in test-postgres and crd-corpus), a package whose test binary, and the files and environment
      # variables its tests read, are as they were in that push's run reports "(cached)" and does not run again.
      #
      # Every push to main saves, unless its key was an exact hit (a re-run); a pull request never does, so it cannot
      # touch the quota. A push saves after a failed step too, though not after a cancel: a failing test leaves what
      # was compiled valid, and a job that saved only on success would stay cold for every pull request while a flaky
      # test kept failing it on main. hack/ci/actions-cache.sh keeps an entry to one run's needs: mark, after the
      # restore, and trim, before the save, drop the build cache entries the run neither read nor wrote (keeping
      # every output an index entry it wrote names), and mark starts the module cache empty when the restored entry
      # is from another go.sum or Go version. Then the workflow's cache-prune job deletes all but the newest entry of
      # each cache it saves.
      #
      # GitHub caps a repository's caches at 10 GB in all by default; an organization owner or repository admin can
      # raise the cap, and use past 10 GB is billed. Past the cap GitHub still saves the new entry, then deletes
      # entries, least recently accessed first, until the total is under it; it also deletes any entry not accessed
      # for 7 days. One entry of each cache in the four workflows, with CodeQL's own, comes to about 5.4 GB, of which
      # the four test legs' (go-test-1, go-test-2, go-test-testhooks-1 and go-test-testhooks-2) are about 2.4 GB: a
      # leg's entry holds the module cache and the race builds of every dependency of its packages, most of which the
      # other leg of its pass builds too. A push to main holds a second entry of each cache it saves until its prune
      # jobs run: about 9.4 GB in all while ci's are in flight, and up to about 10.8 GB if security's and codeql's saves
      # land before their own prunes run. Past 10 GB GitHub evicts the least recently accessed entries: first those no
      # run restores any more, then whichever were accessed longest ago, which may be one the prunes would delete anyway
      # or another workflow's (docs.yml's restore only on a docs change), whose next run then starts cold. The timeouts
      # stay at the cold-cache times: a run after an eviction starts cold.
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-env
        name: Locate the Go caches
        run: |
          echo "modcache=$(go env GOMODCACHE)" >>"${GITHUB_OUTPUT}"
          echo "gocache=$(go env GOCACHE)" >>"${GITHUB_OUTPUT}"
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.modcache }}
            ${{ steps.go-env.outputs.gocache }}
            ~/.cache/golangci-lint
          key: go-lint-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: go-lint-${{ runner.os }}-
      - name: Mark the restored Go caches
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          CACHE_KEY: ${{ steps.go-cache.outputs.cache-primary-key }}
          CACHE_RESTORED_KEY: ${{ steps.go-cache.outputs.cache-matched-key }}
        run: hack/ci/actions-cache.sh mark ~/.cache/golangci-lint
      - name: fmt leaves no diff
        run: |
          make fmt
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - run: make lint
      # The public docs' content check (hack/docs/contentcheck) needs only Go. The docs workflow runs it too, as part
      # of make docs-build, on a pull request or a push to main that touches the docs, and on a pull request that
      # touches either README; this job runs it on every pull request and every push to main. The workspace rule's
      # pattern is a secret, so a pull request from a fork runs without that rule.
      - run: make docs-check
        env:
          CONTENTCHECK_WORKSPACE: ${{ secrets.CONTENTCHECK_WORKSPACE }}
      - run: make build
      - id: go-trim
        name: Trim the Go caches to what this run used
        if: ${{ !cancelled() && steps.go-cache.outcome == 'success' && steps.go-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: hack/ci/actions-cache.sh trim ~/.cache/golangci-lint
      - if: ${{ !cancelled() && steps.go-trim.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.modcache }}
            ${{ steps.go-env.outputs.gocache }}
            ~/.cache/golangci-lint
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # make test-race, split over the legs of a matrix: with TEST_SHARD set, the Makefile has hack/ci/test-shard.sh give
  # each leg its part of go list -race ./..., balanced by the seconds in hack/ci/test-weights/race.txt, so that the legs
  # together run each package once, longest first. A leg's number and the number of legs come from the strategy
  # context, not from the matrix's values, so the split always covers every leg the matrix has; hack/ci/testshards'
  # test holds the legs' list, cache keys and cache-prune's prefixes to each other. Two legs: the weights in
  # race.txt sum to about 1,560 s, about 390 s of wall time at four packages at a time on 4 vCPUs, and the slowest,
  # internal/render at about 185 s, is the floor of the leg that runs it; two legs of about 780 s each (about 195 s of
  # wall time) are about at that floor, so a third would end at most about 10 s sooner and would cost a runner and a
  # cache. Each leg's cache is its
  # own (go-test-<leg>-): one cache that one leg saved would hold only that leg's packages and test results. The job
  # test below is the required check. Observed on a cold cache: go test -race ./... took 16 minutes in one job, with no
  # failure; 30 is nearly twice that, for a leg that builds about half of it.
  test-shard:
    name: test-shard (${{ matrix.leg }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        leg: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and both its parents, for the docs-only step.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      # On a docs-only pull request every step after this one skips; the header says why that is safe.
      - id: docs-only
        name: Classify the pull request's changes
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          scope=$(hack/ci/docs-only.sh)
          echo "${scope}" >>"${GITHUB_OUTPUT}"
      - id: setup-go
        if: ${{ steps.docs-only.outputs.skip != 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-env
        name: Locate the Go caches
        if: ${{ steps.docs-only.outputs.skip != 'true' }}
        run: |
          echo "modcache=$(go env GOMODCACHE)" >>"${GITHUB_OUTPUT}"
          echo "gocache=$(go env GOCACHE)" >>"${GITHUB_OUTPUT}"
      - id: go-cache
        if: ${{ steps.docs-only.outputs.skip != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.modcache }}
            ${{ steps.go-env.outputs.gocache }}
          key: go-test-${{ matrix.leg }}-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: go-test-${{ matrix.leg }}-${{ runner.os }}-
      - name: Mark the restored Go caches
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          CACHE_KEY: ${{ steps.go-cache.outputs.cache-primary-key }}
          CACHE_RESTORED_KEY: ${{ steps.go-cache.outputs.cache-matched-key }}
        run: hack/ci/actions-cache.sh mark
      # The chart tests (test/chart) render with helm and skip without it, so CI installs it and
      # AGENTKOURIER_REQUIRE_HELM below turns a missing helm into a failure, never a pass by skipping. Every leg has it,
      # whichever runs test/chart.
      - if: ${{ steps.docs-only.outputs.skip != 'true' }}
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          # The version test/chart passes with; release.yml pins the same one.
          version: v4.3.2
      - if: ${{ steps.docs-only.outputs.skip != 'true' }}
        run: make test-race TEST_SHARD="$((LEG_INDEX + 1))/${LEG_COUNT}"
        env:
          AGENTKOURIER_REQUIRE_HELM: "1"
          LEG_INDEX: ${{ strategy.job-index }}
          LEG_COUNT: ${{ strategy.job-total }}
      - id: go-trim
        name: Trim the Go caches to what this run used
        if: ${{ !cancelled() && steps.go-cache.outcome == 'success' && steps.go-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: hack/ci/actions-cache.sh trim
      - if: ${{ !cancelled() && steps.go-trim.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.modcache }}
            ${{ steps.go-env.outputs.gocache }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # make test-scripts, which make test runs after the two passes: the scripts' own tests, in a job of their own so that
  # no leg waits for them. They took about 20 s in the job they shared with the race pass. The Go they run builds only
  # small fixture modules of their own, so the job keeps no Go cache.
  test-scripts:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and both its parents, for the docs-only step.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      # On a docs-only pull request every step after this one skips; the header says why that is safe.
      - id: docs-only
        name: Classify the pull request's changes
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          scope=$(hack/ci/docs-only.sh)
          echo "${scope}" >>"${GITHUB_OUTPUT}"
      - if: ${{ steps.docs-only.outputs.skip != 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - if: ${{ steps.docs-only.outputs.skip != 'true' }}
        run: make test-scripts

  # The required check named test (the main ruleset, and CI_REQUIRED_JOBS in hack/release/check-ci.sh): it passes only
  # when every leg of test-shard and test-scripts passed, which between them run what one job named test ran before the
  # race pass was split. It runs however they ended (always()), since a check whose job was skipped counts as passed:
  # a job it needs that failed, was cancelled or was skipped fails it. jq reads only the needs context, through env; the
  # job checks nothing out, runs nothing from the pull request and has no token permission. On a docs-only pull
  # request the legs skip their steps and pass, and so does it.
  test:
    needs: [test-shard, test-scripts]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job it needs to have passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"${NEEDS}"
          jq -e 'length > 0 and all(.[]; .result == "success")' <<<"${NEEDS}" >/dev/null

  # make test-testhooks, split over the legs of a matrix as test-shard splits the race pass, with the weights in
  # hack/ci/test-weights/testhooks.txt. The pass runs the ./internal/... packages whose test build the testhooks tag
  # changes, built with the tag: those with a file the tag selects or drops, test files included, and those whose code
  # or tests reach, in any module, a package whose importers compile other files under the tag.
  # hack/ci/testhooks-packages.sh computes the list with go list on each run, so a package that gains such an import
  # joins it, and fails rather than run an empty one; every leg computes the same list and takes its part. Every other
  # package compiles to the same packages with the tag as without it, so the race pass has already run it. Two legs: in
  # a push run on main the 14 packages' times sum to about 645 s, and the slowest, internal/broker at about 115 s, is
  # the floor; two legs of about 320 s (80 s at four at a time) reach it. It has no chart tests, so no helm. 30 is the
  # same budget as the race pass's, whose build it repeats in part. Each leg's cache is its own
  # (go-test-testhooks-<leg>-), since the race legs' hold neither the tagged builds nor their test results.
  test-testhooks-shard:
    name: test-testhooks-shard (${{ matrix.leg }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        leg: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and both its parents, for the docs-only step.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      # On a docs-only pull request every step after this one skips; the header says why that is safe.
      - id: docs-only
        name: Classify the pull request's changes
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          scope=$(hack/ci/docs-only.sh)
          echo "${scope}" >>"${GITHUB_OUTPUT}"
      - id: setup-go
        if: ${{ steps.docs-only.outputs.skip != 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-env
        name: Locate the Go caches
        if: ${{ steps.docs-only.outputs.skip != 'true' }}
        run: |
          echo "modcache=$(go env GOMODCACHE)" >>"${GITHUB_OUTPUT}"
          echo "gocache=$(go env GOCACHE)" >>"${GITHUB_OUTPUT}"
      - id: go-cache
        if: ${{ steps.docs-only.outputs.skip != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.modcache }}
            ${{ steps.go-env.outputs.gocache }}
          key: go-test-testhooks-${{ matrix.leg }}-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: go-test-testhooks-${{ matrix.leg }}-${{ runner.os }}-
      - name: Mark the restored Go caches
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          CACHE_KEY: ${{ steps.go-cache.outputs.cache-primary-key }}
          CACHE_RESTORED_KEY: ${{ steps.go-cache.outputs.cache-matched-key }}
        run: hack/ci/actions-cache.sh mark
      - if: ${{ steps.docs-only.outputs.skip != 'true' }}
        run: make test-testhooks TEST_SHARD="$((LEG_INDEX + 1))/${LEG_COUNT}"
        env:
          LEG_INDEX: ${{ strategy.job-index }}
          LEG_COUNT: ${{ strategy.job-total }}
      - id: go-trim
        name: Trim the Go caches to what this run used
        if: ${{ !cancelled() && steps.go-cache.outcome == 'success' && steps.go-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: hack/ci/actions-cache.sh trim
      - if: ${{ !cancelled() && steps.go-trim.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.modcache }}
            ${{ steps.go-env.outputs.gocache }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # The required check named test-testhooks: every leg of test-testhooks-shard passed. As test does for the race pass,
  # it runs however they ended, reads only the needs context and fails unless each passed.
  test-testhooks:
    needs: [test-testhooks-shard]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job it needs to have passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"${NEEDS}"
          jq -e 'length > 0 and all(.[]; .result == "success")' <<<"${NEEDS}" >/dev/null

  # The tests that need a database skip in the jobs above, which have none: without this job the store conformance
  # suite runs on SQLite only. hack/postgres/test.sh starts a throwaway Postgres container, which the runner's Docker
  # serves, and sets the DSN those tests read, so they cannot skip here. It builds two packages the race pass builds,
  # internal/broker and internal/store/postgres, with -race as that pass does, and runs their tests with -count=1, which
  # never reads a cached result, so it saves no cache. It restores the first race leg's: under the weights checked in,
  # that leg runs both packages, so its cache holds their builds; were a refresh of the weights to move one to the
  # other leg, this job would build what it lacks, a slower run and no failure.
  test-postgres:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and both its parents, for the docs-only step.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      # On a docs-only pull request every step after this one skips; the header says why that is safe.
      - id: docs-only
        name: Classify the pull request's changes
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          scope=$(hack/ci/docs-only.sh)
          echo "${scope}" >>"${GITHUB_OUTPUT}"
      - id: setup-go
        if: ${{ steps.docs-only.outputs.skip != 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-env
        name: Locate the Go caches
        if: ${{ steps.docs-only.outputs.skip != 'true' }}
        run: |
          echo "modcache=$(go env GOMODCACHE)" >>"${GITHUB_OUTPUT}"
          echo "gocache=$(go env GOCACHE)" >>"${GITHUB_OUTPUT}"
      - id: go-cache
        if: ${{ steps.docs-only.outputs.skip != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.modcache }}
            ${{ steps.go-env.outputs.gocache }}
          key: go-test-1-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: go-test-1-${{ runner.os }}-
      - if: ${{ steps.docs-only.outputs.skip != 'true' }}
        run: make test-postgres

  # The CRDs' schemas are a fast-fail copy of the broker's validation, and the invariant is that nothing the schema refuses is
  # accepted by the broker (spec D50). This job holds them to it: a kind cluster with only the three CRDs, no image and no
  # Agent Kourier, to which test/crdcorpus sends each entry of its corpus, and the thousands of variations that it
  # generates, as server-side dry-run creates (make crd-corpus, hack/kind/crd-corpus.sh). It is the only job that compiles the
  # schemas' CEL rules on an apiserver, so a rule that does not compile, or one that refuses every valid object, passes
  # everything else. It runs on two Kubernetes versions: the one the kind tiers pin (1.37, NODE_IMAGE in hack/kind/lib.sh) and
  # the oldest the chart admits (1.33, NODE_IMAGE_MIN, the check in charts/agent-kourier/templates/_helpers.tpl), each node
  # image by digest. kind and kubectl are the pinned, checksummed binaries of hack/ci/install-kind-tools.sh (which installs
  # helm and jq with them). The runner's Docker runs kind. The jobs' names, crd-corpus (1.37) and crd-corpus (1.33), are
  # required checks of the `main` ruleset and CI_REQUIRED_JOBS in hack/release/check-ci.sh (RELEASING.md): a rename here is
  # a change to both. One run took about 3 minutes, with warm caches; 20 leaves room for a cold build of client-go. The two
  # build the same test binary, so they share one cache, which only the 1.37 job saves.
  crd-corpus:
    name: crd-corpus (${{ matrix.k8s }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - k8s: "1.37"
            node: default
          - k8s: "1.33"
            node: min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and both its parents, for the docs-only step.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      # On a docs-only pull request every step after this one skips; the header says why that is safe.
      - id: docs-only
        name: Classify the pull request's changes
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          scope=$(hack/ci/docs-only.sh)
          echo "${scope}" >>"${GITHUB_OUTPUT}"
      - id: setup-go
        if: ${{ steps.docs-only.outputs.skip != 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-env
        name: Locate the Go caches
        if: ${{ steps.docs-only.outputs.skip != 'true' }}
        run: |
          echo "modcache=$(go env GOMODCACHE)" >>"${GITHUB_OUTPUT}"
          echo "gocache=$(go env GOCACHE)" >>"${GITHUB_OUTPUT}"
      - id: go-cache
        if: ${{ steps.docs-only.outputs.skip != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.modcache }}
            ${{ steps.go-env.outputs.gocache }}
          key: go-crd-corpus-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: go-crd-corpus-${{ runner.os }}-
      - name: Mark the restored Go caches
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.node == 'default' }}
        env:
          CACHE_KEY: ${{ steps.go-cache.outputs.cache-primary-key }}
          CACHE_RESTORED_KEY: ${{ steps.go-cache.outputs.cache-matched-key }}
        run: hack/ci/actions-cache.sh mark
      # It puts the tools in $RUNNER_TEMP/bin and on the path of the steps after it, and fails on a checksum that is not the pin.
      - if: ${{ steps.docs-only.outputs.skip != 'true' }}
        run: hack/ci/install-kind-tools.sh
      - if: ${{ steps.docs-only.outputs.skip != 'true' }}
        run: make crd-corpus
        env:
          CRD_CORPUS_NODE: ${{ matrix.node }}
      - id: go-trim
        name: Trim the Go caches to what this run used
        if: ${{ !cancelled() && steps.go-cache.outcome == 'success' && steps.go-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.node == 'default' }}
        run: hack/ci/actions-cache.sh trim
      - if: ${{ !cancelled() && steps.go-trim.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.modcache }}
            ${{ steps.go-env.outputs.gocache }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # zizmor audits every workflow and fails on any finding: pull_request_target and workflow_run triggers, template
  # injection of outsider-controlled values into run steps, persisted checkout credentials, caches in a release
  # workflow (zizmor.yml names the gap), actions not pinned by SHA. .github/zizmor.yml is its policy and
  # hack/security/lint-workflows.sh what the job proves. The token is only for zizmor's online audits (impostor commits, known vulnerable actions) and is read-only,
  # as on a fork's pull request. Findings print in the log; none is uploaded as SARIF, which needs security-events: write.
  zizmor:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make lint-workflows
        env:
          GH_TOKEN: ${{ github.token }}

  # The docs-agent recipe is a separate Go module (examples/recipes/docs-agent/agent), so the jobs above do not build
  # or test it. Its tests include the refusals that keep its corpus reader inside the corpus.
  docs-agent:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and both its parents, for the docs-only step.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      # On a docs-only pull request every step after this one skips; the header says why that is safe.
      - id: docs-only
        name: Classify the pull request's changes
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          scope=$(hack/ci/docs-only.sh)
          echo "${scope}" >>"${GITHUB_OUTPUT}"
      # Its lint builds golangci-lint from the root module, so the key covers both go.sum files.
      - id: setup-go
        if: ${{ steps.docs-only.outputs.skip != 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-env
        name: Locate the Go caches
        if: ${{ steps.docs-only.outputs.skip != 'true' }}
        run: |
          echo "modcache=$(go env GOMODCACHE)" >>"${GITHUB_OUTPUT}"
          echo "gocache=$(go env GOCACHE)" >>"${GITHUB_OUTPUT}"
      - id: go-cache
        if: ${{ steps.docs-only.outputs.skip != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.modcache }}
            ${{ steps.go-env.outputs.gocache }}
            ~/.cache/golangci-lint
          key: go-docs-agent-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum', 'examples/recipes/docs-agent/agent/go.sum') }}-${{ github.sha }}
          restore-keys: go-docs-agent-${{ runner.os }}-
      - name: Mark the restored Go caches
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          CACHE_KEY: ${{ steps.go-cache.outputs.cache-primary-key }}
          CACHE_RESTORED_KEY: ${{ steps.go-cache.outputs.cache-matched-key }}
        run: hack/ci/actions-cache.sh mark ~/.cache/golangci-lint
      - if: ${{ steps.docs-only.outputs.skip != 'true' }}
        run: make docs-agent-test
      - if: ${{ steps.docs-only.outputs.skip != 'true' }}
        run: make docs-agent-lint
      - id: go-trim
        name: Trim the Go caches to what this run used
        if: ${{ !cancelled() && steps.go-cache.outcome == 'success' && steps.go-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: hack/ci/actions-cache.sh trim ~/.cache/golangci-lint
      - if: ${{ !cancelled() && steps.go-trim.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.modcache }}
            ${{ steps.go-env.outputs.gocache }}
            ~/.cache/golangci-lint
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # The echo-agent recipe is Python (examples/recipes/echo-agent/agent), so no Go job builds or tests it. The Makefile
  # targets make a virtualenv from the hashed requirements-dev.txt. The job's pip cache (downloads and wheels) is keyed on
  # the requirements files. Every run restores and only a push to main saves, as for the Go caches, but it does not
  # roll: what pip downloads depends on those files alone, so a push saves only when they change (a miss of the exact
  # key), and cache-prune then deletes the entry for the old files. The image build proves the Dockerfile and
  # requirements.txt still install together.
  echo-agent:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and both its parents, for the docs-only step.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      # On a docs-only pull request every step after this one skips; the header says why that is safe.
      - id: docs-only
        name: Classify the pull request's changes
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          scope=$(hack/ci/docs-only.sh)
          echo "${scope}" >>"${GITHUB_OUTPUT}"
      - id: setup-python
        if: ${{ steps.docs-only.outputs.skip != 'true' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - id: pip-env
        name: Locate the pip cache
        if: ${{ steps.docs-only.outputs.skip != 'true' }}
        run: echo "cache=$(python -m pip cache dir)" >>"${GITHUB_OUTPUT}"
      - id: pip-cache
        if: ${{ steps.docs-only.outputs.skip != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pip-env.outputs.cache }}
          key: pip-echo-agent-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('examples/recipes/echo-agent/agent/requirements*.txt') }}
          restore-keys: |
            pip-echo-agent-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-
            pip-echo-agent-${{ runner.os }}-
      - if: ${{ steps.docs-only.outputs.skip != 'true' }}
        run: make echo-agent-test
      - if: ${{ steps.docs-only.outputs.skip != 'true' }}
        run: make echo-agent-lint
      - if: ${{ steps.docs-only.outputs.skip != 'true' }}
        run: make echo-agent-image
      - if: ${{ !cancelled() && steps.pip-cache.outcome == 'success' && steps.pip-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pip-env.outputs.cache }}
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}

  # On a push to main, once the jobs above have saved: deletes every entry of each of their caches but the newest
  # (hack/ci/actions-cache.sh prune), so the quota holds one of each, as the comment in lint says. It runs after a
  # failed job too, since a failed job still saves. Its token is the only one here that can delete caches (actions:
  # write), and it runs nothing but the script. A listing or delete the API fails is a warning, not a failure, so a
  # transient error does not fail main's run (which the release gate needs green); the next push's prune catches up.
  # Deleting an entry a pull request is downloading at that moment can fail that restore, and the job then runs cold;
  # a failed restore does not fail it.
  cache-prune:
    needs: [lint, test-shard, test-testhooks-shard, crd-corpus, docs-agent, echo-agent]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write # deletes cache entries
      contents: read # checks out the script
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          hack/ci/actions-cache.sh prune "go-lint-${RUNNER_OS}-" "go-test-1-${RUNNER_OS}-" "go-test-2-${RUNNER_OS}-"
          "go-test-testhooks-1-${RUNNER_OS}-" "go-test-testhooks-2-${RUNNER_OS}-" "go-crd-corpus-${RUNNER_OS}-"
          "go-docs-agent-${RUNNER_OS}-" "pip-echo-agent-${RUNNER_OS}-"
        env:
          GH_TOKEN: ${{ github.token }}
