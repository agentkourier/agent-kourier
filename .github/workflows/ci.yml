# Pull requests and pushes to main: the checks `make` runs locally, nothing else. `make test` is
# test-race, test-testhooks and test-scripts in turn; here they are jobs of their own, which run side by side,
# because the two race passes alone outlast one job's budget on a runner of this size. Nothing is retried or
# skipped. The kind tiers (make e2e-fast and the others) are not here; RELEASING.md says what they would need.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Observed on a cold cache: setup, fmt and lint took about 7 minutes. 15 leaves room for twice that, and for build.
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Go version is go.mod's. Each Go job here, in security.yml and in codeql.yml has a cache of its own (the
      # module cache and the build cache, and golangci-lint's cache where it lints), keyed on the job, the runner OS,
      # the Go version and the go.sum files it builds from. (setup-go's own cache gives every job one key: the first
      # job to finish saves it and the others' saves are refused.) Every run restores, falling back to the job's
      # newest entry for the same Go version and then for any. Only a push to main saves, and only when its key was
      # not an exact hit, so pull requests read main's caches without filling the quota. It saves after a failed step
      # too, though not after a cancel: a failing test leaves what was compiled valid, and a job that saved only on
      # success would stay cold for every pull request while a flaky test kept failing it on main. The timeouts stay
      # at the cold-cache times: a run after a go.sum change, or after an eviction, starts cold.
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-env
        name: Locate the Go caches
        run: |
          echo "modcache=$(go env GOMODCACHE)" >>"${GITHUB_OUTPUT}"
          echo "gocache=$(go env GOCACHE)" >>"${GITHUB_OUTPUT}"
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.modcache }}
            ${{ steps.go-env.outputs.gocache }}
            ~/.cache/golangci-lint
          key: go-lint-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-lint-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-
            go-lint-${{ runner.os }}-
      - name: fmt leaves no diff
        run: |
          make fmt
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - run: make lint
      # The public docs' content check (hack/docs/contentcheck) needs only Go. The docs workflow runs it too, as part
      # of make docs-build, on a pull request or a push to main that touches the docs, and on a pull request that
      # touches either README; this job runs it on every pull request and every push to main. The workspace rule's
      # pattern is a secret, so a pull request from a fork runs without that rule.
      - run: make docs-check
        env:
          CONTENTCHECK_WORKSPACE: ${{ secrets.CONTENTCHECK_WORKSPACE }}
      - run: make build
      - if: ${{ !cancelled() && steps.go-cache.outcome == 'success' && steps.go-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.modcache }}
            ${{ steps.go-env.outputs.gocache }}
            ~/.cache/golangci-lint
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # Observed on a cold cache: go test -race ./... took 16 minutes, with no failure. 30 is nearly twice that.
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-env
        name: Locate the Go caches
        run: |
          echo "modcache=$(go env GOMODCACHE)" >>"${GITHUB_OUTPUT}"
          echo "gocache=$(go env GOCACHE)" >>"${GITHUB_OUTPUT}"
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.modcache }}
            ${{ steps.go-env.outputs.gocache }}
          key: go-test-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-test-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-
            go-test-${{ runner.os }}-
      # The chart tests (test/chart) render with helm and skip without it, so CI installs it and
      # AGENTKOURIER_REQUIRE_HELM below turns a missing helm into a failure, never a pass by skipping.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # The version test/chart passes with; release.yml pins the same one.
          version: v4.3.1
      - run: make test-race
        env:
          AGENTKOURIER_REQUIRE_HELM: "1"
      - run: make test-scripts
      - if: ${{ !cancelled() && steps.go-cache.outcome == 'success' && steps.go-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.modcache }}
            ${{ steps.go-env.outputs.gocache }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # The same packages as the first pass but under ./internal/..., built with the testhooks tag: it did not finish in the
  # 23 minutes that were left after the lint, and one package in it (internal/chat/chattest) took 213 seconds alone.
  # It has no chart tests, so no helm. 30 is the same budget as the first pass, whose build it repeats in part.
  test-testhooks:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-env
        name: Locate the Go caches
        run: |
          echo "modcache=$(go env GOMODCACHE)" >>"${GITHUB_OUTPUT}"
          echo "gocache=$(go env GOCACHE)" >>"${GITHUB_OUTPUT}"
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.modcache }}
            ${{ steps.go-env.outputs.gocache }}
          key: go-test-testhooks-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-test-testhooks-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-
            go-test-testhooks-${{ runner.os }}-
      - run: make test-testhooks
      - if: ${{ !cancelled() && steps.go-cache.outcome == 'success' && steps.go-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.modcache }}
            ${{ steps.go-env.outputs.gocache }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # The docs-agent recipe is a separate Go module (examples/recipes/docs-agent/agent), so the jobs above do not build
  # or test it. Its tests include the refusals that keep its corpus reader inside the corpus.
  docs-agent:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Its lint builds golangci-lint from the root module, so the key covers both go.sum files.
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-env
        name: Locate the Go caches
        run: |
          echo "modcache=$(go env GOMODCACHE)" >>"${GITHUB_OUTPUT}"
          echo "gocache=$(go env GOCACHE)" >>"${GITHUB_OUTPUT}"
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.modcache }}
            ${{ steps.go-env.outputs.gocache }}
            ~/.cache/golangci-lint
          key: go-docs-agent-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum', 'examples/recipes/docs-agent/agent/go.sum') }}
          restore-keys: |
            go-docs-agent-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-
            go-docs-agent-${{ runner.os }}-
      - run: make docs-agent-test
      - run: make docs-agent-lint
      - if: ${{ !cancelled() && steps.go-cache.outcome == 'success' && steps.go-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.modcache }}
            ${{ steps.go-env.outputs.gocache }}
            ~/.cache/golangci-lint
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # The echo-agent recipe is Python (examples/recipes/echo-agent/agent), so no Go job builds or tests it. The Makefile
  # targets make a virtualenv from the hashed requirements-dev.txt; setup-python's pip cache is keyed on the requirements
  # files. The image build proves the Dockerfile and requirements.txt still install together.
  echo-agent:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: examples/recipes/echo-agent/agent/requirements*.txt
      - run: make echo-agent-test
      - run: make echo-agent-lint
      - run: make echo-agent-image

  # The prompt-agent recipe is Python too (examples/recipes/prompt-agent/agent), and is built the same way as the echo
  # agent. Its tests start a small MCP server as a subprocess, and call no model.
  prompt-agent:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: examples/recipes/prompt-agent/agent/requirements*.txt
      - run: make prompt-agent-test
      - run: make prompt-agent-lint
      - run: make prompt-agent-image
