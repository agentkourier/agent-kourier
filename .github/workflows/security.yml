# On a docs-only pull request (the header of ci.yml says what that is and why skipping is safe), govulncheck and trivy
# start and report success under their own names but skip every step after their docs-only step: no Go or image file
# changed, so neither has anything new to scan. gitleaks scans the whole tree and its history, so it always runs in
# full. On any other event the docs-only step does not run, and the jobs run as they did before it.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '27 3 * * *'
  workflow_dispatch:
  # zizmor flags every workflow_run trigger (dangerous-triggers): it runs in this repository's context and a pull
  # request's run can start it. Every job but released-image-rescan skips workflow_run, and that job runs only after a
  # successful release run started by a push (a tag), which a pull request's run never is. It reads nothing from the
  # triggering run (no artifact, no head SHA; the checkout is main), holds read permissions only, and must stay that way.
  workflow_run: # zizmor: ignore[dangerous-triggers] only the rescan runs, and it reads nothing from the triggering run
    workflows: [release]
    types: [completed]

permissions: {}

# The event is in the group: a workflow_run or scheduled run has main as its ref, and must not cancel a pending push run.
concurrency:
  group: security-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/agentkourier/agent-kourier

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.module }})
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: root
            directory: .
            go-sum: go.sum
          - module: ax
            directory: examples/ax
            go-sum: examples/ax/go.sum
          - module: docs-agent
            directory: examples/recipes/docs-agent/agent
            go-sum: examples/recipes/docs-agent/agent/go.sum
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and both its parents, for the docs-only step.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      # On a docs-only pull request every step after this one skips; the header says why that is safe.
      - id: docs-only
        name: Classify the pull request's changes
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          scope=$(hack/ci/docs-only.sh)
          echo "${scope}" >>"${GITHUB_OUTPUT}"
      # A cache per module, as ci.yml describes. The script pins govulncheck's version, so it is in the key too.
      - id: setup-go
        if: ${{ steps.docs-only.outputs.skip != 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-env
        name: Locate the Go caches
        if: ${{ steps.docs-only.outputs.skip != 'true' }}
        run: |
          echo "modcache=$(go env GOMODCACHE)" >>"${GITHUB_OUTPUT}"
          echo "gocache=$(go env GOCACHE)" >>"${GITHUB_OUTPUT}"
      - id: go-cache
        if: ${{ steps.docs-only.outputs.skip != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.modcache }}
            ${{ steps.go-env.outputs.gocache }}
          key: go-govulncheck-${{ matrix.module }}-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles(matrix.go-sum, 'hack/security/govulncheck.sh') }}-${{ github.sha }}
          restore-keys: go-govulncheck-${{ matrix.module }}-${{ runner.os }}-
      - name: Mark the restored Go caches
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          CACHE_KEY: ${{ steps.go-cache.outputs.cache-primary-key }}
          CACHE_RESTORED_KEY: ${{ steps.go-cache.outputs.cache-matched-key }}
        run: hack/ci/actions-cache.sh mark
      - name: Run govulncheck
        if: ${{ steps.docs-only.outputs.skip != 'true' }}
        env:
          MODULE_DIR: ${{ matrix.directory }}
        run: hack/security/govulncheck.sh "${MODULE_DIR}"
      - id: go-trim
        name: Trim the Go caches to what this run used
        if: ${{ !cancelled() && steps.go-cache.outcome == 'success' && steps.go-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: hack/ci/actions-cache.sh trim
      - if: ${{ !cancelled() && steps.go-trim.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.modcache }}
            ${{ steps.go-env.outputs.gocache }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  secrets:
    name: gitleaks
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        id: gitleaks
        run: |
          path=$(hack/security/install-gitleaks.sh "${RUNNER_TEMP}/security-tools")
          echo "path=${path}" >>"${GITHUB_OUTPUT}"
      - name: Verify fixture exceptions cannot hide new credentials
        env:
          GITLEAKS_BIN: ${{ steps.gitleaks.outputs.path }}
        run: hack/security/test-secrets.sh
      - name: Scan repository history
        env:
          GITLEAKS_BIN: ${{ steps.gitleaks.outputs.path }}
        run: hack/security/scan-secrets.sh . "${RUNNER_TEMP}/gitleaks.sarif"
      - name: Upload redacted Gitleaks report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks.sarif
          if-no-files-found: warn

  image:
    name: trivy (${{ matrix.name }})
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            platform: linux/amd64
          - name: linux-arm64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and both its parents, for the docs-only step.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      # On a docs-only pull request every step after this one skips; the header says why that is safe.
      - id: docs-only
        name: Classify the pull request's changes
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          scope=$(hack/ci/docs-only.sh)
          echo "${scope}" >>"${GITHUB_OUTPUT}"
      - if: ${{ steps.docs-only.outputs.skip != 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install pinned Trivy
        if: ${{ steps.docs-only.outputs.skip != 'true' }}
        id: trivy
        run: |
          path=$(hack/security/install-trivy.sh "${RUNNER_TEMP}/security-tools")
          echo "path=${path}" >>"${GITHUB_OUTPUT}"
      - name: Build the production image
        if: ${{ steps.docs-only.outputs.skip != 'true' }}
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE_REF: agent-kourier-security:${{ matrix.name }}
        run: |
          source hack/kind/lib.sh
          docker buildx build \
            --platform "${PLATFORM}" \
            --build-arg "GO_IMAGE=${GO_IMAGE}" \
            --build-arg "RUNTIME_IMAGE=${RUNTIME_IMAGE}" \
            --build-arg "VERSION=security-${GITHUB_SHA}" \
            --load \
            --tag "${IMAGE_REF}" \
            .
      - name: Scan the production image
        if: ${{ steps.docs-only.outputs.skip != 'true' }}
        env:
          IMAGE_REF: agent-kourier-security:${{ matrix.name }}
          PLATFORM: ${{ matrix.platform }}
          TRIVY_BIN: ${{ steps.trivy.outputs.path }}
          REPORT_NAME: trivy-${{ matrix.name }}
        run: hack/security/scan-image.sh "${IMAGE_REF}" "${PLATFORM}" "${RUNNER_TEMP}/${REPORT_NAME}.sarif"
      - name: Upload Trivy report
        if: ${{ always() && steps.docs-only.outputs.skip != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ matrix.name }}
          path: ${{ runner.temp }}/trivy-${{ matrix.name }}.sarif
          if-no-files-found: warn

  released-image-rescan:
    name: rescan released image digests
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned Trivy
        id: trivy
        run: |
          path=$(hack/security/install-trivy.sh "${RUNNER_TEMP}/security-tools")
          echo "path=${path}" >>"${GITHUB_OUTPUT}"
      - name: Select released image digests
        id: releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          releases_file="${RUNNER_TEMP}/github-releases.json"
          images_file="${RUNNER_TEMP}/released-images"
          gh api --paginate --slurp "/repos/${RELEASE_REPOSITORY}/releases?per_page=100" |
            jq -e 'if type == "array" then add else error("GitHub Release pages are not an array") end' >"${releases_file}"
          hack/security/select-release-images.sh "${releases_file}" "${images_file}"
          echo "images_file=${images_file}" >>"${GITHUB_OUTPUT}"
          if test -s "${images_file}"; then
            echo "has_images=true" >>"${GITHUB_OUTPUT}"
          else
            echo '::notice::No published release is available for the released-image rescan.'
            echo "has_images=false" >>"${GITHUB_OUTPUT}"
          fi
      - name: Rescan every published digest on both platforms
        if: ${{ steps.releases.outputs.has_images == 'true' }}
        env:
          IMAGE: ${{ env.IMAGE }}
          IMAGES_FILE: ${{ steps.releases.outputs.images_file }}
          TRIVY_BIN: ${{ steps.trivy.outputs.path }}
        run: |
          status=0
          while IFS= read -r image_ref; do
            digest=${image_ref##*@}
            for platform in linux/amd64 linux/arm64; do
              report="${RUNNER_TEMP}/trivy-released-${digest#sha256:}-${platform//\//-}.sarif"
              if ! hack/security/scan-image.sh "${image_ref}" "${platform}" "${report}"; then
                status=1
              fi
            done
          done <"${IMAGES_FILE}"
          exit "${status}"
      - name: Upload released-image Trivy reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-released-images
          path: ${{ runner.temp }}/trivy-*.sarif
          if-no-files-found: warn

  # On a push to main, once govulncheck has saved: deletes every entry of its three caches but the newest, as ci.yml's
  # cache-prune does for its caches (the comment in ci.yml's lint job says why).
  cache-prune:
    needs: [govulncheck]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write # deletes cache entries
      contents: read # checks out the script
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          hack/ci/actions-cache.sh prune "go-govulncheck-root-${RUNNER_OS}-" "go-govulncheck-ax-${RUNNER_OS}-"
          "go-govulncheck-docs-agent-${RUNNER_OS}-"
        env:
          GH_TOKEN: ${{ github.token }}
