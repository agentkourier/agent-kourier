# The documentation site (mkdocs.yml, docs/): built and checked on every pull request that touches it, deployed to
# Cloudflare Pages from main (https://agentkourier.dev), and to a preview URL from a pull request in this repository.
#
# Secrets. Put them in GitHub environments, never in the repository's own secrets: a repository secret is readable by
# any pull request that edits this file. The owner sets (Settings, Environments):
#   docs-production  deployment branches: main only. Secrets CLOUDFLARE_API_TOKEN (an API token with "Cloudflare
#                    Pages: Edit" on the account) and CLOUDFLARE_ACCOUNT_ID (the account of the Pages project
#                    "agentkourier").
#   docs-preview     for pull request previews. It may hold the same two secrets, or a token scoped to previews, or none,
#                    in which case a preview prints a notice and skips.
# A deploy job reads the secrets only through its environment. Without them it prints a notice and deploys nothing; the
# build still runs. The build job runs the pull request's code with no secrets; the deploy jobs run no repository code,
# only wrangler on the built site.
name: docs

# The two READMEs are in the pull request paths only: the content check reads them, but the site does not publish
# them, so a README-only push to main must not redeploy it (ci.yml runs the check on main).
on:
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - README.md
      - hack/docs/**
      - api/v1alpha1/**
      - charts/agent-kourier/README.md
      - charts/agent-kourier/values.yaml
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - hack/docs/**
      - api/v1alpha1/**
      - charts/agent-kourier/values.yaml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Go runs the reference generator (hack/docs/refgen), the name check (hack/docs/namecheck) and the content check
      # (hack/docs/contentcheck: internal IDs, removed names, workspace identifiers, and the READMEs' links).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hack/docs/requirements.txt
      # Generates the reference pages, fails on a misspelt product name or a content-check finding, and builds with
      # --strict, so a broken internal link or anchor, a page missing from the nav, or any other warning fails the
      # build.
      - run: make docs-build
      - name: The committed reference pages are current
        run: git diff --exit-code -- docs/reference
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: bin/site
          retention-days: 7
          if-no-files-found: error

  # External links. The repository's own GitHub links are skipped while it is private, and so is the site itself
  # until its domain serves it.
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --no-progress
            --max-retries 3
            --fallback-extensions md
            --exclude '\.svc\.cluster\.local'
            --exclude-path docs/brand
            --exclude-path docs/spikes
            --exclude '^https://github\.com/agentkourier/'
            --exclude '^https://agentkourier\.dev'
            --exclude '^https://api\.slack\.com/apps'
            'docs/**/*.md'
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Production: a push to main, or a run started by hand on main. The links job does not hold it back: a dead
  # external link fails the pull request's checks, not the deploy of what is already merged.
  deploy-production:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: docs-production
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      ENVIRONMENT: docs-production
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Cloudflare Pages deploys the branch named main to production.
      - name: Cloudflare secrets are set
        id: secrets
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "ok=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set in the ${ENVIRONMENT} environment; the site was built and not deployed."
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.secrets.outputs.ok == 'true'
        with:
          name: site
          path: site
      - id: deploy
        if: steps.secrets.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=agentkourier --branch=main
      - name: Summary
        if: steps.secrets.outputs.ok == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: echo "Deployed to ${URL}" >> "${GITHUB_STEP_SUMMARY}"

  # Previews: a pull request from a branch of this repository (a fork's gets no secrets). The Pages branch is the
  # pull request's number, never its head branch's name, so no pull request can deploy as main.
  deploy-preview:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: docs-preview
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      ENVIRONMENT: docs-preview
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare secrets are set
        id: secrets
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "ok=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set in the ${ENVIRONMENT} environment; the site was built and not deployed."
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.secrets.outputs.ok == 'true'
        with:
          name: site
          path: site
      - id: deploy
        if: steps.secrets.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=agentkourier --branch=pr-${{ github.event.pull_request.number }}
      - name: Summary
        if: steps.secrets.outputs.ok == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: echo "Deployed to ${URL}" >> "${GITHUB_STEP_SUMMARY}"
