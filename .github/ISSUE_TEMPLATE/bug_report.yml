name: Bug report
description: Agent Kourier does something it should not, or fails to do what the docs say.
labels: [bug]
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **A security problem does not go here:** report it privately, as
        [SECURITY.md](https://github.com/agentkourier/agent-kourier/blob/main/SECURITY.md) says.

        Redact tokens, Secret values, private Slack messages and workspace or channel identifiers from everything
        you paste. A fake value such as `C0123456789` is fine.
  - type: input
    id: version
    attributes:
      label: Version
      description: The chart and app version from `helm -n agent-kourier list`, or the commit for a build from source.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How it runs
      options:
        - Helm chart from ghcr.io (published release)
        - Helm chart from a checkout
        - Container without the chart
        - kind sandbox or end-to-end tier from this repository
        - Other (say below)
    validations:
      required: true
  - type: dropdown
    id: store
    attributes:
      label: Store
      options:
        - SQLite (one replica)
        - Postgres, one replica
        - Postgres, two replicas (leader election)
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Agent backend
      multiple: true
      options:
        - kagent 1.0 (kagent-v1 dialect)
        - kagent 0.9.x (a2a dialect)
        - Google AX (a2a dialect)
        - Another A2A agent (a2a dialect)
        - None yet
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The smallest steps that show it.
  - type: textarea
    id: config
    attributes:
      label: Config
      description: The Binding, AgentBackend, ChatConnection or chart values that matter, redacted.
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        The broker's log lines around the failure, redacted. With the chart:
        `kubectl -n agent-kourier logs -l app.kubernetes.io/name=agent-kourier --prefix --tail=200`
        (every replica, so the leader's lines are there).
      render: text
