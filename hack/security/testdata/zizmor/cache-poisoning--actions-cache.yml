# A tag-push (release) workflow that restores a cache earlier runs wrote, with actions/cache. (zizmor v1.30.1 does not
# flag actions/cache/restore here; see .github/zizmor.yml.)
name: fixture
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-release
      - run: make build
