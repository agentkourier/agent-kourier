# actions/checkout without persist-credentials: false leaves the token on disk for every later step.
name: fixture
on: pull_request
permissions: {}
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make build
