# The alert trial's Binding: your real alert channel, watched for the [kind] alerts of the full tier's
# Alertmanager and nothing else. up.sh adds this file to the Agent Kourier config only when the alert source is configured (the webhook file is there;
# render_agentkourier_config in env.sh), and fills __ALERT_CHANNEL_ID__ with ALERT_CHANNEL_ID, the one constant in webhook.sh, which it checked first.
#
# What keeps it from acting on production's channel:
# - triggers is authoritative, and it holds one botMessage trigger and no mention one: nobody can @mention Agent Kourier into this channel. (Left empty it
#   would default to a mention trigger.) A reply in a thread Agent Kourier started still continues that thread's session.
# - the trigger takes the incoming webhook's bot (B0123456789, by ID, never by name) and only the receiver slack-critical-kind. The $ anchors it:
#   production's alerts say receiver=slack-critical, and without the $ the pattern for the kind receiver would match longer names too. Grafana's alerts and
#   the Watchdog heartbeat share the bot and the channel, and fail the trigger's title and fallback matches; the exclude names the heartbeat as well.
# - askUser is off, written out: the agent asks nobody anything in the production channel (interactions.askUser is the field that lets it).
# The limits are 5 starts in 10 minutes, 2 at once and 40 a day.
#
# The agent, the identity and the connection are the sandbox Binding's (binding.yaml): the config has no rule of one Binding per identity.
apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata: {name: alert-trial, namespace: agent-kourier}
spec:
  agent:
    backendRef: {namespace: agent-kourier, name: agents}
    namespace: kagent
    name: sandbox-sre
  identity:
    userId: agent-kourier-sandbox
    tokenSecretRef: {name: agent-kourier-agent-token}
  chat:
    connectionRef: {namespace: agent-kourier, name: sandbox-slack}
    channel: __ALERT_CHANNEL_ID__
    output: live
    triggers:
      - type: botMessage
        from: {botId: B0123456789} # the incoming webhook's bot: production's Alertmanager, Grafana, the heartbeat, and kind's Alertmanager
        match:
          titleLink: 'receiver=slack-critical-kind$'
          title: '^(?:\[[^\]]{1,32}\] )?(?:FIRING \(\d+\)|RESOLVED) - '
          fallback: '^\[(?:FIRING(?::\d+)?|RESOLVED)\] '
        exclude: {title: '^Prometheus heartbeat$'}
        extract:
          state: {field: title, regex: '^(?:\[[^\]]{1,32}\] )?(?P<state>FIRING|RESOLVED)'}
          key: {field: fallback, regex: '^\[[A-Z]+(?::\d+)?\] (?P<key>[^(|]*[^(|\s])'}
          alertname: {field: title, regex: '^(?:\[[^\]]{1,32}\] )?(?:FIRING \(\d+\)|RESOLVED) - (?P<alertname>.+)$'}
        thread:
          by: key
          cooldown: 4h
          closeWhen: {state: RESOLVED}
        limits:
          rateLimit: {maxRuns: 5, per: 10m, maxConcurrent: 2}
          maxRunsPerDay: 40
        promptTemplate: |
          An alert is {{ .State }} in channel {{ .Channel }}: {{ .Fields.alertname }}.
          Investigate it with your read-only tools. Report the likely cause, the evidence you
          checked, and the next steps a person should take.
  interactions: {askUser: false}
