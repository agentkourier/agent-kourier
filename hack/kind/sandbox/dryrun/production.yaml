# A dry-run Binding for production: your alert channel, replayed through the trigger that production would run.
# Same as trial.yaml, with the receiver anchored at slack-critical: it takes production's alerts and not the kind ones.
# See trial.yaml for what loads it and why the $ matters.
apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata: {name: production, namespace: agent-kourier}
spec:
  agent:
    backendRef: {namespace: agent-kourier, name: agents}
    namespace: kagent
    name: sandbox-sre
  identity:
    userId: agent-kourier-sandbox
    tokenSecretRef: {name: agent-kourier-agent-token}
  chat:
    connectionRef: {namespace: agent-kourier, name: sandbox-slack}
    channel: C0123456789 # replace with your alert channel's ID
    output: live
    triggers:
      - type: mention
      - type: botMessage
        from: {botId: B0123456789} # the incoming webhook's bot: Alertmanager's alerts, Grafana's and the heartbeat
        match:
          titleLink: 'receiver=slack-critical$'
          title: '^(?:\[[^\]]{1,32}\] )?(?:FIRING \(\d+\)|RESOLVED) - '
          fallback: '^\[(?:FIRING(?::\d+)?|RESOLVED)\] '
        exclude: {title: '^Prometheus heartbeat$'}
        extract:
          state: {field: title, regex: '^(?:\[[^\]]{1,32}\] )?(?P<state>FIRING|RESOLVED)'}
          key: {field: fallback, regex: '^\[[A-Z]+(?::\d+)?\] (?P<key>[^(|]*[^(|\s])'}
          alertname: {field: title, regex: '^(?:\[[^\]]{1,32}\] )?(?:FIRING \(\d+\)|RESOLVED) - (?P<alertname>.+)$'}
        thread:
          by: key
          cooldown: 4h
          closeWhen: {state: RESOLVED}
        limits:
          rateLimit: {maxRuns: 5, per: 10m, maxConcurrent: 2}
          maxRunsPerDay: 40
        promptTemplate: |
          An alert is {{ .State }} in channel {{ .Channel }}: {{ .Fields.alertname }}.
          Investigate it with your read-only tools. Report the likely cause, the evidence you
          checked, and the next steps a person should take.
