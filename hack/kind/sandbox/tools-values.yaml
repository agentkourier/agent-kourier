# The sandbox's tool server: kagent's own tool chart (oci://ghcr.io/kagent-dev/tools/helm/kagent-tools, 0.3.0, the
# version kagent 1.0.0-alpha5 depends on), installed as its own Helm release, sandbox-tools, in namespace kagent. The
# full tier's kagent release keeps `kagent-tools: enabled: false` (hack/kind/full/kagent-values.yaml) and is never
# touched; down.sh uninstalls this release.
#
# Read-only by three separate things, so that no one of them is the only guard:
#   1. the ServiceAccount is bound to the built-in `view` ClusterRole (tools-rbac.yaml): no Secrets, no writes, and
#      this chart's own cluster-admin ClusterRole is not made (rbac.create: false);
#   2. the server runs with --read-only, which does not register its write tools (it leaves nine, none of which writes);
#   3. the sandbox-sre agent lists the read tools it uses by name (agent.yaml).
# Only the k8s tools are on: no helm, istio, argo, cilium, prometheus or utils ones.
fullnameOverride: sandbox-tools # the Service, the Deployment and the ServiceAccount are all named sandbox-tools
useDefaultServiceAccount: false
rbac:
  create: false # the ClusterRoleBinding to `view` is tools-rbac.yaml's
tools:
  loglevel: info
  metrics:
    port: 8085 # the chart's default is the server's own port, 8084, which it then declares twice and the API server refuses
  enabledTools: [k8s]
  args: ["--read-only"]
  image:
    # Tag and digest of the multi-arch index, which the chart's `tag` takes whole.
    tag: "0.3.0@sha256:cb89eb76216195a90cac73846b447525b6e6e33e45154d1ded9621bf11340315"
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
podSecurityContext:
  runAsNonRoot: true
  seccompProfile: {type: RuntimeDefault}
securityContext:
  allowPrivilegeEscalation: false
  capabilities: {drop: [ALL]}
  readOnlyRootFilesystem: true
