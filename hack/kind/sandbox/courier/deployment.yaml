# Courier in the sandbox tier: the production image, courier:dev (make image; loaded into the cluster by up.sh, never
# pulled), against a real Slack, in place of the full tier's own courier (the testhooks image on the fake Slack), which up.sh
# scales to zero and down.sh scales back to one. A Deployment of its own, so that taking the sandbox away is deleting it.
# Everything else is the fast tier's courier (hack/kind/fast/courier/deployment.yaml): one replica with strategy Recreate (the
# SQLite volume is never mounted by two pods), the same ServiceAccount and Role, and the pod label the front door's NetworkPolicy
# trusts (app.kubernetes.io/name=courier). It differs by the volume and ConfigMap names, the image, and the missing
# COURIER_SLACK_API_URL, which is a test hook of the testhooks image that the production image does not have.
# The Slack tokens are not in the environment: the resolver reads the Secret sandbox-slack through the API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: courier-sandbox
  namespace: courier
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: courier, app.kubernetes.io/instance: sandbox}
  template:
    metadata:
      labels: {app.kubernetes.io/name: courier, app.kubernetes.io/instance: sandbox}
    spec:
      serviceAccountName: courier
      terminationGracePeriodSeconds: 40 # past the 25 s ordered shutdown
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: courier
          image: courier:dev
          imagePullPolicy: Never
          env:
            - {name: COURIER_CONFIG_DIR, value: /etc/courier}
            - {name: COURIER_DB_PATH, value: /data/courier.db}
            - {name: COURIER_LISTEN, value: ":8080"}
            - {name: COURIER_LOG_LEVEL, value: info}
            - {name: COURIER_KLOG_V, value: "0"}
          ports: [{name: http, containerPort: 8080}]
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 2, failureThreshold: 40}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: config, mountPath: /etc/courier, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: courier-sandbox-config}
        - name: data
          persistentVolumeClaim: {claimName: courier-sandbox-data}
        - name: tmp
          emptyDir: {}
---
# The sandbox courier's own SQLite volume, so that what the sandbox runs up never meets the tier's: sessions, the outbox and
# the dedup record of a real workspace stay out of the full tier's database, and down.sh deletes it with the Deployment.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: courier-sandbox-data
  namespace: courier
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources: {requests: {storage: 1Gi}}
