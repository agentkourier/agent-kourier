# The Alertmanager configuration of the sandbox's alert source (CT-7a): what the full tier's Alertmanager (monitoring/courier,
# run by prometheus-operator) is given by `make sandbox-up`, as the Secret alertmanager-kind-config (the Alertmanager's
# configSecret, overlay.yaml). It posts alerts to the owner's real Slack alert channel through a copy of the production
# receiver `slack-critical` (cluster-apps, templates/prometheus-operator.yaml), so courier's chat trigger sees the
# messages that the real template makes. test/kindmanifests pins the copy: the same slack_configs as the owner's, except
# that the title is prefixed `[kind] `, and the receiver is named slack-critical-kind, which is what courier's trial trigger
# matches (Alertmanager puts the receiver's name in the title_link, `<externalUrl>/#/alerts?receiver=<name>`, and in no
# other place a trigger can read it). The webhook URL is not here: api_url_file reads it from the Secret
# alertmanager-slack-secret that up.sh makes from ~/.config/agent-courier/alertmanager-webhook-url, mounted by the
# Alertmanager's `secrets` (overlay.yaml), the way production does it.
#
# Why this is the base configuration and not an AlertmanagerConfig resource: that resource cannot say api_url_file (its Slack
# receiver takes the URL from a Secret key and the operator writes the URL into the generated configuration), and the
# operator adds a namespace="<its namespace>" matcher to a resource's routes, which would turn away alerts for namespace
# shop (the tier's Alertmanager says alertmanagerConfigMatcherStrategy: None, so the sink's route has none, but a route here
# needs none whichever strategy is set). The operator never changes the base configuration's routes: it puts the routes of
# the tier's AlertmanagerConfig (the sink, which every alert must still reach) in front of these, all with continue: true.
global:
  resolve_timeout: 5m
route:
  receiver: "null"
  group_by: ["alertname", "namespace"]
  group_wait: 30s
  # Production's is 5m, which would hold a resolve for up to five minutes. 30s lets a trial see it in under a minute.
  group_interval: 30s
  repeat_interval: 4h
  routes:
    - receiver: slack-critical-kind
      matchers:
        - severity="critical"
      continue: true
receivers:
  - name: "null"
  - name: slack-critical-kind
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-secret/webhook-url
        channel: "#alerts-critical"
        send_resolved: true
        title: '[kind] {{ .Status | toUpper }}{{ if eq .Status "firing" }} ({{ .Alerts.Firing | len }}){{ end }} - {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *{{ .Labels.alertname }}* - {{ .Labels.severity }}
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
