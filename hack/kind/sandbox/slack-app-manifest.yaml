display_information:
  name: Agent Kourier
  description: Brings A2A agents into Slack threads, through Agent Kourier.
features:
  bot_user:
    display_name: Agent Kourier
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      # chat:write also covers assistant.threads.setStatus, the status an alert thread shows while an agent works: slack-go says the
      # method accepts chat:write or assistant:write, and that assistant:write is being deprecated (unverified against Slack).
      - chat:write
      - reactions:write
      - usergroups:read
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
