# The generic a2a dialect against the stub agent in its plain pod (DEMO-1): what an agent in an ordinary Deployment is,
# one that is no kagent and has no front door. The dialect uses the URL exactly, where kagent-v1 adds /agents/<namespace>/<name>
# to it, so each backend is the exact URL of one agent, and the Bindings of binding-a2a-*.yaml name the agent they reach twice, here
# and in their own agent reference (a logical name for the thread's record, which this dialect does not put on the wire). The stub
# serves these agents at kagent's paths, so the URLs end in them. The bearer token is the fast tier's static one
# (Secret agent-kourier-agent-token, up-fast.sh); no header is added.
#
# The fast tier only, and so in a directory of its own, beside config/ and not in it: up-fast.sh gives it to deploy_agentkourier as the
# extra config, and up-full.sh does not, since the full tier has no stub and its AgentBackend is the front door alone (spec D32, R4).
# test/kindmanifests pins the dialect and each URL, and that the full tier does not get these files.
apiVersion: agentkourier.dev/v1alpha1
kind: AgentBackend
metadata: {name: stub-a2a-gated, namespace: agent-kourier}
spec:
  dialect: a2a
  url: http://stubagent.e2e.svc.cluster.local:8080/agents/kagent/scenario-gated
---
apiVersion: agentkourier.dev/v1alpha1
kind: AgentBackend
metadata: {name: stub-a2a-test-agent, namespace: agent-kourier}
spec:
  dialect: a2a
  url: http://stubagent.e2e.svc.cluster.local:8080/agents/kagent/test-agent
---
apiVersion: agentkourier.dev/v1alpha1
kind: AgentBackend
metadata: {name: stub-a2a-memory, namespace: agent-kourier}
spec:
  dialect: a2a
  url: http://stubagent.e2e.svc.cluster.local:8080/agents/kagent/scenario-memory
