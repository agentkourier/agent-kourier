# S15: a storm of distinct Alertmanager alerts posted to the channel through an incoming webhook is held to the trigger's
# limits: the first three start an investigation each in their own thread, the rest start nothing and get no note, and
# one digest line in the channel, when the window ends, says how many were not investigated. The window is the shortest
# there is (10s) so the digest comes within a minute; the daily cap is explicitly off (0), so that runs of the scenario
# on one cluster never meet a daily cap of 40. The bot is named by its ID (D36), the receiver anchored as in S14's.
# A channel of its own on the fake Slack; the identity token is the same Secret as fast-chat's. The channel, the bot and
# the agent are pinned by test/kindmanifests and test/e2e/scenarios.go. Like S14 it runs in the fast tier only: the full
# tier's kagent has no scenario-alert agent.
apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata: {name: fast-s15, namespace: agent-kourier}
spec:
  agent:
    backendRef: {namespace: agent-kourier, name: agents}
    namespace: kagent
    name: scenario-alert
  identity:
    userId: agent-kourier-fast
    tokenSecretRef: {name: agent-kourier-agent-token}
  chat:
    connectionRef: {namespace: agent-kourier, name: slack-fast}
    channel: CS15
    output: live
    triggers:
      - type: botMessage
        from: {botId: B0S15ALERT1}
        match:
          titleLink: 'receiver=slack-critical-kind$'
          title: '^(?:\[[^\]]{1,32}\] )?(?:FIRING \(\d+\)|RESOLVED) - '
          fallback: '^\[(?:FIRING(?::\d+)?|RESOLVED)\] '
        extract:
          state: {field: title, regex: '^(?:\[[^\]]{1,32}\] )?(?P<state>FIRING|RESOLVED)'}
          key: {field: fallback, regex: '^\[[A-Z]+(?::\d+)?\] (?P<key>[^(|]*[^(|\s])'}
          alertname: {field: title, regex: '^(?:\[[^\]]{1,32}\] )?(?:FIRING \(\d+\)|RESOLVED) - (?P<alertname>.+)$'}
        thread:
          by: key
          cooldown: 4h
          closeWhen: {state: RESOLVED}
        limits:
          rateLimit: {maxRuns: 3, per: 10s, maxConcurrent: 5}
          maxRunsPerDay: 0
        promptTemplate: |
          An alert is {{ .State }} in channel {{ .Channel }}: {{ .Fields.alertname }}.
          Investigate it with your read-only tools. Report the likely cause, the evidence you
          checked, and the next steps a person should take.
