# S16 (failover), cases 1 and 4: a mention streams its reply into a new thread while the gated agent holds its task, and the leader
# of the two Agent Kourier replicas is killed (case 1) or frozen past its lease (case 4) with the task held. The standby takes over and the
# turn ends in the same message. The same Binding as S1's, on a channel of its own so that scenarios never share a thread; the
# identity token is the same Secret as fast-chat's. The channel and the agent are pinned by test/kindmanifests and test/e2e/scenarios.go.
# S16 runs in the fast tier on Postgres with two replicas only, and skips elsewhere; the full tier loads this Binding too and never uses it.
apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata: {name: fast-s16, namespace: agent-kourier}
spec:
  agent:
    backendRef: {namespace: agent-kourier, name: agents}
    namespace: kagent
    name: scenario-gated
  identity:
    userId: agent-kourier-fast
    tokenSecretRef: {name: agent-kourier-agent-token}
  chat:
    connectionRef: {namespace: agent-kourier, name: slack-fast}
    channel: CS16
    output: live
