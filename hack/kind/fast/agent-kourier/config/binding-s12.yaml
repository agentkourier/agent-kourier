# S12: the agent's task fails, or completes with nothing to show; Agent Kourier tells the thread in its own words.
# A channel of its own on the fake Slack, so scenarios never share a thread; the identity token is the same
# Secret as fast-chat's. The channel and the agent are pinned by test/kindmanifests and test/e2e/scenarios.go.
# The full tier loads this Binding too, but its kagent has no scenario-fails agent, so S12 runs in the fast tier only.
apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata: {name: fast-s12, namespace: agent-kourier}
spec:
  agent:
    backendRef: {namespace: agent-kourier, name: agents}
    namespace: kagent
    name: scenario-fails
  identity:
    userId: agent-kourier-fast
    tokenSecretRef: {name: agent-kourier-agent-token}
  chat:
    connectionRef: {namespace: agent-kourier, name: slack-fast}
    channel: CS12
    output: live
