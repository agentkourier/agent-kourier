# S19: the stub approval agent's tool runs after an approval. This has its own channel so the
# approval interaction and its audit row cannot be confused with S20's denial or S11's refusal.
apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata: {name: fast-s19, namespace: agent-kourier}
spec:
  agent:
    backendRef: {namespace: agent-kourier, name: agents}
    namespace: kagent
    name: spike-approve
  identity:
    userId: agent-kourier-fast
    tokenSecretRef: {name: agent-kourier-agent-token}
  chat:
    connectionRef: {namespace: agent-kourier, name: slack-fast}
    channel: CS19
    output: live
  interactions: {toolApprovals: true}
