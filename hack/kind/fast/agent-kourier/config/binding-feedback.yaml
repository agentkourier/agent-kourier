# S17: the feedback buttons on the final message of an investigation an alert started (spec 8.7). The trigger is S14's, for the
# bot the scenario posts as; the Binding does not set feedback.enabled, since the buttons of an investigation a trigger
# started do not depend on it. A channel of its own on the fake Slack, so scenarios never share a thread; the identity
# token is the same Secret as fast-chat's. The channel, the bot and the agent are pinned by test/kindmanifests and
# test/e2e/scenarios.go. Like S14 it runs in the fast tier only: the full tier's kagent has no scenario-alert agent.
apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata: {name: fast-s17, namespace: agent-kourier}
spec:
  agent:
    backendRef: {namespace: agent-kourier, name: agents}
    namespace: kagent
    name: scenario-alert
  identity:
    userId: agent-kourier-fast
    tokenSecretRef: {name: agent-kourier-agent-token}
  chat:
    connectionRef: {namespace: agent-kourier, name: slack-fast}
    channel: CS17
    output: live
    triggers:
      - type: botMessage
        from: {botId: B0S17ALERT1}
        match:
          titleLink: 'receiver=slack-critical-kind$'
          title: '^(?:\[[^\]]{1,32}\] )?(?:FIRING \(\d+\)|RESOLVED) - '
          fallback: '^\[(?:FIRING(?::\d+)?|RESOLVED)\] '
        extract:
          state: {field: title, regex: '^(?:\[[^\]]{1,32}\] )?(?P<state>FIRING|RESOLVED)'}
          key: {field: fallback, regex: '^\[[A-Z]+(?::\d+)?\] (?P<key>[^(|]*[^(|\s])'}
          alertname: {field: title, regex: '^(?:\[[^\]]{1,32}\] )?(?:FIRING \(\d+\)|RESOLVED) - (?P<alertname>.+)$'}
        thread:
          by: key
          cooldown: 4h
          closeWhen: {state: RESOLVED}
        limits:
          rateLimit: {maxRuns: 5, per: 10m, maxConcurrent: 2}
          maxRunsPerDay: 40
        promptTemplate: |
          An alert is {{ .State }} in channel {{ .Channel }}: {{ .Fields.alertname }}.
          Investigate it with your read-only tools. Report the likely cause, the evidence you
          checked, and the next steps a person should take.
