# S16 (failover), case 3: a storm of distinct Alertmanager alerts is posted to the channel through an incoming webhook, S15's, and the
# leader of the two Agent Kourier replicas is killed with the first three investigations running (the gated agent holds each on a gate that
# its alert names). The standby takes over: each started investigation ends in its own thread, once, the others start nothing, and the
# one digest line says how many were not investigated. The limits are S15's (three starts in 10 seconds, the shortest window, no daily
# cap), with room for twenty investigations at once instead of five: a run that fails leaves its three held investigations running, and
# five of them would make the next run's alerts limited by concurrency, which the scenario does not measure. A channel of its own on the fake Slack; the identity token is the same Secret as fast-chat's. The channel, the bot and the
# agent are pinned by test/kindmanifests and test/e2e/scenarios.go. Fast tier on Postgres with two replicas only.
apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata: {name: fast-s16c, namespace: agent-kourier}
spec:
  agent:
    backendRef: {namespace: agent-kourier, name: agents}
    namespace: kagent
    name: scenario-gated
  identity:
    userId: agent-kourier-fast
    tokenSecretRef: {name: agent-kourier-agent-token}
  chat:
    connectionRef: {namespace: agent-kourier, name: slack-fast}
    channel: CS16C
    output: live
    triggers:
      - type: botMessage
        from: {botId: B0S16ALERT1}
        match:
          titleLink: 'receiver=slack-critical-kind$'
          title: '^(?:\[[^\]]{1,32}\] )?(?:FIRING \(\d+\)|RESOLVED) - '
          fallback: '^\[(?:FIRING(?::\d+)?|RESOLVED)\] '
        extract:
          state: {field: title, regex: '^(?:\[[^\]]{1,32}\] )?(?P<state>FIRING|RESOLVED)'}
          key: {field: fallback, regex: '^\[[A-Z]+(?::\d+)?\] (?P<key>[^(|]*[^(|\s])'}
          alertname: {field: title, regex: '^(?:\[[^\]]{1,32}\] )?(?:FIRING \(\d+\)|RESOLVED) - (?P<alertname>.+)$'}
        thread:
          by: key
          cooldown: 4h
          closeWhen: {state: RESOLVED}
        limits:
          rateLimit: {maxRuns: 3, per: 10s, maxConcurrent: 20}
          maxRunsPerDay: 0
        promptTemplate: |
          An alert is {{ .State }} in channel {{ .Channel }}: {{ .Fields.alertname }}.
          Investigate it with your read-only tools. Report the likely cause, the evidence you
          checked, and the next steps a person should take.
