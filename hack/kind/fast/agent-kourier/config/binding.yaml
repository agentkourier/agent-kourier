# Channel C1 on the fake Slack, answered by the stub agent's test-agent. Its identity token is the Secret
# agent-kourier-agent-token, key token: an unsigned JWT that up-fast.sh makes, which is all the stub asks for.
# The scenario Bindings (one channel each, for the stub's scenario agents) are the behavior-named binding-*.yaml files.
apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata: {name: fast-chat, namespace: agent-kourier}
spec:
  agent:
    backendRef: {namespace: agent-kourier, name: agents}
    namespace: kagent
    name: test-agent
  identity:
    userId: agent-kourier-fast
    tokenSecretRef: {name: agent-kourier-agent-token}
  chat:
    connectionRef: {namespace: agent-kourier, name: slack-fast}
    channel: C1
    output: live
