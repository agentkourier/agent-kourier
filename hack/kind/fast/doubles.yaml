# The fast tier's test doubles, from the one image up-fast.sh builds and loads. Every Service is
# ClusterIP and stays that way: the fake Slack's /_control/ and the stub agent's
# /_control/release/ have no authentication, so their ports are never published (no NodePort,
# Ingress, LoadBalancer or hostPort). verify.sh checks that for both, for the fake web sender's /_control/, and for hitlagent, which checks no credential.
# Agent Kourier reaches them at fakeslack.e2e.svc.cluster.local:8080 (slack-go API URL plus "/"),
# stubagent.e2e.svc.cluster.local:8080/agents/kagent/<agent>, hitlagent.e2e.svc.cluster.local:8080/ (an A2A agent
# written from the agent contract alone, test/hitlagent), sink.e2e.svc.cluster.local:8080 and fakeweb.e2e.svc.cluster.local:8080/replies (the
# kourier-v1 connection's replies).
apiVersion: v1
kind: Namespace
metadata:
  name: e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fakeslack
  namespace: e2e
spec:
  replicas: 1
  selector:
    matchLabels: {app: fakeslack}
  template:
    metadata:
      labels: {app: fakeslack}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: fakeslack
          image: agent-kourier-e2e/fast-doubles:dev
          imagePullPolicy: Never
          # Two more Slack apps beside the default one, which answers every token that no -app owns (the tier's ChatConnection slack-fast, and every
          # scenario of one app): team-a's and team-b's, for the scenarios of a broker that serves several ChatConnections (the MC_ tests, E2E_TWO_APPS=1
          # in up-fast.sh). Their bots join only the channels a scenario puts them in. The tokens are fake constants; test/e2e's twoapps.go names the
          # same ones, and test/kindmanifests pins that they agree.
          command:
            - /fakeslack
            - -addr
            - 0.0.0.0:8080
            - -app
            - app_id=ATEAMA,bot_user=UTEAMA,bot_id=BTEAMA,team_id=TTEAMA,team_name=team-a,bot_token=xoxb-fake-team-a-token,app_token=xapp-fake-team-a-token
            - -app
            - app_id=ATEAMB,bot_user=UTEAMB,bot_id=BTEAMB,team_id=TTEAMB,team_name=team-b,bot_token=xoxb-fake-team-b-token,app_token=xapp-fake-team-b-token
          ports: [{containerPort: 8080}]
          readinessProbe: {tcpSocket: {port: 8080}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: fakeslack
  namespace: e2e
spec:
  type: ClusterIP
  selector: {app: fakeslack}
  ports: [{port: 8080, targetPort: 8080}]
---
# -require-auth: a request with no bearer token gets 401, as kagent in OIDC mode answers.
# -unique-ids: the ids of one start are not those of another. A test restarts this pod, and Agent Kourier's store outlives the
# restart: with the counter begun again at 1, a task id of an earlier run (and so the interaction id derived from it) met a row
# that was already decided, and a prompt was never posted; and a context id made after the restart matched one the stub had
# adopted from Agent Kourier before it, so that a new thread joined an old session and saw its turns.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stubagent
  namespace: e2e
spec:
  replicas: 1
  selector:
    matchLabels: {app: stubagent}
  template:
    metadata:
      labels: {app: stubagent}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: stubagent
          image: agent-kourier-e2e/fast-doubles:dev
          imagePullPolicy: Never
          command: ["/stubagent", "-addr", "0.0.0.0:8080", "-require-auth", "-unique-ids"]
          ports: [{containerPort: 8080}]
          readinessProbe: {tcpSocket: {port: 8080}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: stubagent
  namespace: e2e
spec:
  type: ClusterIP
  selector: {app: stubagent}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hitlagent
  namespace: e2e
spec:
  replicas: 1
  selector:
    matchLabels: {app: hitlagent}
  template:
    metadata:
      labels: {app: hitlagent}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: hitlagent
          image: agent-kourier-e2e/fast-doubles:dev
          imagePullPolicy: Never
          command: ["/hitlagent"]
          env: [{name: PORT, value: "8080"}, {name: AGENT_URL, value: "http://hitlagent.e2e.svc.cluster.local:8080/"}]
          ports: [{containerPort: 8080}]
          readinessProbe: {tcpSocket: {port: 8080}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: hitlagent
  namespace: e2e
spec:
  type: ClusterIP
  selector: {app: hitlagent}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sink
  namespace: e2e
spec:
  replicas: 1
  selector:
    matchLabels: {app: sink}
  template:
    metadata:
      labels: {app: sink}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: sink
          image: agent-kourier-e2e/fast-doubles:dev
          imagePullPolicy: Never
          command: ["/sink", "-addr", "0.0.0.0:8080"]
          ports: [{containerPort: 8080}]
          readinessProbe: {tcpSocket: {port: 8080}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: sink
  namespace: e2e
spec:
  type: ClusterIP
  selector: {app: sink}
  ports: [{port: 8080, targetPort: 8080}]
---
# The far side of the web ChatConnections (test/fakeweb; hack/kind/fast/web, which only the tier on custom resources serves): the sender POSTs the
# requests the WEB_ tests ask for, signed as kourier-v1 and as GitHub, to the broker's chat Service, and the receiver is the kourier-v1 connection's
# spec.web.url, which checks and keeps the replies. Its /_control/ has no authentication, so its port is never published (verify.sh checks it). The secrets
# are fake constants, the same that lib.sh's deploy_web puts in the connections' Secrets (test/kindmanifests pins that they agree).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fakeweb
  namespace: e2e
spec:
  replicas: 1
  selector:
    matchLabels: {app: fakeweb}
  template:
    metadata:
      labels: {app: fakeweb}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: fakeweb
          image: agent-kourier-e2e/fast-doubles:dev
          imagePullPolicy: Never
          command:
            - /fakeweb
            - -addr
            - 0.0.0.0:8080
            - -chat-url
            - http://agent-kourier-chat.agent-kourier.svc.cluster.local:8081
            - -kourier-v1-secret
            - fake-web-kourier-signing-secret
            - -github-secret
            - fake-web-github-webhook-secret
          ports: [{containerPort: 8080}]
          readinessProbe: {tcpSocket: {port: 8080}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: fakeweb
  namespace: e2e
spec:
  type: ClusterIP
  selector: {app: fakeweb}
  ports: [{port: 8080, targetPort: 8080}]
