# What courier runs as in the fast tier. It reads the Secrets that its config names (spec section 10)
# through the Kubernetes API, so its ServiceAccount keeps its token mounted (the doubles' do not), and
# its Role gives list and watch on Secrets in namespace courier and nothing else: the resolver reads
# them through shared informers, which never issue a get (WP-21d). Namespace courier
# is created by up-fast.sh; the Secrets in it are too, with fake values, and are never committed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: courier
  namespace: courier
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: courier-secrets
  namespace: courier
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: courier-secrets
  namespace: courier
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: courier-secrets}
subjects: [{kind: ServiceAccount, name: courier, namespace: courier}]
