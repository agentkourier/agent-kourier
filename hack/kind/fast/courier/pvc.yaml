# The volume for courier's SQLite database. kind's default StorageClass, standard, is local-path, which
# binds when the pod is first scheduled.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: courier-data
  namespace: courier
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources: {requests: {storage: 1Gi}}
