# The plain pod forgets its contexts: scenario-memory says which turn its context has had, so a context that the agent lost shows
# as "Message 1". The scenario restarts the stub agent's pod between two turns of a thread (the stub keeps its sessions in
# memory, as an agent without a volume does) and reads what the thread shows (docs/spikes/demo1-a2a-plain-pod.md). A channel of its
# own on the fake Slack; the identity token is the same Secret as fast-chat's. The channel and the agent are pinned by
# test/kindmanifests and test/e2e/scenarios.go.
apiVersion: agentcourier.dev/v1alpha1
kind: Binding
metadata: {name: fast-a2a-memory, namespace: courier}
spec:
  agent:
    backendRef: {namespace: courier, name: stub-a2a-memory}
    namespace: kagent
    name: scenario-memory
  identity:
    userId: courier-fast
    tokenSecretRef: {name: courier-agent-token}
  chat:
    connectionRef: {namespace: courier, name: slack-fast}
    channel: CA2AM
    output: live
