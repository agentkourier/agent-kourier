# Courier in the fast tier. One replica with strategy Recreate: the SQLite volume must never be mounted
# by two pods, which is also why the test harness arms a fault by patching this Deployment's env and
# never by deleting its pod (kube.Pods.SetFault). It runs the testhooks image, which only the kind tiers
# have (courier-e2e/courier-testhooks:dev, built by `make image-testhooks`, loaded by up-fast.sh and
# never pulled or pushed), so that COURIER_SLACK_API_URL can point it at the fake Slack. The pod carries
# app.kubernetes.io/name=courier, the label the full tier's NetworkPolicy trusts; the test runner never does.
#
# TODO(WP-35g3): cmd/courier is only `--version` until WP-35f2d, so this pod exits at once and cycles
# until then. 35g3 sets its args and env per 35f2d (the config directory /etc/courier, the database
# under /data, the listen address, klog and log level) and checks the probe port, which is a guess.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: courier
  namespace: courier
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: courier}
  template:
    metadata:
      labels: {app.kubernetes.io/name: courier}
    spec:
      serviceAccountName: courier
      terminationGracePeriodSeconds: 40 # past the 25 s ordered shutdown (WP-35f2c)
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: courier
          image: courier-e2e/courier-testhooks:dev
          imagePullPolicy: Never
          env:
            - {name: COURIER_SLACK_API_URL, value: "http://fakeslack.e2e.svc.cluster.local:8080/"}
          ports: [{name: http, containerPort: 8080}]
          # Bootstrap waits up to 30 s for the Secret caches, so startup is allowed 80 s before the
          # other probes begin.
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 2, failureThreshold: 40}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: config, mountPath: /etc/courier, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: courier-config}
        - name: data
          persistentVolumeClaim: {claimName: courier-data}
        - name: tmp
          emptyDir: {}
