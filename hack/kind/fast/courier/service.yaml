# Courier's health and metrics port, for the E2E runner (E2E_COURIER_URL): a ClusterIP Service on that one
# port, fast tier only, never published. The Alertmanager receiver is a different port and is not exposed
# here; its Service waits for WP-47. The pod's one container port is http; if courier later serves the
# receiver on another, the Service must not follow (test/kindmanifests pins it).
apiVersion: v1
kind: Service
metadata:
  name: courier
  namespace: courier
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: courier}
  ports:
    - {name: http, port: 8080, targetPort: http}
