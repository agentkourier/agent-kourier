# Channel C1 on the fake Slack, answered by the stub agent's test-agent. Its identity token is the Secret
# courier-agent-token, key token: an unsigned JWT that up-fast.sh makes, which is all the stub asks for.
# The scenario Bindings (one channel each, for the stub's scenario agents) are binding-s*.yaml.
apiVersion: agentcourier.dev/v1alpha1
kind: Binding
metadata: {name: fast-chat, namespace: courier}
spec:
  agent:
    backendRef: {namespace: courier, name: stub}
    namespace: kagent
    name: test-agent
  identity:
    userId: courier-fast
    tokenSecretRef: {name: courier-agent-token}
  chat:
    connectionRef: {namespace: courier, name: slack-fast}
    channel: C1
    output: live
