# The stub agent, which answers as kagent's A2A front door does (-require-auth: a bearer token is
# needed). The kagent-v1 dialect adds /agents/<namespace>/<name> to the URL.
apiVersion: agentcourier.dev/v1alpha1
kind: AgentBackend
metadata: {name: stub, namespace: courier}
spec:
  dialect: kagent-v1
  url: http://stubagent.e2e.svc.cluster.local:8080
