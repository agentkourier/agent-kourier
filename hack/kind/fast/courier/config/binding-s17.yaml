# S17: the feedback buttons on the final message of an investigation an alert started (spec 8.7). The trigger is S14's, for the
# bot the scenario posts as; the Binding does not set feedback.enabled, since the buttons of an investigation a trigger
# started do not depend on it. A channel of its own on the fake Slack, so scenarios never share a thread; the identity
# token is the same Secret as fast-chat's. The channel, the bot and the agent are pinned by test/kindmanifests and
# test/e2e/scenarios.go. Like S14 it runs in the fast tier only: the full tier's kagent has no scenario-alert agent.
apiVersion: agentcourier.dev/v1alpha1
kind: Binding
metadata: {name: fast-s17, namespace: courier}
spec:
  agent:
    backendRef: {namespace: courier, name: agents}
    namespace: kagent
    name: scenario-alert
  identity:
    userId: courier-fast
    tokenSecretRef: {name: courier-agent-token}
  chat:
    connectionRef: {namespace: courier, name: slack-fast}
    channel: CS17
    output: live
    triggers:
      - type: botMessage
        from: {botId: B0S17ALERT1}
        preset: alertmanager
        match: {titleLink: 'receiver=slack-critical-kind$'}
