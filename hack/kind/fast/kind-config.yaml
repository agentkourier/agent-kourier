# kind config for the fast E2E tier: one node, and no extraPortMappings, so no pod port is
# published on the host (the fake Slack's /_control/ has no authentication).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: courier-fast
networking:
  apiServerAddress: "127.0.0.1"
nodes:
  - role: control-plane
    labels:
      courier.agent-courier.dev/owner: up-fast
