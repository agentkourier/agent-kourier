# kind config for the fast E2E tier: one node, and no extraPortMappings, so no pod port is
# published on the host (the fake Slack's /_control/ and the stub agent's /_control/release/ have
# no authentication).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: agent-kourier-fast
networking:
  apiServerAddress: "127.0.0.1"
nodes:
  - role: control-plane
    labels:
      agentkourier.agent-kourier.dev/owner: up-fast
