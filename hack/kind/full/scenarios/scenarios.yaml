# The Phase 1 scenario agents of the full tier (WP-36h), the kagent side of the stub agents the fast tier has by the
# same names, so the scenario Bindings are the same in both tiers (full/courier/agentbackend.yaml). Each agent's
# model is the scenario model (scenariollm.py), which plays the agent its ModelConfig header names; S5 and the
# smoke test use test-agent on mockllm (agent.yaml). The one tool, add_numbers (scenariomcp.py), is the S11
# agent's, and needs approval before it runs. The two servers' code comes from ConfigMaps that up-full.sh makes
# from the files in scenarios/. Test only: no authentication, never published.
apiVersion: apps/v1
kind: Deployment
metadata: {name: scenariollm, namespace: kagent}
spec:
  selector: {matchLabels: {app: scenariollm}}
  template:
    metadata: {labels: {app: scenariollm}}
    spec:
      containers:
        - name: scenariollm
          image: python:3.13-alpine@sha256:79e7a9b9ff1cbceff819f856fb374477792a5967759d94df266de7b7b4120e6f
          command: ["python", "/app/scenariollm.py", "8080"]
          ports: [{containerPort: 8080}]
          volumeMounts: [{name: app, mountPath: /app}]
      volumes: [{name: app, configMap: {name: scenariollm}}]
---
apiVersion: v1
kind: Service
metadata: {name: scenariollm, namespace: kagent}
spec: {selector: {app: scenariollm}, ports: [{port: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: scenariomcp, namespace: kagent}
spec:
  selector: {matchLabels: {app: scenariomcp}}
  template:
    metadata: {labels: {app: scenariomcp}}
    spec:
      containers:
        - name: scenariomcp
          image: python:3.13-alpine@sha256:79e7a9b9ff1cbceff819f856fb374477792a5967759d94df266de7b7b4120e6f
          command: ["python", "/app/scenariomcp.py", "8082"]
          ports: [{containerPort: 8082}]
          volumeMounts: [{name: app, mountPath: /app}]
      volumes: [{name: app, configMap: {name: scenariomcp}}]
---
apiVersion: v1
kind: Service
metadata: {name: scenariomcp, namespace: kagent}
spec: {selector: {app: scenariomcp}, ports: [{port: 8082}]}
---
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata: {name: scenariomcp, namespace: kagent}
spec:
  description: One-tool MCP server for the S11 agent
  protocol: STREAMABLE_HTTP
  url: http://scenariomcp.kagent.svc.cluster.local:8082/mcp
---
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata: {name: scenario-gated, namespace: kagent}
spec:
  provider: OpenAI
  model: gpt-4.1-mini
  apiKeySecret: kagent-openai
  apiKeySecretKey: OPENAI_API_KEY
  openAI: {baseUrl: "http://scenariollm.kagent.svc.cluster.local:8080/v1"}
  defaultHeaders: {X-Scenario: gated}
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata: {name: scenario-gated, namespace: kagent}
spec:
  template:
    modelConfig: {name: scenario-gated}
    description: "S1 and S4: replies in two parts, holding between them on a gate the test releases"
    systemPrompt: Reply.
  harness:
    kagent: {}
    workload:
      image: ghcr.io/kagent-dev/kagent/golang-adk@sha256:ed668c38a5805723912497d4ea085e711cf585d440907abfff3dd27991d768cc
    substrate:
      workerPoolRef: {name: kagent-default}
      snapshotPolicy: {location: "gs://ate-snapshots/kagent/"} # see agent.yaml
---
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata: {name: scenario-memory, namespace: kagent}
spec:
  provider: OpenAI
  model: gpt-4.1-mini
  apiKeySecret: kagent-openai
  apiKeySecretKey: OPENAI_API_KEY
  openAI: {baseUrl: "http://scenariollm.kagent.svc.cluster.local:8080/v1"}
  defaultHeaders: {X-Scenario: memory}
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata: {name: scenario-memory, namespace: kagent}
spec:
  template:
    modelConfig: {name: scenario-memory}
    description: "S2: says how many turns its conversation has had and quotes the earlier ones"
    systemPrompt: Reply.
  harness:
    kagent: {}
    workload:
      image: ghcr.io/kagent-dev/kagent/golang-adk@sha256:ed668c38a5805723912497d4ea085e711cf585d440907abfff3dd27991d768cc
    substrate:
      workerPoolRef: {name: kagent-default}
      snapshotPolicy: {location: "gs://ate-snapshots/kagent/"} # see agent.yaml
---
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata: {name: scenario-ask, namespace: kagent}
spec:
  provider: OpenAI
  model: gpt-4.1-mini
  apiKeySecret: kagent-openai
  apiKeySecretKey: OPENAI_API_KEY
  openAI: {baseUrl: "http://scenariollm.kagent.svc.cluster.local:8080/v1"}
  defaultHeaders: {X-Scenario: ask}
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata: {name: scenario-ask, namespace: kagent}
spec:
  template:
    modelConfig: {name: scenario-ask}
    description: "S3: asks two questions with ask_user, then says what it was answered"
    systemPrompt: Ask the user.
  harness:
    kagent: {}
    workload:
      image: ghcr.io/kagent-dev/kagent/golang-adk@sha256:ed668c38a5805723912497d4ea085e711cf585d440907abfff3dd27991d768cc
    substrate:
      workerPoolRef: {name: kagent-default}
      snapshotPolicy: {location: "gs://ate-snapshots/kagent/"} # see agent.yaml
---
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata: {name: spike-approve, namespace: kagent}
spec:
  provider: OpenAI
  model: gpt-4.1-mini
  apiKeySecret: kagent-openai
  apiKeySecretKey: OPENAI_API_KEY
  openAI: {baseUrl: "http://scenariollm.kagent.svc.cluster.local:8080/v1"}
  defaultHeaders: {X-Scenario: approve}
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata: {name: spike-approve, namespace: kagent}
spec:
  template:
    modelConfig: {name: spike-approve}
    description: "S11: calls a tool that needs approval, then says what became of it"
    systemPrompt: Use the tool.
    tools: [{mcp: {server: {kind: RemoteMCPServer, name: scenariomcp}, requireApproval: true}}]
  harness:
    kagent: {}
    workload:
      image: ghcr.io/kagent-dev/kagent/golang-adk@sha256:ed668c38a5805723912497d4ea085e711cf585d440907abfff3dd27991d768cc
    substrate:
      workerPoolRef: {name: kagent-default}
      snapshotPolicy: {location: "gs://ate-snapshots/kagent/"} # see agent.yaml
