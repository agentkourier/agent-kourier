# The scenario model and the MCP tool server of the full tier, and kagent's RemoteMCPServer for the tool server: applied
# by deploy_scenario_agents (lib.sh) before the agents of scenarios.yaml, which use them. Test only: no authentication,
# never published.
apiVersion: apps/v1
kind: Deployment
metadata: {name: scenariollm, namespace: kagent}
spec:
  selector: {matchLabels: {app: scenariollm}}
  template:
    metadata: {labels: {app: scenariollm}}
    spec:
      containers:
        - name: scenariollm
          image: python:3.13-alpine@sha256:79e7a9b9ff1cbceff819f856fb374477792a5967759d94df266de7b7b4120e6f
          command: ["python", "/app/scenariollm.py", "8080"]
          ports: [{containerPort: 8080}]
          volumeMounts: [{name: app, mountPath: /app}]
      volumes: [{name: app, configMap: {name: scenariollm}}]
---
apiVersion: v1
kind: Service
metadata: {name: scenariollm, namespace: kagent}
spec: {selector: {app: scenariollm}, ports: [{port: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: scenariomcp, namespace: kagent}
spec:
  selector: {matchLabels: {app: scenariomcp}}
  template:
    metadata: {labels: {app: scenariomcp}}
    spec:
      containers:
        - name: scenariomcp
          image: python:3.13-alpine@sha256:79e7a9b9ff1cbceff819f856fb374477792a5967759d94df266de7b7b4120e6f
          command: ["python", "/app/scenariomcp.py", "8082"]
          ports: [{containerPort: 8082}]
          volumeMounts: [{name: app, mountPath: /app}]
      volumes: [{name: app, configMap: {name: scenariomcp}}]
---
apiVersion: v1
kind: Service
metadata: {name: scenariomcp, namespace: kagent}
spec: {selector: {app: scenariomcp}, ports: [{port: 8082}]}
---
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata: {name: scenariomcp, namespace: kagent}
spec:
  description: One-tool MCP server for the S11 agent
  protocol: STREAMABLE_HTTP
  url: http://scenariomcp.kagent.svc.cluster.local:8082/mcp
