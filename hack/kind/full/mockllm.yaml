# Deterministic OpenAI-compatible model for the full tier. A prompt that none of the first two rules matches (S5's
# mention, the smoke test's) gets the same canned answer from the last rule, so that
# a scenario's prompt need not carry the question. The image is built locally by
# up-full.sh (kagent-dev/mockllm publishes none) and loaded into the kind node.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mockllm
  namespace: kagent
data:
  config.json: |
    {
      "openai": [{
        "name": "two-plus-two",
        "match": {"match_type": "contains", "message": {"role": "user", "content": "What is 2+2?"}},
        "response": {
          "id": "chatcmpl-courier-1", "object": "chat.completion", "created": 1677652288,
          "model": "gpt-4.1-mini",
          "choices": [{"index": 0, "finish_reason": "stop",
                       "message": {"role": "assistant", "content": "The answer is 4."}}],
          "usage": {"prompt_tokens": 10, "completion_tokens": 5, "total_tokens": 15}
        }
      }, {
        "name": "ask-database",
        "match": {"match_type": "contains", "message": {"role": "user", "content": "Which database"}},
        "response": {
          "id": "chatcmpl-courier-2", "object": "chat.completion", "created": 1677652288,
          "model": "gpt-4.1-mini",
          "choices": [{"index": 0, "finish_reason": "tool_calls",
                       "message": {"role": "assistant", "content": null, "tool_calls": [{
                         "id": "call_ask", "type": "function",
                         "function": {"name": "ask_user", "arguments": "{\"questions\": [{\"question\": \"Which database should we use?\", \"choices\": [\"PostgreSQL\", \"MySQL\"]}]}"}}]}}],
          "usage": {"prompt_tokens": 10, "completion_tokens": 5, "total_tokens": 15}
        }
      }, {
        "name": "any-user-message",
        "match": {"match_type": "contains", "message": {"role": "user", "content": ""}},
        "response": {
          "id": "chatcmpl-courier-3", "object": "chat.completion", "created": 1677652288,
          "model": "gpt-4.1-mini",
          "choices": [{"index": 0, "finish_reason": "stop",
                       "message": {"role": "assistant", "content": "The answer is 4."}}],
          "usage": {"prompt_tokens": 10, "completion_tokens": 5, "total_tokens": 15}
        }
      }]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mockllm
  namespace: kagent
spec:
  replicas: 1
  selector:
    matchLabels: {app: mockllm}
  template:
    metadata:
      labels: {app: mockllm}
    spec:
      containers:
        - name: mockllm
          image: courier-e2e/mockllm:v0.1.0
          imagePullPolicy: Never
          args: ["--config", "/etc/mockllm/config.json", "--listen-addr", "0.0.0.0:8080"]
          ports: [{containerPort: 8080}]
          volumeMounts: [{name: config, mountPath: /etc/mockllm}]
      volumes:
        - name: config
          configMap: {name: mockllm}
---
apiVersion: v1
kind: Service
metadata:
  name: mockllm
  namespace: kagent
spec:
  selector: {app: mockllm}
  ports: [{port: 8080, targetPort: 8080}]
