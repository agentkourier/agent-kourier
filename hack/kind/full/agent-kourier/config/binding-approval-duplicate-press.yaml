# S24: the second press must leave the first approval verdict unchanged.
apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata: {name: full-s24, namespace: agent-kourier}
spec:
  agent:
    backendRef: {namespace: agent-kourier, name: agents}
    namespace: kagent
    name: scenario-approval
  identity:
    userId: agent-kourier-full
    tokenSecretRef: {name: agent-kourier-agent-token}
  chat:
    connectionRef: {namespace: agent-kourier, name: slack-fast}
    channel: CS24
    output: live
  interactions:
    toolApprovals: true
