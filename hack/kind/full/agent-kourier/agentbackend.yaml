# The agents of the full tier: kagent, reached only through its verifying front door (frontdoor.yaml, port
# 4180), never the controller on 8083, which does not verify tokens (spec D32, R4); a NetworkPolicy lets only
# a pod labelled as agent-kourier reach the door. The Binding's token is a Dex ID token (the Secret
# agent-kourier-agent-token, refreshed by lib.sh's refresh_dex_token), which the door verifies. The name is the fast
# tier's, so the Binding files are the same in both tiers: up-full.sh builds the tier's config from the fast
# tier's, with this file in place of its AgentBackend. The kagent-v1 dialect adds /agents/<namespace>/<name>.
apiVersion: agentkourier.dev/v1alpha1
kind: AgentBackend
metadata: {name: agents, namespace: agent-kourier}
spec:
  dialect: kagent-v1
  url: http://kagent-frontdoor.kagent.svc.cluster.local:4180
