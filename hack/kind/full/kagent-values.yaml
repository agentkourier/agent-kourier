# TEST ONLY: disposable kind cluster. kagent 1.0.0-alpha5 values for the full E2E tier.
# A pilot install must replace, at least:
#   - controller.auth trusted-proxy: the controller does not verify JWTs, so it needs a
#     verifying front door (frontdoor.yaml) and fenced ports 8083 and 8080 (networkpolicy.yaml)
#   - oauth2-proxy cookie-secure: false, the http:// Dex issuer, and the localhost redirect
#   - providers.openAI apiKey (fake) and config.baseUrl (mockllm) with the real model
# Substrate is installed separately (up-full.sh), as in kagent's own CI, so the chart's
# substrate subchart stays off. up-full.sh passes substrateWorkerPool.workerImage so the
# ateom-gvisor tag always equals SUBSTRATE_VERSION.
kmcp:
  enabled: false
kagent-tools:
  enabled: false
grafana-mcp:
  enabled: false
substrate:
  enabled: false
substrateWorkerPool:
  create: true
  replicas: 1
  sandboxClass: gvisor
providers:
  default: openAI
  openAI:
    provider: OpenAI
    model: gpt-4.1-mini
    apiKey: fake-key-for-mockllm
    apiKeySecretRef: kagent-openai
    apiKeySecretKey: OPENAI_API_KEY
    config:
      baseUrl: http://mockllm.kagent.svc.cluster.local:8080/v1
controller:
  # "OIDC mode" is trusted-proxy: the controller decodes the bearer JWT WITHOUT verifying it,
  # so a verifying proxy must validate every request and NetworkPolicy must fence port 8083.
  auth:
    mode: trusted-proxy
    userIdClaim: email
  substrate:
    enabled: true
    ateApiEndpoint: dns:///api.ate-system.svc:443
    atenetRouterURL: http://atenet-router.ate-system.svc:80
oauth2-proxy:
  enabled: true
  config:
    existingSecret: kagent-oidc # client-id, client-secret, cookie-secret; created by up-full.sh
  extraArgs:
    oidc-issuer-url: http://dex.dex.svc.cluster.local:5556/dex
    redirect-url: http://localhost:4180/oauth2/callback
    upstream: http://kagent-ui:8080
    # No oidc-extra-audience: this UI door takes only the UI's own tokens. The Binding's token
    # (audience agent-kourier-binding) belongs to the front door, which forwards /agents/ alone.
    cookie-secure: false
