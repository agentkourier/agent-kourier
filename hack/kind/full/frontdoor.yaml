# The courier front door: a second oauth2-proxy that verifies the Binding's Dex token (signature
# by the issuer's keys, issuer, audience = courier-binding, expiry) and forwards only /agents/ to
# the kagent controller. Signature and audience are measured by verify.sh; the issuer and expiry
# checks are INFERRED from oauth2-proxy's OIDC verifier and not yet tested (WP-03 tests expiry).
# kagent's own OIDC mode decodes JWTs without verifying them, so courier
# must never reach port 8083 except through this pod (spec D32, R4). A separate instance because
# the chart's oauth2-proxy has one `upstream` (the UI) and its extraArgs map cannot repeat it.
# Chosen over agentgateway because the image and the token logic are already in this cluster.
# Identity-selecting headers: kagent takes the acting user from X-User-Id or ?user_id= whenever
# X-Agent-Name is present, even with a valid token, and honours X-Share-Token on /agents/ (spec
# D32, R4; WP-03). The door strips those headers (alpha config below); verify.sh shows the spoof
# refused and X-Share-Token dropped. It cannot observe every entry (see the doc's WP-01d section).
# TEST ONLY: fake client secret; a pilot install issues its own and terminates TLS in front.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kagent-frontdoor-config
  namespace: kagent
data:
  # Alpha config, generated by the pinned image: `oauth2-proxy --convert-config-to-alpha` with the
  # flags this door used before WP-01d (--http-address, --provider, --oidc-issuer-url,
  # --client-id, --upstream, --pass-authorization-header, --flush-interval, --upstream-timeout).
  # Alpha mode refuses those flags, so they now live here. The output is unedited apart from the
  # secret and the four strip entries. Its Authorization and X-Forwarded-* injections are the
  # flag-derived list made explicit: the alpha `injectRequestHeaders` list REPLACES that list, so
  # dropping the Authorization entry would forward no token to kagent.
  # Flags that are not converted stay on the command line (--email-domain, --skip-jwt-bearer-tokens,
  # --force-json-errors, --cookie-secure, --silence-ping-logging).
  # The converter inlines the client secret; it is read from the Secret's file instead, because a
  # secret must not sit in a ConfigMap.
  alpha.yaml: |
    injectRequestHeaders:
        # Strip-only entries (no values): oauth2-proxy deletes any inbound header whose name matches,
        # case-insensitively and with _ read as - (pkg/middleware/headers.go).
        - name: X-Agent-Name # selects kagent's agent-call path, where the acting user is caller-supplied
        - name: X-User-Id # the acting user on that path; defence in depth while X-Agent-Name is stripped
        - name: X-Share-Token # grants access to another owner's session; courier never uses one
        # Read only by the controller's runtime (TaskStore) RPCs, which /agents/ cannot reach;
        # stripped anyway because it is an unsigned identity claim.
        - name: X-Kagent-Insecure-Runtime-Identity
        - name: X-Forwarded-Groups
          preserveRequestValue: false
          values:
            - claimSource:
                claim: groups
        - name: X-Forwarded-User
          preserveRequestValue: false
          values:
            - claimSource:
                claim: user
        - name: X-Forwarded-Email
          preserveRequestValue: false
          values:
            - claimSource:
                claim: email
        - name: X-Forwarded-Preferred-Username
          preserveRequestValue: false
          values:
            - claimSource:
                claim: preferred_username
        - name: Authorization
          preserveRequestValue: false
          values:
            - claimSource:
                claim: id_token
                prefix: 'Bearer '
    metricsServer: {}
    providers:
        - clientID: courier-binding # the only accepted audience: no --oidc-extra-audience
          clientSecretFile: /etc/oauth2-proxy-secret/client-secret
          azureConfig:
            tenant: common
          microsoftEntraIDConfig:
            federatedTokenAuth: false
          ADFSConfig:
            skipScope: false
          googleConfig:
            useApplicationDefaultCredentials: false
            useOrganizationID: false
          oidcConfig:
            issuerURL: http://dex.dex.svc.cluster.local:5556/dex
            insecureAllowUnverifiedEmail: false
            insecureSkipIssuerVerification: false
            insecureSkipNonce: true
            skipDiscovery: false
            emailClaim: email
            groupsClaim: groups
            userIDClaim: email
            audienceClaims:
                - aud
          id: oidc=courier-binding
          provider: oidc
          useSystemTrustStore: false
          loginURLParameters:
            - name: approval_prompt
              default:
                - force
          skipClaimsFromProfileURL: false
          backendLogoutURL: ""
    server:
        bindAddress: 0.0.0.0:4180
    upstreamConfig:
        proxyRawPath: false
        upstreams:
            # /agents/ is the whole A2A surface (send, stream, card); /api, /mcp and the rest are 404 here.
            - id: /agents/
              path: /agents/
              uri: http://kagent-controller.kagent.svc.cluster.local:8083/agents/
              insecureSkipTLSVerify: false
              static: false
              flushInterval: 100ms
              passHostHeader: true
              proxyWebSockets: true
              timeout: 10m0s
              disableKeepAlives: false
---
apiVersion: v1
kind: Service
metadata:
  name: kagent-frontdoor
  namespace: kagent
spec:
  selector: {app.kubernetes.io/name: kagent-frontdoor}
  ports: [{port: 4180, targetPort: 4180}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kagent-frontdoor
  namespace: kagent
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kagent-frontdoor}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kagent-frontdoor}
    spec:
      containers:
        - name: oauth2-proxy
          # Index digest of v7.15.3, the version the kagent chart ships.
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3@sha256:10a1165743a192e1940b4708fb9647027185ce11a681a1c5519b442ff7f1f561
          args:
            - --alpha-config=/etc/oauth2-proxy/alpha.yaml # provider, upstream, listener and headers: see the ConfigMap
            - --email-domain=*
            # Bearer JWTs only. A request without a verified one gets a JSON 401, not a login redirect.
            - --skip-jwt-bearer-tokens=true
            - --force-json-errors=true
            - --cookie-secure=false
            - --silence-ping-logging=true
          env:
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: {secretKeyRef: {name: kagent-frontdoor, key: cookie-secret}}
          ports: [{containerPort: 4180}]
          volumeMounts:
            - {name: config, mountPath: /etc/oauth2-proxy, readOnly: true}
            - {name: secret, mountPath: /etc/oauth2-proxy-secret, readOnly: true}
          readinessProbe:
            httpGet: {path: /ping, port: 4180}
            periodSeconds: 3
      volumes:
        - name: config
          configMap: {name: kagent-frontdoor-config}
        - name: secret
          secret:
            secretName: kagent-frontdoor
            items: [{key: client-secret, path: client-secret}]
