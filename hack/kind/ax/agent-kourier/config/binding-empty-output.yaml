apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata: {name: fast-s12, namespace: agent-kourier}
spec:
  agent:
    backendRef: {namespace: agent-kourier, name: ax-fails}
    namespace: agent-kourier-ax
    name: fails
  identity:
    userId: agent-kourier-ax
    tokenSecretRef: {name: agent-kourier-agent-token}
  chat:
    connectionRef: {namespace: agent-kourier, name: slack-fast}
    channel: CS12
    output: live
  interactions: {askUser: true}
