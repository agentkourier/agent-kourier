apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata: {name: fast-s4, namespace: agent-kourier}
spec:
  agent:
    backendRef: {namespace: agent-kourier, name: ax-gated}
    namespace: agent-kourier-ax
    name: gated
  identity:
    userId: agent-kourier-ax
    tokenSecretRef: {name: agent-kourier-agent-token}
  chat:
    connectionRef: {namespace: agent-kourier, name: slack-fast}
    channel: CS4
    output: live
  interactions: {askUser: true, toolApprovals: false}
