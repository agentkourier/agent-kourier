apiVersion: agentcourier.dev/v1alpha1
kind: Binding
metadata: {name: fast-timeout, namespace: courier}
spec:
  agent:
    backendRef: {namespace: courier, name: ax-ask}
    namespace: courier-ax
    name: ask
  identity:
    userId: courier-ax
    tokenSecretRef: {name: courier-agent-token}
  chat:
    connectionRef: {namespace: courier, name: slack-fast}
    channel: CAXTIMEOUT
    output: live
  interactions: {timeout: 5s, askUser: true, toolApprovals: false}
