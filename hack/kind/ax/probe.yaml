# Authenticate every fixture through the router before timing conversation scenarios.
apiVersion: v1
kind: Pod
metadata:
  name: '@NAME@'
  namespace: agent-kourier
  labels: {app.kubernetes.io/name: agent-kourier}
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 300
  containers:
    - name: probe
      image: '@CURL_IMAGE@' # lib.sh's CURL_IMAGE, which Renovate keeps current
      command: [sh, -c]
      args:
        - |
          token=$(cat /run/identity/token)
          for actor in default gated memory ask fails; do
            ok=
            for attempt in 1 2 3 4 5 6; do
              status=$(printf 'header = "Authorization: Bearer %s"\n' "$token" |
                curl --config - -s -m 20 -o /dev/null -w '%{http_code}' \
                  -H "ate-target-actor: agent-kourier-ax/$actor" \
                  http://atenet-router.ate-system.svc.cluster.local/a2a/.well-known/agent-card.json) || status=000
              if [ "$status" = 200 ]; then ok=yes; break; fi
              sleep 2
            done
            [ "$ok" = yes ] || { echo "AX authenticated card failed: $actor (HTTP $status)" >&2; exit 1; }
          done
      volumeMounts: [{name: identity, mountPath: /run/identity, readOnly: true}]
  volumes: [{name: identity, secret: {secretName: agent-kourier-agent-token}}]
