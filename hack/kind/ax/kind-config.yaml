# kind config for the AX E2E tier. Adapted from kagent's scripts/kind/kind-config.yaml
# (feature gates that Substrate's pod identity needs) and Substrate's create-kind-cluster.sh.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: agent-kourier-ax
networking:
  apiServerAddress: "127.0.0.1"
featureGates:
  ClusterTrustBundle: true
  ClusterTrustBundleProjection: true
  PodCertificateRequest: true
runtimeConfig:
  "certificates.k8s.io/v1beta1": "true"
nodes:
  - role: control-plane
    labels:
      agentkourier.agent-kourier.dev/owner: up-ax
