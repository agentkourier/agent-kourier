# These unauthenticated controls stay inside the isolated kind cluster.
apiVersion: v1
kind: ServiceAccount
metadata: {name: ax-gates, namespace: e2e}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ax-gates
  namespace: e2e
  labels:
    app.kubernetes.io/name: ax-gates
    app.kubernetes.io/part-of: ax
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: ax-gates
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ax-gates
        app: ax-gates
    spec:
      serviceAccountName: ax-gates
      containers:
        - name: ax-gates
          image: agent-kourier-e2e/ax:dev
          command: ["/usr/local/bin/e2e-control"]
          imagePullPolicy: Never
          env:
            - name: AX_FIXTURE_IMAGE
              valueFrom: {configMapKeyRef: {name: ax-fixtures, key: image}}
            - name: OIDC_SUBJECT
              valueFrom: {configMapKeyRef: {name: ax-fixtures, key: subject}}
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          startupProbe:
            httpGet: {path: /readyz, port: 8080}
            periodSeconds: 5
            failureThreshold: 108
          livenessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - mountPath: /var/run/secrets/ateapi
              name: ate-token
              readOnly: true
            - mountPath: /run/servicedns-ca
              name: servicedns-ca
              readOnly: true
      volumes:
        - name: ate-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  audience: api.ate-system.svc
                  expirationSeconds: 7200
                  path: token
        - name: servicedns-ca
          projected:
            defaultMode: 420
            sources:
              - clusterTrustBundle:
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
                  signerName: servicedns.podcert.ate.dev/identity
---
apiVersion: v1
kind: Service
metadata: {name: ax-gates, namespace: e2e}
spec:
  selector: {app.kubernetes.io/name: ax-gates}
  ports: [{port: 8080, targetPort: 8080}]
