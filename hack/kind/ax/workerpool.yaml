apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: agent-kourier-ax
  namespace: agent-kourier-ax
spec:
  replicas: 1
  sandboxClass: gvisor
  workerImage: ghcr.io/kagent-dev/substrate/ateom-gvisor:v0.3.0-alpha1
