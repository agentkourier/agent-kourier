# The fast tier's web ChatConnections (hack/kind/fast/web, on custom resources): an overlay on crds-values.yaml that up-fast.sh gives lib.sh's
# deploy_agentkourier for the route upgrade of crds (AGENTKOURIER_CRDS_ARGS), unless the tier serves two Slack apps, whose admission list
# (two-apps-values.yaml) the MC_ tests hold to its three namespaces. It admits the namespace e2e-web, which holds a kourier-v1 connection, beside
# the broker's own, and turns on the chat listener, which every web connection needs: its Service agent-kourier-chat (port 8081) selects the pod that
# carries the leader label, and the fake sender (test/fakeweb) posts to it. In HTTP mode http-values.yaml turns the listener on too, with the same values.
# chatFrom admits the fake sender's pods to the chat port, and the fake Slack's, when the chart's NetworkPolicy is on; the tiers' values leave it off.
config:
  connectionNamespaces: [e2e-web]
chatListener:
  enabled: true
  port: 8081
  service: {port: 8081}
networkPolicy:
  chatFrom:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: e2e}}
      podSelector: {matchLabels: {app: fakeslack}}
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: e2e}}
      podSelector: {matchLabels: {app: fakeweb}}
