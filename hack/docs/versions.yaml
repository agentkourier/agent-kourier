# The release lines the documentation site publishes, newest first (`make docs-site`, hack/docs/sitebuild).
#
# Each line is built from its newest final tag (vX.Y.Z, no prerelease suffix) into its own directory, as
# agentkourier.dev/0.1/. The first line that has a tag is "latest", where the site's root leads. A line with no tag yet
# is skipped, so the release pull request of a new minor version adds its line here before the tag exists. main is
# always published too, as dev. Remove a line to stop publishing it.
releases:
  - "0.1"
