# A fixture of charts/agent-kourier/values.yaml for hack/release/test.sh (CHART_DIR): the two image blocks that
# package-chart.sh stamps, shaped as the chart has them, and look-alike keys elsewhere that it must leave alone.
replicaCount: 1

image:
  # Required. A released chart has it stamped.
  repository: ""
  tag: ""
  # Pin production to a digest (sha256:...), which wins over tag.
  digest: ""
  pullPolicy: IfNotPresent

tokenRefresh:
  image:
    repository: curlimages/curl
    digest: ""

addons:
  other:
    image:
      repository: ghcr.io/example/other
      digest: ""
  cma:
    enabled: false
    # The add-on's image.
    image:
      repository: ghcr.io/agentkourier/agent-kourier-cma
      # A tag, which defaults to the chart's appVersion. Ignored when digest is set.
      tag: ""
      # Pin production to a digest (sha256:...), which wins over tag.
      digest: ""
      pullPolicy: IfNotPresent
    sidecar:
      image:
        repository: ghcr.io/example/sidecar
        digest: ""
    store: sqlite
