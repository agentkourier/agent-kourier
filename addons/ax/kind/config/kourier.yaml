# Agent Kourier's config for the AX add-on test: one Slack app (Secret slack: botToken, appToken), the add-on that the
# chart runs beside Agent Kourier as an a2a backend, and two Bindings. Replace C0123456789 with the chat channel's ID,
# C0ALERTS000 with the alert channel's ID and B0ALERTS00 with the bot ID of the app that posts the alerts there (the
# message's bot_id) before making the ConfigMap.
apiVersion: agentkourier.dev/v1alpha1
kind: ChatConnection
metadata: {name: slack, namespace: agent-kourier}
spec:
  platform: slack
  credentialsSecretRef: {name: slack}
---
# The add-on's Service, which the chart names <release>-ax.
apiVersion: agentkourier.dev/v1alpha1
kind: AgentBackend
metadata: {name: ax, namespace: agent-kourier}
spec:
  dialect: a2a
  url: http://agent-kourier-ax.agent-kourier.svc:8090/a2a
---
# A mention of the bot starts a thread and an ADK session; replies in the thread continue it. A question the agent asks
# with ask_user is answered by a reply in the thread.
apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata: {name: ax-chat, namespace: agent-kourier}
spec:
  agent:
    backendRef: {name: ax}
    name: ax-assistant # a label on the a2a dialect: the backend URL selects the agent
    namespace: agent-kourier
  # The add-on's caller check: the Secret is the one addons.ax.auth.tokenSecret names, sent as Authorization: Bearer.
  identity: {tokenSecretRef: {name: ax-adapter-token}}
  chat:
    connectionRef: {name: slack}
    channel: C0123456789 # the chat channel's ID
    triggers:
      - type: mention
    output: live
  interactions: {askUser: true}
---
# An Alertmanager-style alert posted to the alert channel starts an investigation in its thread, one thread per alert.
# The prompt has the agent ask one question with ask_user before it answers, so the thread exercises a paused turn.
apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata: {name: ax-alerts, namespace: agent-kourier}
spec:
  agent:
    backendRef: {name: ax}
    name: ax-assistant
    namespace: agent-kourier
  identity: {tokenSecretRef: {name: ax-adapter-token}}
  chat:
    connectionRef: {name: slack}
    channel: C0ALERTS000 # the alert channel's ID
    output: live
    triggers:
      - type: botMessage
        from: {id: B0ALERTS00} # the bot ID of the app that posts the alerts
        match:
          title: '^(?:\[[^\]]{1,32}\] )?(?:FIRING \(\d+\)|RESOLVED) - '
        extract:
          state:
            field: title
            regex: '^(?:\[[^\]]{1,32}\] )?(?P<state>FIRING|RESOLVED)'
          key:
            field: fallback
            regex: '^\[[A-Z]+(?::\d+)?\] (?P<key>[^(|]*[^(|\s])'
          alertname:
            field: title
            regex: '^(?:\[[^\]]{1,32}\] )?(?:FIRING \(\d+\)|RESOLVED) - (?P<alertname>.+)$'
        thread:
          by: key
          cooldown: 1h
          closeWhen: {state: RESOLVED}
        limits:
          rateLimit: {maxRuns: 5, per: 10m, maxConcurrent: 2}
          maxRunsPerDay: 20
        promptTemplate: |
          An alert is {{ .State }} in channel {{ .Channel }}: {{ .Fields.alertname }}.
          Before you answer, ask the on-call person one short question with the ask_user tool: whether anything was
          deployed or changed recently. Then report the likely causes and the next steps, in under 120 words.
  interactions: {askUser: true}
