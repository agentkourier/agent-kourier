# Agent Kourier in the cma kind cluster for the CMA adapter test: the production image (make image, kind load), the
# ConfigMap route with config/kourier.yaml, Secrets in the release's namespace.
image:
  repository: agent-kourier
  tag: dev
  pullPolicy: Never
crds:
  install: false
config:
  source: files
  existingConfigMap: cma-kourier-config
rbac:
  secretNamespaces: [agent-kourier]
persistence:
  storageClassName: standard
  retainOnUninstall: false
