version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose     # unclosed HTTP response bodies (Slack, Alertmanager, A2A clients)
    - contextcheck  # context.Context must be propagated, not dropped
    - depguard      # test fakes must not leak into production code
    - errcheck
    - errorlint     # enforce %w and errors.Is/As over ==/type assertions
    - forbidigo     # text reaches the wire only through chat.Platform or slack.Render, so render.Text and render.Markdown stay out of new code
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - noctx          # HTTP requests must carry a context
    - nolintlint    # a bare //nolint cannot silently bypass this config
    - revive        # default rule set (exported comments, receiver-naming, ...)
    - rowserrcheck  # sql.Rows.Err must be checked (SQLite store)
    - sqlclosecheck # sql.Rows and Stmt must be closed (SQLite store)
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        test-code-is-test-only:
          files: ["$all", "!$test", "!**/test/**"]
          deny:
            - pkg: github.com/agentkourier/agent-kourier/test/
              desc: packages under test/ (fakes, stubs, e2e helpers) are for tests; import them only from _test.go files and under test/
        render-is-platform-neutral:
          files: ["**/internal/render/**", "!$test"]
          deny:
            - pkg: github.com/agentkourier/agent-kourier/internal/chat/slack
              desc: render builds neutral messages and never names a platform; text reaches the wire only through chat.Platform (or slack.Render, for the outbox until it stores the neutral payload), so literal render output cannot be put straight into a Slack Content
            - pkg: github.com/slack-go/slack
              desc: render builds neutral messages and never names a platform; text reaches the wire only through chat.Platform
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^render\.(Text|Markdown)$
          pkg: ^github\.com/agentkourier/agent-kourier/internal/render$
          msg: render.Text and render.Markdown are Slack-flavoured escaping, kept for the interaction prompts until they are ported (WP-37 S4); a message is built with Turn, Notice or Nothing and left literal, for the platform to make inert
    nolintlint:
      require-explanation: true
      require-specific: true
    govet:
      enable-all: true
      disable:
        - fieldalignment  # memory layout micro-optimisation; hurts struct readability
        - shadow          # noisy on the idiomatic `if err := ...` pattern
  exclusions:
    rules:
      - path: ^internal/render/[^/]+\.go$
        linters:
          - forbidigo  # the builders live here, and call them
      - path: _test\.go
        linters:
          - gosec  # test fixtures use fake credentials and loose file modes

formatters:
  enable:
    - gofmt
    - goimports
