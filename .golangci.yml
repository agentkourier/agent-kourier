version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose     # unclosed HTTP response bodies (Slack, Alertmanager, A2A clients)
    - contextcheck  # context.Context must be propagated, not dropped
    - depguard      # test fakes must not leak into production code
    - errcheck
    - errorlint     # enforce %w and errors.Is/As over ==/type assertions
    - forbidigo     # test-only functions (the add-ons' SetFenceForTest) stay out of production code
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - noctx          # HTTP requests must carry a context
    - nolintlint    # a bare //nolint cannot silently bypass this config
    - revive        # default rule set (exported comments, receiver-naming, ...)
    - rowserrcheck  # sql.Rows.Err must be checked (SQLite store)
    - sqlclosecheck # sql.Rows and Stmt must be closed (SQLite store)
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        test-code-is-test-only:
          files: ["$all", "!$test", "!**/test/**"]
          deny:
            - pkg: github.com/agentkourier/agent-kourier/test/
              desc: packages under test/ (fakes, stubs, e2e helpers) are for tests; import them only from _test.go files and under test/
        test-support-is-test-only:
          files: ["$all", "!$test", "!**/test/**", "!**/internal/testutil/**", "!**/internal/store/sqlite/sqlitetest/**", "!**/internal/config/sourcetest/**", "!**/addons/kit/store/sqlitetest/**", "!**/addons/kit/store/storetest/**", "!**/addons/kit/kittest/**"]
          deny:
            - pkg: github.com/agentkourier/agent-kourier/internal/testutil
              desc: internal/testutil is test support and imports testing; import it only from _test.go files, other test support and under test/
            - pkg: github.com/agentkourier/agent-kourier/internal/store/sqlite/sqlitetest
              desc: sqlitetest is test support and imports testing; import it only from _test.go files, other test support and under test/
            - pkg: github.com/agentkourier/agent-kourier/addons/kit/store/sqlitetest
              desc: the kit's sqlitetest is test support and imports testing; import it only from _test.go files and other test support
            - pkg: github.com/agentkourier/agent-kourier/addons/kit/store/pgtest
              desc: the kit's pgtest is test support and imports testing; import it only from _test.go files and other test support
            - pkg: github.com/agentkourier/agent-kourier/addons/kit/store/storetest
              desc: the kit's storetest is test support and imports testing; import it only from _test.go files and other test support
            - pkg: github.com/agentkourier/agent-kourier/addons/kit/kittest
              desc: the kit's kittest (and its echo add-on) is test support and imports testing; import it only from _test.go files and other test support
        slack-only-in-adapter:
          files: ["$all", "!$test", "!**/internal/chat/slack/**", "!**/internal/broker/**", "!**/cmd/**", "!**/test/**"]
          deny:
            - pkg: github.com/agentkourier/agent-kourier/internal/chat/slack
              desc: "every package but the adapter, the broker and cmd is platform-neutral (spec 13): it speaks chat.Platform and the neutral model, and the adapter is named only by the broker, which chooses it"
            - pkg: github.com/slack-go/slack
              desc: "every package but the adapter, the broker and cmd is platform-neutral (spec 13): slack-go belongs to the Slack adapter"
        chat-is-the-model-alone:
          files: ["**/internal/chat/*.go", "**/internal/chat/chattest/**", "!$test"]
          deny:
            - pkg: github.com/agentkourier/agent-kourier/internal/session
              desc: "package chat is the chat-neutral model and the Platform contract, and chattest tests it: what feeds the session manager is the intake's, in internal/trigger"
            - pkg: github.com/agentkourier/agent-kourier/internal/config
              desc: "package chat is the chat-neutral model and the Platform contract, and chattest tests it: what reads the routing table is the intake's, in internal/trigger"
            - pkg: github.com/agentkourier/agent-kourier/internal/store
              desc: "package chat is the chat-neutral model and the Platform contract, and chattest tests it: what keeps trigger threads and limits is the intake's, in internal/trigger"
            - pkg: github.com/agentkourier/agent-kourier/internal/telemetry
              desc: "package chat is the chat-neutral model and the Platform contract, and chattest tests it: what counts and traces the intake is the intake's, in internal/trigger"
        webhook-is-a-platform-alone:
          files: ["**/internal/chat/webhook/**", "!$test"]
          deny:
            - pkg: github.com/agentkourier/agent-kourier/internal/session
              desc: "the webhook platform speaks chat.Platform and hands events to a chat.Sink: what feeds the session manager is the intake's, in internal/trigger"
            - pkg: github.com/agentkourier/agent-kourier/internal/config
              desc: "the webhook platform is given its Config by the broker, which maps the ChatConnection onto it: it reads no config"
            - pkg: github.com/agentkourier/agent-kourier/internal/store
              desc: "the webhook platform keeps nothing: a repeat is dropped by the intake, by the event's ID"
            - pkg: github.com/agentkourier/agent-kourier/api/v1alpha1
              desc: "the webhook platform is built from its own Go Config, which the broker maps the ChatConnection onto: it reads no API type"
            - pkg: github.com/agentkourier/agent-kourier/internal/telemetry
              desc: "the webhook platform counts through the Recorder of its Config, which the broker builds: it does not reach the broker's instruments itself"
    forbidigo:
      forbid:
        - pattern: ^(\w+\.)?SetFenceForTest$
          msg: "SetFenceForTest replaces a store's fence (on Postgres, the lease's epoch check); only tests and the kit's sqlitetest and storetest call it"
    nolintlint:
      require-explanation: true
      require-specific: true
    govet:
      enable-all: true
      disable:
        - fieldalignment  # memory layout micro-optimisation; hurts struct readability
        - shadow          # noisy on the idiomatic `if err := ...` pattern
    staticcheck:
      # golangci-lint's default set, less S1005: errcheck (since v1.30) reports a dropped error received from a
      # channel, and `_ = <-done` is how a drain says it means to drop it, which S1005 would remove again.
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-S1005"]
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec  # test fixtures use fake credentials and loose file modes
      - path: _test\.go|(^|/)addons/kit/store/(sqlitetest|storetest)/
        linters:
          - forbidigo  # tests, and the kit's conformance suites, may replace a store's fence

formatters:
  enable:
    - gofmt
    - goimports
