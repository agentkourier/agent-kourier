# nginx HTTP server fragment. Terminate TLS on the surrounding ingress/listener.
# The actor verifies the Bearer token's signature, issuer, audience, expiry and pinned subject.
server {
    listen 8080;
    location = /a2a {
        proxy_pass http://atenet-router.ate-system.svc.cluster.local;
        proxy_set_header ate-target-actor "agent-kourier-ax/assistant";
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
    location = /a2a/.well-known/agent-card.json {
        proxy_pass http://atenet-router.ate-system.svc.cluster.local;
        proxy_set_header ate-target-actor "agent-kourier-ax/assistant";
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 600s;
    }
    location / { return 404; }
}
