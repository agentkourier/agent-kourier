display_information:
  name: CMA Assist
  description: A Claude Managed Agents agent in Slack threads, through Agent Kourier and the CMA A2A adapter.
features:
  bot_user:
    display_name: CMA Assist
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - assistant:write
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - chat:write
      - reactions:write
      - usergroups:read
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
