# The A2A server that hosts the docs agent. On the a2a dialect the url is the exact JSON-RPC endpoint, used as
# written, and the agent card is served at that url plus /.well-known/agent-card.json. This is the Service that
# agent/manifests/ creates; replace it if you put the agent somewhere else.
apiVersion: agentkourier.dev/v1alpha1
kind: AgentBackend
metadata: {name: docs-agents, namespace: agent-kourier}
spec:
  dialect: a2a
  url: http://docs-agent.docs-agent.svc.cluster.local:8080/a2a
