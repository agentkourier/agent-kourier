name: Microsoft Teams (http mode, experimental)
app: agent-kourier-docs
question: Can Agent Kourier post to Microsoft Teams?
cause: 'Yes, in http mode, and experimentally. A broker with a chat listener runs a ChatConnection with platform teams: it takes a person''s posts in a team''s channel on the chat listener, and replies and edits through the Bot Connector. Socket mode is not supported yet, and there are no streams, reactions, answerable questions, tool approvals or alert triggers on Teams yet.'
evidence:
  - reference/platforms.md
