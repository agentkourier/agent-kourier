name: Microsoft Teams (not served yet)
app: agent-kourier-docs
question: Can Agent Kourier post to Microsoft Teams?
cause: 'Not yet. The API takes a ChatConnection with platform teams and checks its Bindings against Microsoft Teams, but there is no Microsoft Teams adapter, so no broker runs one: as the broker''s own connection it stops the start, and a team''s is not started. Slack is the platform a broker runs.'
