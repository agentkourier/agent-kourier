name: Microsoft Teams (experimental, http or socket mode)
app: agent-kourier-docs
question: Can Agent Kourier post to Microsoft Teams?
cause: 'Yes, experimentally, and only in a release later than 0.5.0. A ChatConnection with platform teams names a bot registered in one Microsoft Entra tenant, whose Teams app is installed in the team with the resource-specific permission ChannelMessage.Read.Group. It runs in http mode, where Teams sends activities to the leader''s chat listener over public HTTPS, or in socket mode, a Microsoft preview with no public endpoint, where what Teams sends while no socket is ready is lost as an activity. Mentions and posts in a channel start sessions; a live reply is one edited message; questions, tool approvals and feedback are Adaptive Cards that a member of the team presses. Alerts and other apps'' posts, such as an Alertmanager card posted through a Workflows webhook, come through Microsoft Graph, by notifications at spec.teams.notificationURL or by polling, and a botMessage trigger reads the card''s text as body. approverGroups is refused, and there is no acknowledgment reaction and no dry run on Teams.'
evidence:
  - how-to/configure-teams.md
  - reference/platforms.md
