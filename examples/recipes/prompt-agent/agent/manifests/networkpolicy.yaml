# Only Agent Kourier's namespace may reach the agent, on 8080. Egress is left open: the agent calls a model provider and
# the MCP servers agent.yaml names, and which addresses those are is yours to say (add an Egress rule and list
# policyTypes: [Ingress, Egress] to close it, and allow DNS). The policy takes effect only if the cluster's network
# plugin enforces NetworkPolicy; without that, anything in the cluster can call the agent. If Agent Kourier runs in
# another namespace, change the namespace name below. Like the other files here, it names no namespace of its own: apply
# it with them (kubectl apply -n prompt-agent -f manifests/).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prompt-agent
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: prompt-agent}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: agent-kourier}
      ports:
        - {protocol: TCP, port: 8080}
