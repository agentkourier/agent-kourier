# What the sre-triage Binding makes of the messages of an alert channel, one message at a time. `go test ./test/recipes`
# runs it. The bot IDs are placeholders, as in kourier/binding.yaml: if you change that one, change the `bot` of the cases
# that use it. Cooldown, the thread per alert, the close on RESOLVED and the limits are not evaluated here.
#
# The messages have the shape of an Alertmanager Slack receiver whose title reads
# '{{ .Status | toUpper }}{{ if eq .Status "firing" }} ({{ .Alerts.Firing | len }}){{ end }} - {{ .CommonLabels.alertname }}',
# grouped by alertname and namespace, with Alertmanager's default fallback.
# --8<-- [start:first-cases]
cases:
  - name: a firing alert
    binding: agent-kourier/sre-triage
    message:
      bot: B0REPLACEME
      title: 'FIRING (1) - KubePodCrashLooping'
      link: 'https://alertmanager.example.com/#/alerts?receiver=slack-critical'
      fallback: '[FIRING:1] KubePodCrashLooping shop (checkout-7d9f8b6c5-x2x4k critical) | https://alertmanager.example.com/#/alerts?receiver=slack-critical'
    expect:
      outcome: matched
      trigger: 0
      fields: { state: FIRING, alertname: KubePodCrashLooping, key: KubePodCrashLooping shop }

  - name: a firing alert behind a cluster tag
    binding: agent-kourier/sre-triage
    message:
      bot: B0REPLACEME
      title: '[prod] FIRING (1) - KubeContainerOOMKilled'
      link: 'https://alertmanager.example.com/#/alerts?receiver=slack-critical'
      fallback: '[FIRING:1] KubeContainerOOMKilled shop (recommender-5c6d7f8b9-q7w2e critical) | https://alertmanager.example.com/#/alerts?receiver=slack-critical'
    expect:
      outcome: matched
      trigger: 0
      fields: { state: FIRING, alertname: KubeContainerOOMKilled, key: KubeContainerOOMKilled shop }

# --8<-- [end:first-cases]

  - name: a resolved alert
    binding: agent-kourier/sre-triage
    message:
      bot: B0REPLACEME
      title: 'RESOLVED - KubePodCrashLooping'
      link: 'https://alertmanager.example.com/#/alerts?receiver=slack-critical'
      fallback: '[RESOLVED] KubePodCrashLooping shop (checkout-7d9f8b6c5-x2x4k critical) | https://alertmanager.example.com/#/alerts?receiver=slack-critical'
    expect:
      outcome: matched
      trigger: 0
      fields: { state: RESOLVED, alertname: KubePodCrashLooping, key: KubePodCrashLooping shop }

  - name: three alerts grouped in one message
    binding: agent-kourier/sre-triage
    message:
      bot: B0REPLACEME
      title: 'FIRING (3) - KubePodNotReady'
      link: 'https://alertmanager.example.com/#/alerts?receiver=slack-critical'
      fallback: '[FIRING:3] KubePodNotReady shop (critical) | https://alertmanager.example.com/#/alerts?receiver=slack-critical'
    expect:
      outcome: matched
      trigger: 0
      fields: { state: FIRING, alertname: KubePodNotReady, key: KubePodNotReady shop }

  - name: the Watchdog heartbeat on the same receiver is excluded
    binding: agent-kourier/sre-triage
    message:
      bot: B0REPLACEME
      title: 'FIRING (1) - Watchdog'
      link: 'https://alertmanager.example.com/#/alerts?receiver=slack-critical'
      fallback: '[FIRING:1] Watchdog  (none prometheus) | https://alertmanager.example.com/#/alerts?receiver=slack-critical'
    expect: { outcome: excluded }

  - name: another receiver's alert is not taken
    binding: agent-kourier/sre-triage
    message:
      bot: B0REPLACEME
      title: 'FIRING (1) - KubeAPIErrorBudgetBurn'
      link: 'https://alertmanager.example.com/#/alerts?receiver=slack-heartbeat'
      fallback: '[FIRING:1] KubeAPIErrorBudgetBurn kube-system (critical) | https://alertmanager.example.com/#/alerts?receiver=slack-heartbeat'
    expect: { outcome: unmatched }

  - name: a receiver whose name only starts with ours is not taken
    binding: agent-kourier/sre-triage
    message:
      bot: B0REPLACEME
      title: 'FIRING (1) - KubePodCrashLooping'
      link: 'https://alertmanager.example.com/#/alerts?receiver=slack-critical-eu'
      fallback: '[FIRING:1] KubePodCrashLooping shop (checkout-7d9f8b6c5-x2x4k critical) | https://alertmanager.example.com/#/alerts?receiver=slack-critical-eu'
    expect: { outcome: unmatched }

  - name: a message in Grafana's format is not taken
    binding: agent-kourier/sre-triage
    message:
      bot: B0REPLACEME
      title: 'FIRING: HighRequestLatency (payments)'
      link: 'https://alertmanager.example.com/#/alerts?receiver=slack-critical'
      fallback: 'FIRING: HighRequestLatency (payments)'
    expect: { outcome: unmatched }

  - name: another bot's post is dropped
    binding: agent-kourier/sre-triage
    message:
      bot: B0SOMEOTHER
      title: 'FIRING (1) - KubePodCrashLooping'
      link: 'https://alertmanager.example.com/#/alerts?receiver=slack-critical'
      fallback: '[FIRING:1] KubePodCrashLooping shop (checkout-7d9f8b6c5-x2x4k critical) | https://alertmanager.example.com/#/alerts?receiver=slack-critical'
    expect: { outcome: other_bot }

  - name: a person's message starts nothing
    binding: agent-kourier/sre-triage
    message: { user: U0PERSON, text: 'can someone look at the checkout pod?' }
    expect: { outcome: person }

  - name: the alert bot's reply inside an alert thread is ignored
    binding: agent-kourier/sre-triage
    message:
      bot: B0REPLACEME
      inThread: true
      title: 'FIRING (1) - KubePodCrashLooping'
      link: 'https://alertmanager.example.com/#/alerts?receiver=slack-critical'
      fallback: '[FIRING:1] KubePodCrashLooping shop (checkout-7d9f8b6c5-x2x4k critical) | https://alertmanager.example.com/#/alerts?receiver=slack-critical'
    expect: { outcome: ignored }
