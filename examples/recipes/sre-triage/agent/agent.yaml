# sandbox-sre: the read-only SRE agent of the sre-triage recipe. It is a kagent 1.0 Agent that runs on an Agent Substrate
# worker pool, and it uses the tool server declared below (its values are in tools-values.yaml, its RBAC in
# tools-rbac.yaml).
#
# Read-only, three ways: the agent lists its six read tools by name, the tool server runs --read-only, and the server's
# ServiceAccount is bound to the built-in view ClusterRole. A write tool added to the list below would not be served.
#
# You supply the model: a kagent ModelConfig named sandbox-model in namespace kagent, and the Secret it names. No key is
# in this file. The worker pool (kagent-default) and the snapshot location under harness.substrate are the kind full
# tier's; change both for another Substrate install. The harness is the digest-pinned Go ADK runtime that ships with
# kagent 1.0.0-alpha5.
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata: {name: sandbox-tools, namespace: kagent}
spec:
  description: kagent's Kubernetes tools, read-only (the ServiceAccount is bound to the view ClusterRole)
  protocol: STREAMABLE_HTTP
  url: http://sandbox-tools.kagent.svc.cluster.local:8084/mcp
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata: {name: sandbox-sre, namespace: kagent}
spec:
  template:
    modelConfig: {name: sandbox-model}
    description: A read-only SRE assistant that investigates what is wrong in the kind cluster and explains it
    systemPromptFrom:
      name: sandbox-sre-prompt
      key: systemPrompt
    tools:
      - mcp:
          server: {kind: RemoteMCPServer, name: sandbox-tools}
          tools:
            - k8s_get_resources
            - k8s_describe_resource
            - k8s_get_pod_logs
            - k8s_get_events
            - k8s_get_resource_yaml
            - k8s_get_available_api_resources
  harness:
    kagent: {}
    workload:
      image: ghcr.io/kagent-dev/kagent/golang-adk@sha256:ed668c38a5805723912497d4ea085e711cf585d440907abfff3dd27991d768cc
    substrate:
      workerPoolRef: {name: kagent-default}
      snapshotPolicy: {location: "gs://ate-snapshots/kagent/"} # the kind full tier's snapshot location
