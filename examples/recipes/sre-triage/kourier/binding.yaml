# sre-triage: an alert that Alertmanager posts to a Slack channel starts an investigation by the read-only agent
# sandbox-sre, in that alert's thread. Replace CREPLACEME with the channel's ID (C..., or G... for a private one) and
# B0REPLACEME with the bot ID of the Slack integration that posts the alerts; the bot ID is the message's bot_id, not the
# app ID (A...) and not a display name.
#
# The trigger is the alertmanager preset, narrowed to one Alertmanager receiver. The preset supplies the thread per
# alert group, the 4h cooldown, the close on RESOLVED, the limits and the first prompt. The titleLink match names the
# receiver, and the $ anchors it so that receiver=slack-critical does not also take receiver=slack-critical-eu. The
# exclude turns away the Watchdog heartbeat if your Alertmanager routes it to the same receiver.
# triggers is the whole list and holds no mention trigger: a mention in the channel starts nothing. A reply in an alert's
# thread continues that thread's session (chat.threadReplies defaults to all).
#
# interactions.askUser lets the agent ask the thread a question (the Submit button) and wait for the answer. There are no
# tool approvals: the agent has no tool that writes.
apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata: {name: sre-triage, namespace: agent-kourier}
spec:
  agent:
    backendRef: {name: agents}
    namespace: kagent
    name: sandbox-sre
  identity:
    userId: agent-kourier-sre-triage
    tokenSecretRef: {name: sre-triage-token} # key token: an OIDC token the front door accepts; you make it
  chat:
    connectionRef: {name: slack}
    channel: CREPLACEME
    output: live
    triggers:
      - type: botMessage
        from: {botId: B0REPLACEME}
        preset: alertmanager
        match: {titleLink: 'receiver=slack-critical$'}
        exclude: {title: ' - Watchdog$'}
  interactions: {askUser: true}
