# The A2A server that hosts the agent, which has Bitbucket tools of its own. The url is a placeholder (REPLACE-ME): put
# your agent's here. For the a2a dialect it is the exact JSON-RPC endpoint, used as written.
apiVersion: agentkourier.dev/v1alpha1
kind: AgentBackend
metadata: {name: bitbucket-agent, namespace: acme-webhooks}
spec:
  dialect: a2a
  url: http://REPLACE-ME.agents.svc.cluster.local:8080
