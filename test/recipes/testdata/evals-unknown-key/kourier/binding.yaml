apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata: { name: alerts, namespace: recipe }
spec:
  agent:
    backendRef: { name: agents }
    name: helper
    namespace: recipe
  identity: { userId: agent-kourier-alerts }
  chat:
    connectionRef: { name: slack }
    channel: CREPLACEME
    triggers:
      - type: mention
      - type: botMessage
        from: { botId: B0REPLACEME } # the incoming webhook's bot
        preset: alertmanager
        match: { titleLink: 'receiver=slack-critical$' }
        exclude: { title: ' - Watchdog$' }
