# Each case is one message, judged alone: cooldown, thread keys across messages and limits are not evaluated.
cases:
  - name: a firing alert
    binding: recipe/alerts
    message:
      bot: B0REPLACEME
      title: 'FIRING (1) - KubePodCrashLooping'
      link: 'https://alertmanager.example.com/#/alerts?receiver=slack-critical'
      fallback: '[FIRING:1] KubePodCrashLooping shop (checkout-7d9f8b6c5-x2x4k critical) | https://alertmanager.example.com/#/alerts?receiver=slack-critical'
    expect:
      outcome: matched
      trigger: 1
      fields: { state: FIRING, alertname: KubePodCrashLooping, key: KubePodCrashLooping shop }

  - name: a resolved alert behind a cluster tag
    binding: recipe/alerts
    message:
      bot: B0REPLACEME
      title: '[prod] RESOLVED - KubePodCrashLooping'
      link: 'https://alertmanager.example.com/#/alerts?receiver=slack-critical'
      fallback: '[RESOLVED] KubePodCrashLooping shop (checkout-7d9f8b6c5-x2x4k critical) | https://alertmanager.example.com/#/alerts?receiver=slack-critical'
    expect:
      outcome: matched
      fields: { state: RESOLVED, alertname: KubePodCrashLooping, key: KubePodCrashLooping shop }

  - name: the Watchdog heartbeat is excluded
    binding: recipe/alerts
    message:
      bot: B0REPLACEME
      title: 'FIRING (1) - Watchdog'
      link: 'https://alertmanager.example.com/#/alerts?receiver=slack-critical'
      fallback: '[FIRING:1] Watchdog  (none prometheus) | https://alertmanager.example.com/#/alerts?receiver=slack-critical'
    expect: { outcome: excluded }

  - name: another receiver is not taken
    binding: recipe/alerts
    message:
      bot: B0REPLACEME
      title: 'FIRING (1) - KubeAPIErrorBudgetBurn'
      link: 'https://alertmanager.example.com/#/alerts?receiver=slack-heartbeat'
      fallback: '[FIRING:1] KubeAPIErrorBudgetBurn kube-system (critical) | https://alertmanager.example.com/#/alerts?receiver=slack-heartbeat'
    expect: { outcome: unmatched }

  - name: a message in Grafana's format is not taken
    binding: recipe/alerts
    message:
      bot: B0REPLACEME
      title: 'FIRING: HighRequestLatency (payments)'
      link: 'https://alertmanager.example.com/#/alerts?receiver=slack-critical'
      fallback: 'FIRING: HighRequestLatency (payments)'
    expect: { outcome: unmatched }

  - name: another bot's post
    binding: recipe/alerts
    message:
      bot: B0SOMEOTHER
      title: 'FIRING (1) - KubePodCrashLooping'
      link: 'https://alertmanager.example.com/#/alerts?receiver=slack-critical'
      fallback: '[FIRING:1] KubePodCrashLooping shop (critical) | https://alertmanager.example.com/#/alerts?receiver=slack-critical'
    expect: { outcome: other_bot }

  - name: a person's message
    binding: recipe/alerts
    message: { user: U0PERSON, text: 'can someone look at the checkout pod?' }
    expect: { outcome: person }

  - name: a reply inside an alert thread
    binding: recipe/alerts
    message:
      bot: B0REPLACEME
      inThread: true
      title: 'FIRING (1) - KubePodCrashLooping'
      link: 'https://alertmanager.example.com/#/alerts?receiver=slack-critical'
      fallback: '[FIRING:1] KubePodCrashLooping shop (critical) | https://alertmanager.example.com/#/alerts?receiver=slack-critical'
    expect: { outcome: ignored }
