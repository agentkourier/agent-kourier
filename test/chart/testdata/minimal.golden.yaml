---
apiVersion: v1
data:
  agentbackend-agents.yaml: |
    apiVersion: agentkourier.dev/v1alpha1
    kind: AgentBackend
    metadata:
      name: agents
      namespace: agent-kourier
    spec:
      dialect: kagent-v1
      url: http://kagent-frontdoor.kagent.svc.cluster.local:4180
  binding-sre.yaml: |
    apiVersion: agentkourier.dev/v1alpha1
    kind: Binding
    metadata:
      name: sre
      namespace: agent-kourier
    spec:
      agent:
        backendRef:
          name: agents
        name: k8s-agent
        namespace: kagent
      chat:
        channel: C0123456789
        connectionRef:
          name: slack-main
        output: live
      identity:
        tokenSecretRef:
          name: agent-kourier-agent-token
        userId: agent-kourier-sre
  chatconnection-slack-main.yaml: |
    apiVersion: agentkourier.dev/v1alpha1
    kind: ChatConnection
    metadata:
      name: slack-main
      namespace: agent-kourier
    spec:
      credentialsSecretRef:
        name: slack-main
      platform: slack
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: agent-kourier
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: agent-kourier
    app.kubernetes.io/version: dev
    helm.sh/chart: agent-kourier-0.1.2
  name: agent-kourier-config
  namespace: agent-kourier
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: agent-kourier
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: agent-kourier
    app.kubernetes.io/version: dev
    helm.sh/chart: agent-kourier-0.1.2
  name: agent-kourier
  namespace: agent-kourier
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: agent-kourier
      app.kubernetes.io/name: agent-kourier
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/config: 4ec15fb339708cde16d8b6ed183b8230f85adfa3792179dc08db320c4e6cc130
      labels:
        app.kubernetes.io/instance: agent-kourier
        app.kubernetes.io/name: agent-kourier
    spec:
      containers:
      - env:
        - name: AGENTKOURIER_CONFIG_DIR
          value: /etc/agent-kourier
        - name: AGENTKOURIER_STORE
          value: sqlite
        - name: AGENTKOURIER_DB_PATH
          value: /data/agent-kourier.db
        - name: AGENTKOURIER_LISTEN
          value: :8080
        - name: AGENTKOURIER_LOG_LEVEL
          value: info
        - name: AGENTKOURIER_KLOG_V
          value: "0"
        image: registry.example.test/agent-kourier:v0.1.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        name: agent-kourier
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 40
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
        volumeMounts:
        - mountPath: /etc/agent-kourier
          name: config
          readOnly: true
        - mountPath: /data
          name: data
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agent-kourier
      terminationGracePeriodSeconds: 40
      volumes:
      - configMap:
          name: agent-kourier-config
        name: config
      - name: data
        persistentVolumeClaim:
          claimName: agent-kourier-data
      - emptyDir: {}
        name: tmp
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/instance: agent-kourier
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: agent-kourier
    app.kubernetes.io/version: dev
    helm.sh/chart: agent-kourier-0.1.2
  name: agent-kourier-data
  namespace: agent-kourier
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/instance: agent-kourier
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: agent-kourier
    app.kubernetes.io/version: dev
    helm.sh/chart: agent-kourier-0.1.2
  name: agent-kourier-secrets
  namespace: agent-kourier
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/instance: agent-kourier
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: agent-kourier
    app.kubernetes.io/version: dev
    helm.sh/chart: agent-kourier-0.1.2
  name: agent-kourier-secrets
  namespace: agent-kourier
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-kourier-secrets
subjects:
- kind: ServiceAccount
  name: agent-kourier
  namespace: agent-kourier
---
apiVersion: v1
automountServiceAccountToken: true
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/instance: agent-kourier
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: agent-kourier
    app.kubernetes.io/version: dev
    helm.sh/chart: agent-kourier-0.1.2
  name: agent-kourier
  namespace: agent-kourier
