---
apiVersion: v1
data:
  agentbackend-agents.yaml: |
    apiVersion: agentkourier.dev/v1alpha1
    kind: AgentBackend
    metadata:
      name: agents
      namespace: agent-kourier-system
    spec:
      allowedNamespaces:
      - sre
      dialect: kagent-v1
      headers:
      - name: X-Request-Source
        valueSecretRef:
          key: source
          name: agent-kourier-source
      url: http://kagent-frontdoor.kagent.svc.cluster.local:4180
  binding-sre-alerts.yaml: |
    apiVersion: agentkourier.dev/v1alpha1
    kind: Binding
    metadata:
      name: sre-alerts
      namespace: sre
    spec:
      agent:
        backendRef:
          name: agents
        name: k8s-agent
        namespace: kagent
      chat:
        channel: C0123456789
        connectionRef:
          name: slack-main
        output: live
        triggers:
        - extract:
            alertname:
              field: title
              regex: ^(?:\[[^\]]{1,32}\] )?(?:FIRING \(\d+\)|RESOLVED) - (?P<alertname>.+)$
            key:
              field: fallback
              regex: ^\[[A-Z]+(?::\d+)?\] (?P<key>[^(|]*[^(|\s])
            state:
              field: title
              regex: ^(?:\[[^\]]{1,32}\] )?(?P<state>FIRING|RESOLVED)
          from:
            id: B0123456789
          limits:
            maxRunsPerDay: 40
            rateLimit:
              maxConcurrent: 2
              maxRuns: 5
              per: 10m
          match:
            fallback: '^\[(?:FIRING(?::\d+)?|RESOLVED)\] '
            link: receiver=slack-critical$
            title: '^(?:\[[^\]]{1,32}\] )?(?:FIRING \(\d+\)|RESOLVED) - '
          promptTemplate: |
            An alert is {{ .State }} in channel {{ .Channel }}: {{ .Fields.alertname }}.
            Investigate it with your read-only tools. Report the likely cause, the evidence you
            checked, and the next steps a person should take.
          thread:
            by: key
            closeWhen:
              state: RESOLVED
            cooldown: 4h
          type: botMessage
      identity:
        tokenSecretRef:
          name: agent-kourier-agent-token
        userId: agent-kourier-sre-alerts
      interactions:
        askUser: false
  chatconnection-slack-main.yaml: |
    apiVersion: agentkourier.dev/v1alpha1
    kind: ChatConnection
    metadata:
      name: slack-main
      namespace: agent-kourier-system
    spec:
      allowedNamespaces:
      - sre
      credentialsSecretRef:
        name: slack-main
      platform: slack
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: agent-kourier
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: agent-kourier
    app.kubernetes.io/version: dev
    helm.sh/chart: agent-kourier-0.5.0
  name: agent-kourier-config
  namespace: agent-kourier-system
