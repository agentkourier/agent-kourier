apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/instance: agent-kourier
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: agent-kourier
    app.kubernetes.io/version: dev
    helm.sh/chart: agent-kourier-0.1.0
  name: agent-kourier-token-refresh
  namespace: agent-kourier-system
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 180
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: agent-kourier
            app.kubernetes.io/name: agent-kourier-token-refresh
        spec:
          containers:
          - command:
            - sh
            - -c
            - |
              set -eu
              tok=$(curl -sf -m 20 -d grant_type=password -d "client_id=${DEX_CLIENT_ID}" --data-urlencode "scope=${DEX_SCOPE}" \
                --variable '%DEX_CLIENT_SECRET' --variable '%DEX_USERNAME' --variable '%DEX_PASSWORD' \
                --expand-data 'client_secret={{DEX_CLIENT_SECRET:url}}' --expand-data 'username={{DEX_USERNAME:url}}' \
                --expand-data 'password={{DEX_PASSWORD:url}}' \
                "${DEX_TOKEN_URL}" | sed -n 's/.*"id_token":"\([^"]*\)".*/\1/p')
              case "${tok}" in
                [A-Za-z0-9_-]*.[A-Za-z0-9_-]*.[A-Za-z0-9_-]*) ;;
                *) echo "Dex gave no ID token" >&2; exit 1 ;;
              esac
              printf '{"data":{"%s":"%s"}}' "${TARGET_KEY}" "$(printf %s "${tok}" | base64 | tr -d '\n')" |
                curl -sf -m 20 -o /dev/null -X PATCH --data-binary @- \
                  --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                  --variable SA@/var/run/secrets/kubernetes.io/serviceaccount/token \
                  --expand-header "Authorization: Bearer {{SA:trim}}" \
                  -H 'Content-Type: application/merge-patch+json' \
                  "${TARGET_URL}"
              echo "refreshed the Binding's Dex token"
            env:
            - name: DEX_TOKEN_URL
              value: https://dex.example.test/dex/token
            - name: DEX_CLIENT_ID
              value: agent-kourier-binding
            - name: DEX_SCOPE
              value: openid email
            - name: TARGET_URL
              value: https://kubernetes.default.svc/api/v1/namespaces/sre/secrets/agent-kourier-agent-token
            - name: TARGET_KEY
              value: token
            - name: DEX_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: clientSecret
                  name: agent-kourier-dex-client
            - name: DEX_USERNAME
              valueFrom:
                secretKeyRef:
                  key: username
                  name: agent-kourier-dex-client
            - name: DEX_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: agent-kourier-dex-client
            image: curlimages/curl@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
            name: refresh
            resources:
              limits:
                memory: 64Mi
              requests:
                cpu: 10m
                memory: 16Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: agent-kourier-token-refresh
  schedule: '*/30 * * * *'
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: agent-kourier
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: agent-kourier
    app.kubernetes.io/version: dev
    helm.sh/chart: agent-kourier-0.1.0
  name: agent-kourier
  namespace: agent-kourier-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: agent-kourier
      app.kubernetes.io/name: agent-kourier
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/config: d9f33082dd67860b73994ddc088a55e74d1f4876b09c5338f234220a59eb9501
        example.test/scrape: "false"
      labels:
        app.kubernetes.io/instance: agent-kourier
        app.kubernetes.io/name: agent-kourier
        example.test/team: platform
    spec:
      containers:
      - env:
        - name: AGENTKOURIER_CONFIG_DIR
          value: /etc/agent-kourier
        - name: AGENTKOURIER_STORE
          value: sqlite
        - name: AGENTKOURIER_DB_PATH
          value: /data/courier.db
        - name: AGENTKOURIER_LISTEN
          value: :8080
        - name: AGENTKOURIER_LOG_LEVEL
          value: debug
        - name: AGENTKOURIER_KLOG_V
          value: "0"
        - name: AGENTKOURIER_SYNC_TIMEOUT
          value: 45s
        - name: AGENTKOURIER_AUDIT_RETENTION
          value: 8760h
        - name: AGENTKOURIER_ENVIRONMENT
          value: production
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: https://otel-collector.observability.svc.cluster.local:4318
        - name: OTEL_EXPORTER_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              key: headers
              name: agent-kourier-otlp
        image: registry.example.test/platform/agent-kourier@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        name: agent-kourier
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 40
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
        volumeMounts:
        - mountPath: /etc/agent-kourier
          name: config
          readOnly: true
        - mountPath: /data
          name: data
        - mountPath: /tmp
          name: tmp
      imagePullSecrets:
      - name: registry-pull
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-cluster-critical
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agent-kourier
      terminationGracePeriodSeconds: 40
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: platform
      volumes:
      - configMap:
          name: agent-kourier-config
        name: config
      - name: data
        persistentVolumeClaim:
          claimName: agent-kourier-data
      - emptyDir: {}
        name: tmp
