---
apiVersion: v1
data:
  agentbackend-agents.yaml: |
    apiVersion: agentkourier.dev/v1alpha1
    kind: AgentBackend
    metadata:
      name: agents
      namespace: agent-kourier-system
    spec:
      allowedNamespaces:
      - sre
      dialect: kagent-v1
      headers:
      - name: X-Request-Source
        valueSecretRef:
          key: source
          name: agent-kourier-source
      url: http://kagent-frontdoor.kagent.svc.cluster.local:4180
  binding-sre-alerts.yaml: |
    apiVersion: agentkourier.dev/v1alpha1
    kind: Binding
    metadata:
      name: sre-alerts
      namespace: sre
    spec:
      agent:
        backendRef:
          name: agents
        name: k8s-agent
        namespace: kagent
      chat:
        channel: C0123456789
        connectionRef:
          name: slack-main
        output: live
        triggers:
        - from:
            botId: B0123456789
          match:
            titleLink: receiver=slack-critical$
          preset: alertmanager
          type: botMessage
      identity:
        tokenSecretRef:
          name: agent-kourier-agent-token
        userId: agent-kourier-sre-alerts
      interactions:
        askUser: false
  chatconnection-slack-main.yaml: |
    apiVersion: agentkourier.dev/v1alpha1
    kind: ChatConnection
    metadata:
      name: slack-main
      namespace: agent-kourier-system
    spec:
      allowedNamespaces:
      - sre
      credentialsSecretRef:
        name: slack-main
      mode: socket
      platform: slack
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: agent-kourier
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: agent-kourier
    app.kubernetes.io/version: dev
    helm.sh/chart: agent-kourier-0.1.0
  name: agent-kourier-config
  namespace: agent-kourier-system
