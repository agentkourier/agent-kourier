apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: agent-kourier
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: agent-kourier
    app.kubernetes.io/version: dev
    helm.sh/chart: agent-kourier-0.5.0
  name: agent-kourier
  namespace: agent-kourier-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: agent-kourier
      app.kubernetes.io/name: agent-kourier
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/config: f6ccb03699e7dbcea5b96c9d03653c7fa5f8c6fc6f1ac3c379241ce8458799b5
        example.test/scrape: "false"
      labels:
        app.kubernetes.io/instance: agent-kourier
        app.kubernetes.io/name: agent-kourier
        example.test/team: platform
    spec:
      containers:
      - env:
        - name: AGENTKOURIER_CONFIG_DIR
          value: /etc/agent-kourier
        - name: AGENTKOURIER_STORE
          value: sqlite
        - name: AGENTKOURIER_DB_PATH
          value: /data/agent-kourier.db
        - name: AGENTKOURIER_LISTEN
          value: :8080
        - name: AGENTKOURIER_CHAT_LISTEN
          value: :8081
        - name: AGENTKOURIER_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: AGENTKOURIER_POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: AGENTKOURIER_LOG_LEVEL
          value: debug
        - name: AGENTKOURIER_KLOG_V
          value: "0"
        - name: AGENTKOURIER_SYNC_TIMEOUT
          value: 45s
        - name: AGENTKOURIER_AUDIT_RETENTION
          value: 8760h
        - name: GOMEMLIMIT
          value: "429496729"
        - name: AGENTKOURIER_ENVIRONMENT
          value: production
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: https://otel-collector.observability.svc.cluster.local:4318
        - name: OTEL_EXPORTER_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              key: headers
              name: agent-kourier-otlp
        image: registry.example.test/platform/agent-kourier@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        name: agent-kourier
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8081
          name: chat
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 40
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
        volumeMounts:
        - mountPath: /etc/agent-kourier
          name: config
          readOnly: true
        - mountPath: /data
          name: data
        - mountPath: /tmp
          name: tmp
      imagePullSecrets:
      - name: registry-pull
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-cluster-critical
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agent-kourier
      terminationGracePeriodSeconds: 40
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: platform
      volumes:
      - configMap:
          name: agent-kourier-config
        name: config
      - name: data
        persistentVolumeClaim:
          claimName: agent-kourier-data
      - emptyDir: {}
        name: tmp
