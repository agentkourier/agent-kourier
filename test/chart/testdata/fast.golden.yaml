---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: agent-kourier
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: agent-kourier
    app.kubernetes.io/version: dev
    helm.sh/chart: agent-kourier-0.1.3
  name: agent-kourier
  namespace: agent-kourier
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: agent-kourier
      app.kubernetes.io/name: agent-kourier
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: agent-kourier
        app.kubernetes.io/name: agent-kourier
    spec:
      containers:
      - env:
        - name: AGENTKOURIER_CONFIG_DIR
          value: /etc/agent-kourier
        - name: AGENTKOURIER_STORE
          value: sqlite
        - name: AGENTKOURIER_DB_PATH
          value: /data/agent-kourier.db
        - name: AGENTKOURIER_LISTEN
          value: :8080
        - name: AGENTKOURIER_LOG_LEVEL
          value: info
        - name: AGENTKOURIER_KLOG_V
          value: "0"
        - name: AGENTKOURIER_SLACK_API_URL
          value: http://fakeslack.e2e.svc.cluster.local:8080/
        image: agent-kourier-e2e/agent-kourier-testhooks:dev
        imagePullPolicy: Never
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        name: agent-kourier
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 40
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
        volumeMounts:
        - mountPath: /etc/agent-kourier
          name: config
          readOnly: true
        - mountPath: /data
          name: data
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agent-kourier
      terminationGracePeriodSeconds: 40
      volumes:
      - configMap:
          name: agent-kourier-config
        name: config
      - name: data
        persistentVolumeClaim:
          claimName: agent-kourier-data
      - emptyDir: {}
        name: tmp
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/instance: agent-kourier
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: agent-kourier
    app.kubernetes.io/version: dev
    helm.sh/chart: agent-kourier-0.1.3
  name: agent-kourier-data
  namespace: agent-kourier
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/instance: agent-kourier
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: agent-kourier
    app.kubernetes.io/version: dev
    helm.sh/chart: agent-kourier-0.1.3
  name: agent-kourier-secrets
  namespace: agent-kourier
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/instance: agent-kourier
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: agent-kourier
    app.kubernetes.io/version: dev
    helm.sh/chart: agent-kourier-0.1.3
  name: agent-kourier-secrets
  namespace: agent-kourier
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-kourier-secrets
subjects:
- kind: ServiceAccount
  name: agent-kourier
  namespace: agent-kourier
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: agent-kourier
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: agent-kourier
    app.kubernetes.io/version: dev
    helm.sh/chart: agent-kourier-0.1.3
  name: agent-kourier
  namespace: agent-kourier
spec:
  ports:
  - name: http
    port: 8080
    targetPort: http
  selector:
    app.kubernetes.io/instance: agent-kourier
    app.kubernetes.io/name: agent-kourier
  type: ClusterIP
---
apiVersion: v1
automountServiceAccountToken: true
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/instance: agent-kourier
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: agent-kourier
    app.kubernetes.io/version: dev
    helm.sh/chart: agent-kourier-0.1.3
  name: agent-kourier
  namespace: agent-kourier
