---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/instance: agent-kourier-sandbox
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: agent-kourier
    app.kubernetes.io/version: dev
    helm.sh/chart: agent-kourier-0.1.3
  name: agent-kourier-sandbox-token-refresh
  namespace: agent-kourier
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 180
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: agent-kourier-sandbox
            app.kubernetes.io/name: agent-kourier-token-refresh
        spec:
          containers:
          - command:
            - sh
            - -c
            - |
              set -eu
              tok=$(curl -sf -m 20 -d grant_type=password -d "client_id=${DEX_CLIENT_ID}" --data-urlencode "scope=${DEX_SCOPE}" \
                --variable '%DEX_CLIENT_SECRET' --variable '%DEX_USERNAME' --variable '%DEX_PASSWORD' \
                --expand-data 'client_secret={{DEX_CLIENT_SECRET:url}}' --expand-data 'username={{DEX_USERNAME:url}}' \
                --expand-data 'password={{DEX_PASSWORD:url}}' \
                "${DEX_TOKEN_URL}" | sed -n 's/.*"id_token":"\([^"]*\)".*/\1/p')
              case "${tok}" in
                [A-Za-z0-9_-]*.[A-Za-z0-9_-]*.[A-Za-z0-9_-]*) ;;
                *) echo "Dex gave no ID token" >&2; exit 1 ;;
              esac
              printf '{"data":{"%s":"%s"}}' "${TARGET_KEY}" "$(printf %s "${tok}" | base64 | tr -d '\n')" |
                curl -sf -m 20 -o /dev/null -X PATCH --data-binary @- \
                  --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                  --variable SA@/var/run/secrets/kubernetes.io/serviceaccount/token \
                  --expand-header "Authorization: Bearer {{SA:trim}}" \
                  -H 'Content-Type: application/merge-patch+json' \
                  "${TARGET_URL}"
              echo "refreshed the Binding's Dex token"
            env:
            - name: DEX_TOKEN_URL
              value: http://dex.dex.svc.cluster.local:5556/dex/token
            - name: DEX_CLIENT_ID
              value: agent-kourier-binding
            - name: DEX_SCOPE
              value: openid email
            - name: TARGET_URL
              value: https://kubernetes.default.svc/api/v1/namespaces/agent-kourier/secrets/agent-kourier-agent-token
            - name: TARGET_KEY
              value: token
            - name: DEX_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: clientSecret
                  name: agent-kourier-dex-client
            - name: DEX_USERNAME
              valueFrom:
                secretKeyRef:
                  key: username
                  name: agent-kourier-dex-client
            - name: DEX_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: agent-kourier-dex-client
            image: curlimages/curl@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
            name: refresh
            resources:
              limits:
                memory: 64Mi
              requests:
                cpu: 10m
                memory: 16Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: agent-kourier-sandbox-token-refresh
  schedule: 0 * * * *
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: agent-kourier-sandbox
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: agent-kourier
    app.kubernetes.io/version: dev
    helm.sh/chart: agent-kourier-0.1.3
  name: agent-kourier-sandbox
  namespace: agent-kourier
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: agent-kourier-sandbox
      app.kubernetes.io/name: agent-kourier
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: agent-kourier-sandbox
        app.kubernetes.io/name: agent-kourier
    spec:
      containers:
      - env:
        - name: AGENTKOURIER_CONFIG_DIR
          value: /etc/agent-kourier
        - name: AGENTKOURIER_STORE
          value: sqlite
        - name: AGENTKOURIER_DB_PATH
          value: /data/agent-kourier.db
        - name: AGENTKOURIER_LISTEN
          value: :8080
        - name: AGENTKOURIER_LOG_LEVEL
          value: info
        - name: AGENTKOURIER_KLOG_V
          value: "0"
        image: agent-kourier:dev
        imagePullPolicy: Never
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        name: agent-kourier
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 40
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
        volumeMounts:
        - mountPath: /etc/agent-kourier
          name: config
          readOnly: true
        - mountPath: /data
          name: data
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agent-kourier-sandbox
      terminationGracePeriodSeconds: 40
      volumes:
      - configMap:
          name: agent-kourier-sandbox-config
        name: config
      - name: data
        persistentVolumeClaim:
          claimName: agent-kourier-sandbox-data
      - emptyDir: {}
        name: tmp
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/instance: agent-kourier-sandbox
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: agent-kourier
    app.kubernetes.io/version: dev
    helm.sh/chart: agent-kourier-0.1.3
  name: agent-kourier-sandbox-data
  namespace: agent-kourier
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard
