---
apiVersion: agentkourier.dev/v1alpha1
kind: AgentBackend
metadata:
  labels:
    app.kubernetes.io/instance: agent-kourier
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: agent-kourier
    app.kubernetes.io/version: dev
    helm.sh/chart: agent-kourier-0.3.1
  name: agents
  namespace: agent-kourier
spec:
  dialect: kagent-v1
  headers:
  - name: X-Team
    valueSecretRef:
      key: team
      name: agents-team
  url: http://kagent-frontdoor.kagent.svc.cluster.local:4180
---
apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata:
  labels:
    app.kubernetes.io/instance: agent-kourier
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: agent-kourier
    app.kubernetes.io/version: dev
    helm.sh/chart: agent-kourier-0.3.1
  name: sre
  namespace: sre
spec:
  agent:
    backendRef:
      name: agents
      namespace: agent-kourier
    name: k8s-agent
    namespace: kagent
  chat:
    channel: C0123456789
    connectionRef:
      name: slack-main
      namespace: agent-kourier
    output: live
  identity:
    tokenSecretRef:
      name: agent-kourier-agent-token
    userId: agent-kourier-sre
---
apiVersion: agentkourier.dev/v1alpha1
kind: ChatConnection
metadata:
  labels:
    app.kubernetes.io/instance: agent-kourier
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: agent-kourier
    app.kubernetes.io/version: dev
    helm.sh/chart: agent-kourier-0.3.1
  name: slack-main
  namespace: agent-kourier
spec:
  credentialsSecretRef:
    name: slack-main
  platform: slack
---
apiVersion: rbac.authorization.k8s.io/v1
