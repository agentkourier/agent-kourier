kind: Binding
metadata:
  name: alerts
  namespace: sre
spec:
  agent:
    backendRef: {name: kagent}
    name: k8s-agent
    namespace: kagent
  identity:
    userId: agent-kourier-sre
  chat:
    connectionRef: {name: slack}
    channel: C0123456789
