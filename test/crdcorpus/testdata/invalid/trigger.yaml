# want: spec.chat.triggers[1].from.kind: unsupported value "webhook"
# schema: refuses
apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata:
  name: alerts
  namespace: sre
spec:
  agent:
    backendRef: {name: kagent}
    name: k8s-agent
    namespace: kagent
  identity:
    userId: agent-kourier-sre
  chat:
    connectionRef: {name: slack}
    channel: C0123456789
    triggers:
      - {type: mention}
      - type: botMessage
        from: {id: B0123456789, kind: webhook}
        match: {title: "^FIRING"}
        extract:
          state: {field: title, regex: "(?P<state>FIRING|RESOLVED)"}
          key: {field: fallback, regex: "(?P<key>.+)"}
        thread: {by: key, cooldown: 2h, closeWhen: {state: RESOLVED}}
        limits: {rateLimit: {maxRuns: 5, per: 10m, maxConcurrent: 2}, maxRunsPerDay: 20}
        promptTemplate: "An alert is {{ .State }}: {{ .Key }}."
