# The most extract entries and as many closeWhen entries, and regexes of exactly 512 characters.
apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata:
  name: edges-extract
  namespace: sre
spec:
  agent:
    backendRef: {name: kagent}
    name: k8s-agent
    namespace: kagent
  identity:
    userId: agent-kourier-sre
  chat:
    connectionRef: {name: slack}
    channel: C0123456789
    triggers:
      - {type: mention}
      - type: botMessage
        from: {id: B0123456789}
        match:
          text: 
          title: b
          link: c
          fallback: d
          footer: e
          body: f
        extract:
          state: {field: title, regex: "(?P<state>FIRING|RESOLVED)"}
          key: {field: fallback, regex: "(?P<key>.+)"}
          e0: {field: text, regex: "(?P<e0>)"}
          e1: {field: text, regex: "(?P<e1>x)"}
          e2: {field: text, regex: "(?P<e2>x)"}
          e3: {field: text, regex: "(?P<e3>x)"}
          e4: {field: text, regex: "(?P<e4>x)"}
          e5: {field: text, regex: "(?P<e5>x)"}
          e6: {field: text, regex: "(?P<e6>x)"}
          e7: {field: text, regex: "(?P<e7>x)"}
          e8: {field: text, regex: "(?P<e8>x)"}
          e9: {field: text, regex: "(?P<e9>x)"}
          e10: {field: text, regex: "(?P<e10>x)"}
          e11: {field: text, regex: "(?P<e11>x)"}
          e12: {field: text, regex: "(?P<e12>x)"}
          e13: {field: text, regex: "(?P<e13>x)"}
          e14: {field: text, regex: "(?P<e14>x)"}
          e15: {field: text, regex: "(?P<e15>x)"}
          e16: {field: text, regex: "(?P<e16>x)"}
          e17: {field: text, regex: "(?P<e17>x)"}
          e18: {field: text, regex: "(?P<e18>x)"}
          e19: {field: text, regex: "(?P<e19>x)"}
          e20: {field: text, regex: "(?P<e20>x)"}
          e21: {field: text, regex: "(?P<e21>x)"}
          e22: {field: text, regex: "(?P<e22>x)"}
          e23: {field: text, regex: "(?P<e23>x)"}
          e24: {field: text, regex: "(?P<e24>x)"}
          e25: {field: text, regex: "(?P<e25>x)"}
          e26: {field: text, regex: "(?P<e26>x)"}
          e27: {field: text, regex: "(?P<e27>x)"}
          e28: {field: text, regex: "(?P<e28>x)"}
          e29: {field: text, regex: "(?P<e29>x)"}
        thread:
          by: key
          cooldown: 2h
          closeWhen:
            state: RESOLVED
            key: k
            e0: v
            e1: v
            e2: v
            e3: v
            e4: v
            e5: v
            e6: v
            e7: v
            e8: v
            e9: v
            e10: v
            e11: v
            e12: v
            e13: v
            e14: v
            e15: v
            e16: v
            e17: v
            e18: v
            e19: v
            e20: v
            e21: v
            e22: v
            e23: v
            e24: v
            e25: v
            e26: v
            e27: v
            e28: v
            e29: v
        limits: {rateLimit: {maxRuns: 5, per: 10m, maxConcurrent: 2}, maxRunsPerDay: 20}
        promptTemplate: "An alert is {{ .State }}: {{ .Key }}."
        exclude: {text: xx, title: yy, link: zz, fallback: ww, footer: vv, body: uu}
