        extract:
          state: {field: title, regex: "(?P<state>FIRING|RESOLVED)"}
          key: {field: fallback, regex: "(?P<key>.+)"}
        thread: {by: key, cooldown: 5.h, closeWhen: {state: RESOLVED}, maxIdle: "+10h"}
        limits: {rateLimit: {maxRuns: 5, per: 10000ms, maxConcurrent: 2}, maxRunsPerDay: 20}
