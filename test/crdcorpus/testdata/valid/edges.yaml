# The longest free text: a 253-character agent name, a 256-character user ID and an 8192-character prompt template.
apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata:
  name: edges-longest-text
  namespace: sre
spec:
  agent:
    backendRef: {name: kagent}
    name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    namespace: kagent
  identity:
    userId: uuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuu
  chat:
    connectionRef: {name: slack}
    channel: C0123456789
    triggers:
      - {type: mention}
      - type: botMessage
        from: {id: B0123456789}
        match: {title: "^FIRING"}
        extract:
          state: {field: title, regex: "(?P<state>FIRING|RESOLVED)"}
          key: {field: fallback, regex: "(?P<key>.+)"}
        thread: {by: key, cooldown: 2h, closeWhen: {state: RESOLVED}}
        limits: {rateLimit: {maxRuns: 5, per: 10m, maxConcurrent: 2}, maxRunsPerDay: 20}
        promptTemplate: ""
---
# A prompt template of everything the walk allows: if and else if, with, an entry by name and by index, and every function of the allow-list.
apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata:
  name: edges-template-allowed
  namespace: sre
spec:
  agent:
    backendRef: {name: kagent}
    name: k8s-agent
    namespace: kagent
  identity:
    userId: agent-kourier-sre
  chat:
    connectionRef: {name: slack}
    channel: C0123456789
    triggers:
      - {type: mention}
      - type: botMessage
        from: {id: B0123456789}
        match: {title: "^FIRING"}
        extract:
          state: {field: title, regex: "(?P<state>FIRING|RESOLVED)"}
          key: {field: fallback, regex: "(?P<key>.+)"}
        thread: {by: key, cooldown: 2h, closeWhen: {state: RESOLVED}}
        limits: {rateLimit: {maxRuns: 5, per: 10m, maxConcurrent: 2}, maxRunsPerDay: 20}
        promptTemplate: |
          {{ if and (eq .State "FIRING") (ne .Channel "") (not (lt .Source "a")) }}{{ .Fields.state }}{{ else if or (ge .Key "a") (gt .Link "a") (le .Source "a") }}{{ index .Fields "key" }}{{ end }}
          {{ with .Fields.key }}{{ $.Fields.state }} {{ slice $.Fields.key 0 2 }} {{ len $.Fields.key }}{{ end }}
---
