# Every spelling of a duration that time.ParseDuration reads, one in each trigger: units of every size, a sign, a fraction without a leading digit, and two units in one value. The micro sign is U+00B5 in one and U+03BC in the other.
apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata:
  name: edges-durations
  namespace: sre
spec:
  agent:
    backendRef: {name: kagent}
    name: k8s-agent
    namespace: kagent
  identity:
    userId: agent-kourier-sre
  chat:
    connectionRef: {name: slack}
    channel: C0123456789
    triggers:
      - {type: mention}
      - type: botMessage
        from: {id: B0000000000}
        match: {title: "^FIRING"}
        extract:
          state: {field: title, regex: "(?P<state>FIRING|RESOLVED)"}
          key: {field: fallback, regex: "(?P<key>.+)"}
        thread: {by: key, cooldown: ".5h", closeWhen: {state: RESOLVED}, maxIdle: 1h}
        limits: {rateLimit: {maxRuns: 5, per: 10s, maxConcurrent: 2}, maxRunsPerDay: 20}
