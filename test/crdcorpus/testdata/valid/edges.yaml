# The longest names and the keys the grammar allows: a 253-character dotted Secret name, a 256-character header name, 32 headers, 63-character and one-character namespace labels, a key with a leading dot and an explicit empty key.
apiVersion: agentkourier.dev/v1alpha1
kind: AgentBackend
metadata:
  name: edges
  namespace: sre
spec:
  dialect: a2a
  url: "http://kagent.kagent:8083/"
