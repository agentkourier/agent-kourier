# The longest chat identifiers and names: a channel, a sender and an approver group of 32 characters, a reaction name of 100,
# a mention name of 63 and a user of 21, an extract name of 63 and a closeWhen value of 256.
apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata:
  name: edges-longest-ids
  namespace: sre
spec:
  agent:
    backendRef: {name: kagent}
    name: k8s-agent
    namespace: kagent
  identity:
    userId: agent-kourier-sre
  chat:
    connectionRef: {name: slack}
    channel: C0000000000000000000000000000000
    acknowledgment: {emoji: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
    mentions: [{name: mmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmm, user: U00000000000000000000}]
    triggers:
      - {type: mention}
      - type: botMessage
        from: {id: B0000000000000000000000000000000}
        match: {title: "^FIRING"}
        extract:
          state: {field: title, regex: "(?P<state>FIRING|RESOLVED)"}
          key: {field: fallback, regex: "(?P<key>.+)"}
          eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee: {field: text, regex: "(?P<eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee>x)"}
        thread: {by: key, cooldown: 2h, closeWhen: {state: vvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvv}}
        limits: {rateLimit: {maxRuns: 5, per: 10m, maxConcurrent: 2}, maxRunsPerDay: 20}
        promptTemplate: "An alert is {{ .State }}: {{ .Key }}."
  interactions:
    toolApprovals: true
    approverGroups: [S0000000000000000000000000000000]
