        extract:
          state: {field: title, regex: "(?P<state>FIRING|RESOLVED)"}
          key: {field: fallback, regex: "(?P<key>.+)"}
        thread: {by: key, cooldown: 1h30m, closeWhen: {state: RESOLVED}, maxIdle: 3h}
        limits: {rateLimit: {maxRuns: 5, per: "10000000µs", maxConcurrent: 2}, maxRunsPerDay: 20}
        promptTemplate: "An alert is {{ .State }}: {{ .Key }}."
      - type: botMessage
        from: {id: B0000000004}
        match: {title: "^FIRING"}
        extract:
          state: {field: title, regex: "(?P<state>FIRING|RESOLVED)"}
          key: {field: fallback, regex: "(?P<key>.+)"}
        thread: {by: key, cooldown: 90m, closeWhen: {state: RESOLVED}, maxIdle: 3h}
        limits: {rateLimit: {maxRuns: 5, per: "10000000μs", maxConcurrent: 2}, maxRunsPerDay: 20}
        promptTemplate: "An alert is {{ .State }}: {{ .Key }}."
      - type: botMessage
