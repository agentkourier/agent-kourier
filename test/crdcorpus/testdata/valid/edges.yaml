---
# A Binding that writes out empty the seven values Default fills or Validate tests only when set: output, progress, threadReplies, botMentions, acknowledgment.emoji, from.kind and thread.by. The broker accepts every one, so the schema must.
apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata:
  name: edges-empty
  namespace: sre
spec:
  agent:
    backendRef: {name: kagent}
    name: k8s-agent
    namespace: kagent
  identity:
    userId: agent-kourier-sre
  chat:
    connectionRef: {name: slack}
    channel: C0123456789
    output: ""
    progress: ""
    threadReplies: ""
    botMentions: ""
    acknowledgment: {emoji: ""}
    triggers:
      - {type: mention}
      - type: botMessage
        from: {id: B0123456789, kind: ""}
        promptTemplate: x
        limits: {rateLimit: {maxRuns: 1, per: 10s, maxConcurrent: 1}, maxRunsPerDay: 0}
        thread: {by: ""}
---
# A zero duration, which the broker reads as unset and defaults: a bare 0, and 0s.
