      - {type: botMessage, from: {id: B0000000004}, limits: {rateLimit: {maxRuns: 1, per: 10000ms, maxConcurrent: 1}, maxRunsPerDay: 0}, promptTemplate: "x"}
      - {type: botMessage, from: {id: B0000000005}, limits: {rateLimit: {maxRuns: 1, per: 1m, maxConcurrent: 1}, maxRunsPerDay: 0}, promptTemplate: "x"}
      - {type: botMessage, from: {id: B0000000006}, limits: {rateLimit: {maxRuns: 1, per: 0.5h, maxConcurrent: 1}, maxRunsPerDay: 0}, promptTemplate: "x"}
      - {type: botMessage, from: {id: B0000000007}, limits: {rateLimit: {maxRuns: 1, per: +1h, maxConcurrent: 1}, maxRunsPerDay: 0}, promptTemplate: "x"}
      - {type: botMessage, from: {id: B0000000008}, limits: {rateLimit: {maxRuns: 1, per: 10s, maxConcurrent: 1}, maxRunsPerDay: 0}, promptTemplate: "x", extract: {key: {field: title, regex: "(?P<key>.+)"}, state: {field: text, regex: "(?<state>FIRING|RESOLVED)"}}, thread: {by: key, cooldown: "1m", closeWhen: {state: RESOLVED}}}
      - {type: botMessage, from: {id: B0000000009}, limits: {rateLimit: {maxRuns: 1, per: 10s, maxConcurrent: 1}, maxRunsPerDay: 0}, promptTemplate: "x", extract: {key: {field: title, regex: "(?P<key>.+)"}, state: {field: text, regex: "(?<state>FIRING|RESOLVED)"}}, thread: {by: key, cooldown: "168h", closeWhen: {state: RESOLVED}}}
