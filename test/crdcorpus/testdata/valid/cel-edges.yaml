# Mention names that contain a broadcast word without being one.
apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata: {name: cel-mentions, namespace: sre}
spec:
  agent: {backendRef: {name: kagent}, name: k8s-agent, namespace: kagent}
  identity: {userId: u}
  chat:
    connectionRef: {name: slack}
    channel: C0123456789
    mentions: [{name: hereby, user: U0123456789}, {name: channel-2, user: U0123456789}, {name: everyone1, user: U0123456789}, {name: here1, user: U0123456789}, {name: chann, user: U0123456789}, {name: a-here, user: U0123456789}]
---
# Trigger: every optional field of a mention trigger written out empty, which the broker reads as unset.
apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata: {name: cel-mention-0, namespace: sre}
spec:
  agent: {backendRef: {name: kagent}, name: k8s-agent, namespace: kagent}
  identity: {userId: u}
  chat:
    connectionRef: {name: slack}
    channel: C0123456789
    triggers: [{type: mention, match: {}, exclude: {}, extract: {}, thread: {}, limits: {}, promptTemplate: ""}]
---
# Trigger: a mention trigger whose thread is all zero values, which the broker reads as unset.
apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata: {name: cel-mention-1, namespace: sre}
spec:
  agent: {backendRef: {name: kagent}, name: k8s-agent, namespace: kagent}
  identity: {userId: u}
  chat:
    connectionRef: {name: slack}
    channel: C0123456789
    triggers: [{type: mention, thread: {by: "", cooldown: "0s", maxIdle: "0", closeWhen: {}}}]
---
# Trigger: a mention trigger whose thread durations are signed zeros, which the broker reads as unset.
apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata: {name: cel-mention-2, namespace: sre}
spec:
  agent: {backendRef: {name: kagent}, name: k8s-agent, namespace: kagent}
  identity: {userId: u}
  chat:
    connectionRef: {name: slack}
    channel: C0123456789
    triggers: [{type: mention, thread: {cooldown: "-0", maxIdle: "+0s"}}]
---
# botMessage triggers with the rate window and the thread cooldown and maxIdle at the edges of their ranges, a maxIdle of exactly twice the cooldown, and a thread that is all zeros.
apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata: {name: cel-triggers-limits-thread, namespace: sre}
spec:
  agent: {backendRef: {name: kagent}, name: k8s-agent, namespace: kagent}
  identity: {userId: u}
  chat:
    connectionRef: {name: slack}
    channel: C0123456789
    triggers:
      - {type: mention}
      - {type: botMessage, from: {id: B0000000000}, limits: {rateLimit: {maxRuns: 1, per: 10s, maxConcurrent: 1}, maxRunsPerDay: 0}, promptTemplate: "x"}
