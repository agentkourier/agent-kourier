      - {type: botMessage, from: {id: B0000000011}, limits: {rateLimit: {maxRuns: 1, per: 10s, maxConcurrent: 1}, maxRunsPerDay: 0}, promptTemplate: "x", extract: {key: {field: title, regex: "(?P<key>.+)"}, state: {field: text, regex: "(?<state>FIRING|RESOLVED)"}}, thread: {by: key, cooldown: "1m", maxIdle: "2m", closeWhen: {state: RESOLVED}}}
      - {type: botMessage, from: {id: B0000000012}, limits: {rateLimit: {maxRuns: 1, per: 10s, maxConcurrent: 1}, maxRunsPerDay: 0}, promptTemplate: "x", extract: {key: {field: title, regex: "(?P<key>.+)"}, state: {field: text, regex: "(?<state>FIRING|RESOLVED)"}}, thread: {by: key, cooldown: "2h", maxIdle: "4h", closeWhen: {state: RESOLVED}}}
