# The Slack workspace, over Socket Mode. The Secret slack, in namespace agent-kourier, holds the keys botToken and
# appToken; you make it, and no token belongs in this file. Leave this file out if the ChatConnection is already in
# your config.
apiVersion: agentkourier.dev/v1alpha1
kind: ChatConnection
metadata: { name: slack, namespace: agent-kourier }
spec:
  platform: slack
  credentialsSecretRef: { name: slack }
